ke=\"#1f5fbf\" stroke-width=\"2\"><\u002Frect><\u002Fg><text x=\"302.0\" y=\"166\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"19\" font-weight=\"600\" fill=\"#0d1b2a\">H<tspan baseline-shift=\"sub\" font-size=\"11\">2<\u002Ftspan>CO<tspan baseline-shift=\"sub\" font-size=\"11\">3<\u002Ftspan><tspan baseline-shift=\"sub\" font-size=\"11\">(aq)<\u002Ftspan><\u002Ftext><text x=\"302.0\" y=\"205\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#1f5fbf\">weak acid<\u002Ftext><g filter=\"url(#bf-sh)\"><rect x=\"440\" y=\"135\" width=\"140\" height=\"50\" rx=\"25\" fill=\"#fdf6e6\" stroke=\"#b4790f\" stroke-width=\"2\"><\u002Frect><\u002Fg><text x=\"510.0\" y=\"166\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"19\" font-weight=\"600\" fill=\"#0d1b2a\">HCO<tspan baseline-shift=\"sub\" font-size=\"11\">3<\u002Ftspan><tspan baseline-shift=\"super\" font-size=\"11\">−<\u002Ftspan><tspan baseline-shift=\"sub\" font-size=\"11\">(aq)<\u002Ftspan><\u002Ftext><text x=\"510.0\" y=\"205\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#8a5a08\">conjugate base<\u002Ftext><g filter=\"url(#bf-sh)\"><rect x=\"622\" y=\"135\" width=\"118\" height=\"50\" rx=\"25\" fill=\"#fdeeed\" stroke=\"#b91c1c\" stroke-width=\"2\"><\u002Frect><\u002Fg><text x=\"681.0\" y=\"166\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"19\" font-weight=\"600\" fill=\"#0d1b2a\">H<tspan baseline-shift=\"sub\" font-size=\"11\">3<\u002Ftspan>O<tspan baseline-shift=\"super\" font-size=\"11\">+<\u002Ftspan><tspan baseline-shift=\"sub\" font-size=\"11\">(aq)<\u002Ftspan><\u002Ftext><text x=\"681.0\" y=\"205\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#b91c1c\">added acid<\u002Ftext><text x=\"601\" y=\"168\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"20\" fill=\"#10284a\">+<\u002Ftext><text x=\"199.0\" y=\"140\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10.5\" fill=\"#5b6a7f\">+ H<tspan baseline-shift=\"sub\" font-size=\"8\">2<\u002Ftspan>O<\u002Ftext><line x1=\"172\" y1=\"152\" x2=\"226\" y2=\"152\" stroke=\"#9aa8bd\" stroke-width=\"2\" marker-end=\"url(#bf-n)\"><\u002Fline><line x1=\"226\" y1=\"168\" x2=\"172\" y2=\"168\" stroke=\"#b91c1c\" stroke-width=\"3.5\" marker-end=\"url(#bf-r)\"><\u002Fline><text x=\"406.5\" y=\"140\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10.5\" fill=\"#5b6a7f\">+ H<tspan baseline-shift=\"sub\" font-size=\"8\">2<\u002Ftspan>O<\u002Ftext><line x1=\"379\" y1=\"152\" x2=\"434\" y2=\"152\" stroke=\"#9aa8bd\" stroke-width=\"2\" marker-end=\"url(#bf-n)\"><\u002Fline><line x1=\"434\" y1=\"168\" x2=\"379\" y2=\"168\" stroke=\"#b91c1c\" stroke-width=\"3.5\" marker-end=\"url(#bf-r)\"><\u002Fline><g filter=\"url(#bf-sh)\"><rect x=\"529\" y=\"252\" width=\"222\" height=\"80\" rx=\"12\" fill=\"#ffffff\" stroke=\"#dbe1ea\" stroke-width=\"1.5\"><\u002Frect><\u002Fg><circle cx=\"550\" cy=\"292\" r=\"13\" fill=\"#10284a\"><\u002Fcircle><text x=\"550\" y=\"297\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">1<\u002Ftext><text x=\"571\" y=\"276\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12.5\" font-weight=\"700\" fill=\"#0d1b2a\">Acid enters the blood<\u002Ftext><text x=\"571\" y=\"295\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#3c4a5c\">muscles release lactic acid,<\u002Ftext><text x=\"571\" y=\"313\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#3c4a5c\">adding extra H<tspan baseline-shift=\"sub\" font-size=\"8\">3<\u002Ftspan>O<tspan baseline-shift=\"super\" font-size=\"8\">+<\u002Ftspan><\u002Ftext><g filter=\"url(#bf-sh)\"><rect x=\"279\" y=\"252\" width=\"222\" height=\"80\" rx=\"12\" fill=\"#ffffff\" stroke=\"#dbe1ea\" stroke-width=\"1.5\"><\u002Frect><\u002Fg><circle cx=\"300\" cy=\"292\" r=\"13\" fill=\"#10284a\"><\u002Fcircle><text x=\"300\" y=\"297\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">2<\u002Ftext><text x=\"321\" y=\"276\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12.5\" font-weight=\"700\" fill=\"#0d1b2a\">HCO<tspan baseline-shift=\"sub\" font-size=\"9\">3<\u002Ftspan><tspan baseline-shift=\"super\" font-size=\"9\">−<\u002Ftspan> absorbs it<\u002Ftext><text x=\"321\" y=\"295\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#3c4a5c\">H<tspan baseline-shift=\"sub\" font-size=\"8\">3<\u002Ftspan>O<tspan baseline-shift=\"super\" font-size=\"8\">+<\u002Ftspan> + HCO<tspan baseline-shift=\"sub\" font-size=\"8\">3<\u002Ftspan><tspan baseline-shift=\"super\" font-size=\"8\">−<\u002Ftspan> → H<tspan baseline-shift=\"sub\" font-size=\"8\">2<\u002Ftspan>CO<tspan baseline-shift=\"sub\" font-size=\"8\">3<\u002Ftspan> + H<tspan baseline-shift=\"sub\" font-size=\"8\">2<\u002Ftspan>O<\u002Ftext><text x=\"321\" y=\"313\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#3c4a5c\">the conjugate base reacts<\u002Ftext><g filter=\"url(#bf-sh)\"><rect x=\"29\" y=\"252\" width=\"222\" height=\"80\" rx=\"12\" fill=\"#ffffff\" stroke=\"#dbe1ea\" stroke-width=\"1.5\"><\u002Frect><\u002Fg><circle cx=\"50\" cy=\"292\" r=\"13\" fill=\"#10284a\"><\u002Fcircle><text x=\"50\" y=\"297\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\">3<\u002Ftext><text x=\"71\" y=\"276\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12.5\" font-weight=\"700\" fill=\"#0d1b2a\">CO<tspan baseline-shift=\"sub\" font-size=\"9\">2<\u002Ftspan> is breathed out<\u002Ftext><text x=\"71\" y=\"295\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#3c4a5c\">H<tspan baseline-shift=\"sub\" font-size=\"8\">2<\u002Ftspan>CO<tspan baseline-shift=\"sub\" font-size=\"8\">3<\u002Ftspan> → CO<tspan baseline-shift=\"sub\" font-size=\"8\">2<\u002Ftspan> + H<tspan baseline-shift=\"sub\" font-size=\"8\">2<\u002Ftspan>O<\u002Ftext><text x=\"71\" y=\"313\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#3c4a5c\">so the pH barely falls<\u002Ftext><line x1=\"527\" y1=\"292\" x2=\"504\" y2=\"292\" stroke=\"#10284a\" stroke-width=\"2.5\" marker-end=\"url(#bf-k)\"><\u002Fline><line x1=\"277\" y1=\"292\" x2=\"254\" y2=\"292\" stroke=\"#10284a\" stroke-width=\"2.5\" marker-end=\"url(#bf-k)\"><\u002Fline><\u002Fsvg><\u002Ffigure>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;\">\n        <div style=\"background:#fdf6e6;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#8a5a08;margin-bottom:8px;\">Acid enters the blood (e.g. lactic acid during exercise)<\u002Fdiv>\n          <ol style=\"margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px;line-height:1.5;color:#3c4a5c;\">\n            <li><strong style=\"color:#0d1b2a;\">Change:<\u002Fstrong> [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] increases.<\u002Fli>\n            <li><strong style=\"color:#0d1b2a;\">Shift:<\u002Fstrong> the reverse reaction is favoured, to partially oppose the change.<\u002Fli>\n            <li><strong style=\"color:#0d1b2a;\">Species:<\u002Fstrong> H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> reacts with HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> to form H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub> and H<sub>2<\u002Fsub>O. The extra H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub> forms CO<sub>2<\u002Fsub>, which is breathed out.<\u002Fli>\n            <li><strong style=\"color:#0d1b2a;\">Result:<\u002Fstrong> [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] ends only slightly higher, so blood pH falls only slightly and stays within 7.35–7.45.<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div style=\"background:#e6ecf6;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Base enters the blood (OH<sup>−<\u002Fsup> is added)<\u002Fdiv>\n          <ol style=\"margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px;line-height:1.5;color:#3c4a5c;\">\n            <li><strong style=\"color:#0d1b2a;\">Change:<\u002Fstrong> OH<sup>−<\u002Fsup> reacts with H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> (forming 2H<sub>2<\u002Fsub>O), so [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] decreases.<\u002Fli>\n            <li><strong style=\"color:#0d1b2a;\">Shift:<\u002Fstrong> the forward reaction is favoured, to partially oppose the change.<\u002Fli>\n            <li><strong style=\"color:#0d1b2a;\">Species:<\u002Fstrong> H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub> donates H<sup>+<\u002Fsup> to water, forming more HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> and H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>.<\u002Fli>\n            <li><strong style=\"color:#0d1b2a;\">Result:<\u002Fstrong> [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] is partially restored, so blood pH rises only slightly and stays within 7.35–7.45.<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:13.5px;line-height:1.55;color:#8a5a08;background:#fdf6e6;border-left:3px solid #e8a317;padding:10px 12px;border-radius:0 4px 4px 0;\"><strong>Trap:<\u002Fstrong> Le Châtelier’s principle says the shift <em>partially<\u002Fem> opposes the change. The pH still moves a little. Writing “the pH stays the same” or “the change is cancelled” loses the mark.<\u002Fp>\n      <div style=\"border-top:1px solid #e7ecf3;margin:24px 0 18px;\"><\u002Fdiv>\n      <h4 style=\"margin:0 0 10px;font-size:18px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Examples of buffers<\u002Fh4>\n      <div style=\"overflow-x:auto;\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;min-width:560px;\">\n          <sc-raw-thead><sc-raw-tr style=\"text-align:left;\"><sc-raw-th style=\"padding:8px 8px 8px 0;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">Buffer<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#1f5fbf;\">Weak acid<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#8a5a08;\">Conjugate base<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px 0 8px 8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">Made from<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;border-bottom:1px solid #e7ecf3;\">Ethanoate<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;font-family:'IBM Plex Serif',Georgia,serif;\">CH<sub>3<\u002Fsub>COOH<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;font-family:'IBM Plex Serif',Georgia,serif;\">CH<sub>3<\u002Fsub>COO<sup>−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;border-bottom:1px solid #e7ecf3;color:#3c4a5c;\">ethanoic acid + sodium ethanoate<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;border-bottom:1px solid #e7ecf3;\">Ammonium<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;font-family:'IBM Plex Serif',Georgia,serif;\">NH<sub>4<\u002Fsub><sup>+<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;font-family:'IBM Plex Serif',Georgia,serif;\">NH<sub>3<\u002Fsub><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;border-bottom:1px solid #e7ecf3;color:#3c4a5c;\">ammonia + ammonium chloride (a basic buffer)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;border-bottom:1px solid #e7ecf3;\">Phosphate<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;font-family:'IBM Plex Serif',Georgia,serif;\">H<sub>2<\u002Fsub>PO<sub>4<\u002Fsub><sup>−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;font-family:'IBM Plex Serif',Georgia,serif;\">HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;border-bottom:1px solid #e7ecf3;color:#3c4a5c;\">NaH<sub>2<\u002Fsub>PO<sub>4<\u002Fsub> + Na<sub>2<\u002Fsub>HPO<sub>4<\u002Fsub>; inside cells<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;font-weight:600;color:#0d1b2a;\">Carbonic acid (blood)<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;font-family:'IBM Plex Serif',Georgia,serif;\">H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;font-family:'IBM Plex Serif',Georgia,serif;\">HCO<sub>3<\u002Fsub><sup>−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;color:#3c4a5c;\">dissolved CO<sub>2<\u002Fsub> + hydrogencarbonate; blood, pH 7.35–7.45<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:6px;\">Why the acid must be weak<\u002Fdiv><p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#3c4a5c;\">Blood relies on carbonic acid, a weak acid, because its conjugate base HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> readily accepts H<sup>+<\u002Fsup>. The conjugate base of a strong acid (such as Cl<sup>−<\u002Fsup> from HCl) has almost no tendency to accept H<sup>+<\u002Fsup>, so HCl + NaCl could not protect blood from added acid.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:6px;\">Why both must be present<\u002Fdiv><p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#3c4a5c;\">Blood carries large amounts of both H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub> and HCO<sub>3<\u002Fsub><sup>−<\u002Fsup>. Without the HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> reserve, lactic acid from exercise would have nothing to react with and blood pH would fall sharply. Without H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub>, nothing could replace H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> removed by a base.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:13.5px;line-height:1.55;color:#3c4a5c;background:#f2f6fc;border-left:3px solid #1f5fbf;padding:10px 12px;border-radius:0 4px 4px 0;\"><strong style=\"color:#0d1b2a;\">Syllabus note:<\u002Fstrong> buffer calculations are not required. You need to identify a buffer and explain its response qualitatively.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Interactive model: buffer or water?<\u002Fdiv>\n      <h3 style=\"margin:0 0 6px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Add acid or base and compare the pH change<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Two beakers each hold 50 mL. One is pure water. The other is an ethanoate buffer: 0.10 mol L<sup>−1<\u002Fsup> CH<sub>3<\u002Fsub>COOH and 0.10 mol L<sup>−1<\u002Fsup> CH<sub>3<\u002Fsub>COO<sup>−<\u002Fsup>. Choose what to add, then drag the slider. Predict each pH before you look.<\u002Fp>\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;margin-bottom:8px;\">1. Choose what to add<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;\">\n        <sc-for list=\"{{ bd.modes }}\" as=\"s\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:{{ s.bg }};color:{{ s.fg }};border:1px solid {{ s.bd }};border-radius:4px;padding:8px 12px;cursor:pointer;\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <label style=\"display:grid;gap:8px;margin-bottom:16px;padding:14px 16px;background:#e6ecf6;border:1px solid #1f5fbf;border-radius:5px;\">\n        <span style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;\"><span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;\">2. Drag to add 0.10 mol L<sup>−1<\u002Fsup> {{ bd.reagent }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:16px;color:#10284a;\">{{ bd.vLabel }} mL<\u002Fspan><\u002Fspan>\n        <input type=\"range\" min=\"0\" max=\"13\" step=\"1\" value=\"{{ bd.bi }}\" sc-camel-on-change=\"{{ bd.onV }}\" style=\"width:100%;height:24px;accent-color:#1f5fbf;cursor:pointer;\">\n        <span style=\"display:flex;justify-content:space-between;font-size:12.5px;color:#3c4a5c;\"><span>← none added<\u002Fspan><span>60 mL (well past the buffer’s limit) →<\u002Fspan><\u002Fspan>\n      <\u002Flabel>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:stretch;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n            <div style=\"background:#fff;border:1px solid #e7ecf3;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">Pure water<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;color:#10284a;\">pH {{ bd.wpH }}<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ bd.wCol }};\">change {{ bd.wD }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e7ecf3;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">Buffer<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;color:#10284a;\">pH {{ bd.bpH }}<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ bd.bCol }};\">change {{ bd.bD }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;justify-content:space-between;font-size:13.5px;color:#3c4a5c;margin-bottom:5px;\"><span>Water pH on the 0–14 scale<\u002Fspan><\u002Fdiv>\n            <div style=\"position:relative;height:14px;background:linear-gradient(90deg,#e5484d,#f5a524,#e9d63a,#3fb950,#3f8fd8,#5b3f9e);border-radius:3px;\"><div style=\"position:absolute;top:-4px;left:{{ bd.wX }};width:4px;height:22px;margin-left:-2px;background:#10284a;border-radius:2px;transition:left 0.3s;\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;justify-content:space-between;font-size:13.5px;color:#3c4a5c;margin-bottom:5px;\"><span>Buffer pH on the 0–14 scale<\u002Fspan><\u002Fdiv>\n            <div style=\"position:relative;height:14px;background:linear-gradient(90deg,#e5484d,#f5a524,#e9d63a,#3fb950,#3f8fd8,#5b3f9e);border-radius:3px;\"><div style=\"position:absolute;top:-4px;left:{{ bd.bX }};width:4px;height:22px;margin-left:-2px;background:#10284a;border-radius:2px;transition:left 0.3s;\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;\">Reserves in the buffer<\u002Fdiv>\n          <div>\n            <div style=\"display:flex;justify-content:space-between;font-size:13.5px;color:#3c4a5c;margin-bottom:5px;\"><span>CH<sub>3<\u002Fsub>COOH (weak acid)<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;color:#10284a;\">{{ bd.haL }} mmol<\u002Fspan><\u002Fdiv>\n            <div style=\"height:14px;background:#fff;border:1px solid #dbe1ea;border-radius:3px;overflow:hidden;\"><div style=\"height:100%;width:{{ bd.haW }};background:#1f5fbf;transition:width 0.3s;\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;justify-content:space-between;font-size:13.5px;color:#3c4a5c;margin-bottom:5px;\"><span>CH<sub>3<\u002Fsub>COO<sup>−<\u002Fsup> (conjugate base)<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;color:#10284a;\">{{ bd.aL }} mmol<\u002Fspan><\u002Fdiv>\n            <div style=\"height:14px;background:#fff;border:1px solid #dbe1ea;border-radius:3px;overflow:hidden;\"><div style=\"height:100%;width:{{ bd.aW }};background:#b4790f;transition:width 0.3s;\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#10284a;\">{{ bd.shift }}<\u002Fdiv>\n          <ol style=\"margin:0;padding-left:20px;display:grid;gap:5px;font-size:14px;line-height:1.5;color:#3c4a5c;\">\n            <sc-for list=\"{{ bd.chain }}\" as=\"c\" hint-placeholder-count=\"4\"><li><sc-for list=\"{{ c }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fli><\u002Fsc-for>\n          <\u002Fol>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:14px;line-height:1.55;color:#3c4a5c;background:#f2f6fc;border-left:3px solid #1f5fbf;padding:10px 12px;border-radius:0 4px 4px 0;\"><strong style=\"color:#0d1b2a;\">Try this:<\u002Fstrong> add 1.0 mL of HCl and compare the two changes. Then keep going past 50 mL and watch what happens once the CH<sub>3<\u002Fsub>COO<sup>−<\u002Fsup> reserve runs out. Values are model estimates; you will not be asked to calculate buffer pH.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- WORKED -->\n  <sc-if value=\"{{ nav.is.worked }}\" hint-placeholder-val=\"{{ false }}\">\n  <section id=\"worked\" data-screen-label=\"02 Worked examples\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid #dbe1ea;\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;color:#1f5fbf;\">02<\u002Fspan>\n      <h2 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:32px;margin:0;color:#10284a;font-weight:600;\">Work through four examples<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 22px;font-size:15.5px;color:#5b6a7f;max-width:70ch;\">Try each one yourself first, then open the solution to compare.<\u002Fp>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Worked example 1: Determine the conjugate<\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Determine the formula of:<\u002Fstrong> (a) the conjugate base of HSO<sub>3<\u002Fsub><sup>−<\u002Fsup>; (b) the conjugate acid of PO<sub>4<\u002Fsub><sup>3−<\u002Fsup>; (c) the conjugate acid of CH<sub>3<\u002Fsub>CH<sub>2<\u002Fsub>NH<sub>2<\u002Fsub>; (d) the conjugate base of NH<sub>4<\u002Fsub><sup>+<\u002Fsup>.<\u002Fp>\n      <button sc-camel-on-click=\"{{ t.w1 }}\" style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ label.w1 }}<\u002Fbutton>\n      <sc-if value=\"{{ open.w1 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;border-top:1px solid #e7ecf3;padding-top:20px;display:grid;gap:18px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Think<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">“Conjugate base” means take one H<sup>+<\u002Fsup> away: one fewer H, charge down by 1. “Conjugate acid” means add one H<sup>+<\u002Fsup>: one more H, charge up by 1. Change nothing else.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Do<\u002Fdiv>\n            <div style=\"display:grid;gap:10px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;\">\n              <div>(a) HSO<sub>3<\u002Fsub><sup>−<\u002Fsup> − H<sup>+<\u002Fsup> → <strong>SO<sub>3<\u002Fsub><sup>2−<\u002Fsup><\u002Fstrong><\u002Fdiv>\n              <div>(b) PO<sub>4<\u002Fsub><sup>3−<\u002Fsup> + H<sup>+<\u002Fsup> → <strong>HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup><\u002Fstrong><\u002Fdiv>\n              <div>(c) CH<sub>3<\u002Fsub>CH<sub>2<\u002Fsub>NH<sub>2<\u002Fsub> + H<sup>+<\u002Fsup> → <strong>CH<sub>3<\u002Fsub>CH<sub>2<\u002Fsub>NH<sub>3<\u002Fsub><sup>+<\u002Fsup><\u002Fstrong><\u002Fdiv>\n              <div>(d) NH<sub>4<\u002Fsub><sup>+<\u002Fsup> − H<sup>+<\u002Fsup> → <strong>NH<sub>3<\u002Fsub><\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1a7f5a;margin-bottom:5px;\">Sense check<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#20402f;\">Each answer differs from the starting species by one H and one unit of charge. In (c) the extra H goes on the nitrogen, which has the lone pair.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\"><strong style=\"color:#0d1b2a;\">Marker's eye:<\u002Fstrong> H<sub>2<\u002Fsub>SO<sub>3<\u002Fsub> for (a) is the conjugate acid, not the base. PO<sub>4<\u002Fsub><sup>2−<\u002Fsup> or HPO<sub>4<\u002Fsub><sup>3−<\u002Fsup> for (b) changes only one of the two things that must change.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Worked example 2: Explain the Brønsted–Lowry model with an equation<\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">Hydrofluoric acid, HF, reacts with aqueous ammonia, NH<sub>3<\u002Fsub>:<\u002Fp>\n      <div style=\"margin:4px 0 12px;padding:12px 14px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:18px;color:#0d1b2a;\">HF<sub>(aq)<\u002Fsub> + NH<sub>3<\u002Fsub><sub>(aq)<\u002Fsub> ⇌ F<sup>−<\u002Fsup><sub>(aq)<\u002Fsub> + NH<sub>4<\u002Fsub><sup>+<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Explain the Brønsted–Lowry model using this reaction as an example.<\u002Fstrong> (3 marks)<\u002Fp>\n      <button sc-camel-on-click=\"{{ t.w2 }}\" style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ label.w2 }}<\u002Fbutton>\n      <sc-if value=\"{{ open.w2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;border-top:1px solid #e7ecf3;padding-top:20px;display:grid;gap:18px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Think<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">“Explain” at 3 marks needs three separate points: define the model, apply it to the forward reaction, then link the conjugate pairs (and the reverse reaction). Naming the species alone earns one mark at most.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Do<\u002Fdiv>\n            <div style=\"display:grid;gap:10px;font-size:15.5px;line-height:1.6;color:#0d1b2a;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;\">\n              <div><strong>Define.<\u002Fstrong> A Brønsted–Lowry acid is a proton (H<sup>+<\u002Fsup>) donor and a Brønsted–Lowry base is a proton acceptor.<\u002Fdiv>\n              <div style=\"border-top:1px dashed #ccd5e2;padding-top:10px;\"><strong>Apply.<\u002Fstrong> In the forward reaction HF donates H<sup>+<\u002Fsup> to NH<sub>3<\u002Fsub>, so HF is the acid and NH<sub>3<\u002Fsub> is the base.<\u002Fdiv>\n              <div style=\"border-top:1px dashed #ccd5e2;padding-top:10px;\"><strong>Pairs.<\u002Fstrong> F<sup>−<\u002Fsup> is the conjugate base of HF and NH<sub>4<\u002Fsub><sup>+<\u002Fsup> is the conjugate acid of NH<sub>3<\u002Fsub>; each pair differs by one H<sup>+<\u002Fsup>. In the reverse reaction NH<sub>4<\u002Fsub><sup>+<\u002Fsup> donates H<sup>+<\u002Fsup> to F<sup>−<\u002Fsup>.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1a7f5a;margin-bottom:5px;\">Sense check<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#20402f;\">Charges balance: 0 + 0 on the left, −1 + +1 on the right. The ⇌ fits, because HF is a weak acid and NH<sub>3<\u002Fsub> is a weak base.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\"><strong style=\"color:#0d1b2a;\">Marker's eye:<\u002Fstrong> a common mistake is pairing HF with NH<sub>4<\u002Fsub><sup>+<\u002Fsup> because they sit in the same position. Pair by formula, not by position: the partner differs by one H<sup>+<\u002Fsup>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Worked example 3: An amphiprotic ion<\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">The hydrogenphosphate ion, HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup>, is amphiprotic. <strong>Determine the equations for HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup> acting as an acid and as a base with water, and identify its conjugate acid and conjugate base.<\u002Fstrong><\u002Fp>\n      <button sc-camel-on-click=\"{{ t.w3 }}\" style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ label.w3 }}<\u002Fbutton>\n      <sc-if value=\"{{ open.w3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;border-top:1px solid #e7ecf3;padding-top:20px;display:grid;gap:18px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Think<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">As an acid it gives H<sup>+<\u002Fsup> to water (forming H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>). As a base it takes H<sup>+<\u002Fsup> from water (forming OH<sup>−<\u002Fsup>). Both are weak, partial reactions, so use ⇌.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Do<\u002Fdiv>\n            <div style=\"display:grid;gap:10px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;\">\n              <div>As an acid: HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ PO<sub>4<\u002Fsub><sup>3−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n              <div>As a base: HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ H<sub>2<\u002Fsub>PO<sub>4<\u002Fsub><sup>−<\u002Fsup><sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n              <div style=\"border-top:1px dashed #ccd5e2;padding-top:10px;\">Conjugate base: <strong>PO<sub>4<\u002Fsub><sup>3−<\u002Fsup><\u002Fstrong> · Conjugate acid: <strong>H<sub>2<\u002Fsub>PO<sub>4<\u002Fsub><sup>−<\u002Fsup><\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1a7f5a;margin-bottom:5px;\">Sense check<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#20402f;\">Charges: −2 + 0 = −3 + +1, and −2 + 0 = −1 + −1. Both equations balance.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\"><strong style=\"color:#0d1b2a;\">Marker's eye:<\u002Fstrong> the question names water as the partner, so H<sub>2<\u002Fsub>O must appear as a reactant in both equations.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Worked example 4: A buffer meets added acid<\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">A buffer contains similar amounts of ammonia, NH<sub>3<\u002Fsub>, and ammonium chloride, NH<sub>4<\u002Fsub>Cl. The buffer equilibrium is:<\u002Fp>\n      <div style=\"margin:4px 0 12px;padding:12px 14px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:18px;color:#0d1b2a;\">NH<sub>4<\u002Fsub><sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ NH<sub>3<\u002Fsub><sub>(aq)<\u002Fsub> + H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Explain, using Le Châtelier’s principle, how this buffer responds to the addition of a small amount of hydrochloric acid.<\u002Fstrong> (3 marks)<\u002Fp>\n      <button sc-camel-on-click=\"{{ t.w4 }}\" style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ label.w4 }}<\u002Fbutton>\n      <sc-if value=\"{{ open.w4 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;border-top:1px solid #e7ecf3;padding-top:20px;display:grid;gap:18px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Think<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Use the chain: change → shift → species → result. HCl adds H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>, which is a product here. The conjugate base, NH<sub>3<\u002Fsub>, is the species that absorbs it.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Do<\u002Fdiv>\n            <div style=\"display:grid;gap:10px;font-size:15.5px;line-height:1.6;color:#0d1b2a;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;\">\n              <div><strong>Change.<\u002Fstrong> Adding HCl increases [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>].<\u002Fdiv>\n              <div style=\"border-top:1px dashed #ccd5e2;padding-top:10px;\"><strong>Shift and species.<\u002Fstrong> By Le Châtelier’s principle, the reverse reaction is favoured to partially oppose the change: H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> reacts with NH<sub>3<\u002Fsub> to form NH<sub>4<\u002Fsub><sup>+<\u002Fsup> and H<sub>2<\u002Fsub>O.<\u002Fdiv>\n              <div style=\"border-top:1px dashed #ccd5e2;padding-top:10px;\"><strong>Result.<\u002Fstrong> [NH<sub>3<\u002Fsub>] decreases slightly and [NH<sub>4<\u002Fsub><sup>+<\u002Fsup>] increases slightly. [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] ends only slightly above its original value, so the pH decreases only slightly.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1a7f5a;margin-bottom:5px;\">Sense check<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#20402f;\">The buffer works because there is a large reserve of NH<sub>3<\u002Fsub> compared with the small amount of acid added. A large amount of acid would use up the NH<sub>3<\u002Fsub>.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\"><strong style=\"color:#0d1b2a;\">Marker's eye:<\u002Fstrong> “the equilibrium shifts left” on its own is not enough. Name the species that reacts and state that the pH changes only slightly.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- CONSOLIDATE -->\n  <sc-if value=\"{{ nav.is.consolidate }}\" hint-placeholder-val=\"{{ false }}\">\n  <section id=\"consolidate\" data-screen-label=\"03 Consolidate\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid #dbe1ea;\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;color:#1f5fbf;\">03<\u002Fspan>\n      <h2 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:32px;margin:0;color:#10284a;font-weight:600;\">Consolidate with practice activities<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 22px;font-size:15.5px;color:#5b6a7f;max-width:70ch;\">Eight activities, from definitions up to buffer explanations. Your answers save automatically in this browser.<\u002Fp>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Activity A: Match the terms<\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Match each term to its definition<\u002Fh3>\n      <p style=\"margin:0 0 18px;font-size:14.5px;color:#5b6a7f;\">Choose the letter of the matching definition. Each letter is used once.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;display:grid;gap:8px;font-size:14.5px;line-height:1.5;color:#0d1b2a;\">\n          <div><strong style=\"font-family:'IBM Plex Mono',monospace;color:#1f5fbf;\">A<\u002Fstrong> &nbsp;A species that donates a proton (H<sup>+<\u002Fsup>)<\u002Fdiv>\n          <div><strong style=\"font-family:'IBM Plex Mono',monospace;color:#1f5fbf;\">B<\u002Fstrong> &nbsp;A species that accepts a proton<\u002Fdiv>\n          <div><strong style=\"font-family:'IBM Plex Mono',monospace;color:#1f5fbf;\">C<\u002Fstrong> &nbsp;The species formed when an acid loses one H<sup>+<\u002Fsup><\u002Fdiv>\n          <div><strong style=\"font-family:'IBM Plex Mono',monospace;color:#1f5fbf;\">D<\u002Fstrong> &nbsp;The species formed when a base gains one H<sup>+<\u002Fsup><\u002Fdiv>\n          <div><strong style=\"font-family:'IBM Plex Mono',monospace;color:#1f5fbf;\">E<\u002Fstrong> &nbsp;Two species whose formulas differ by exactly one H<sup>+<\u002Fsup><\u002Fdiv>\n          <div><strong style=\"font-family:'IBM Plex Mono',monospace;color:#1f5fbf;\">F<\u002Fstrong> &nbsp;Can act as a proton donor or a proton acceptor, depending on its partner<\u002Fdiv>\n          <div><strong style=\"font-family:'IBM Plex Mono',monospace;color:#1f5fbf;\">G<\u002Fstrong> &nbsp;Reacts with both acids and bases, e.g. ZnO<\u002Fdiv>\n          <div><strong style=\"font-family:'IBM Plex Mono',monospace;color:#1f5fbf;\">H<\u002Fstrong> &nbsp;Resists a change in pH when a small amount of acid or base is added<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:8px;\">\n          <sc-for list=\"{{ matchRows }}\" as=\"m\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:8px 12px;\">\n              <span style=\"font-size:15px;color:#0d1b2a;font-weight:500;\">{{ m.term }}<\u002Fspan>\n              <sc-raw-select value=\"{{ m.value }}\" sc-camel-on-change=\"{{ m.onChange }}\" style=\"width:100%;padding:7px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:14px;color:#0d1b2a;border:1.5px solid {{ m.bd }};\">\n                <option value=\"\">–<\u002Foption><option value=\"A\">A<\u002Foption><option value=\"B\">B<\u002Foption><option value=\"C\">C<\u002Foption><option value=\"D\">D<\u002Foption><option value=\"E\">E<\u002Foption><option value=\"F\">F<\u002Foption><option value=\"G\">G<\u002Foption><option value=\"H\">H<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;\">\n        <button sc-camel-on-click=\"{{ checkMatch }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">Check my matches<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetMatch }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Start again<\u002Fbutton>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ matchColor }};\">{{ matchMsg }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Activity B: Fill in the blanks<\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Complete the rules of the model<\u002Fh3>\n      <p style=\"margin:0 0 18px;font-size:14.5px;color:#5b6a7f;\">Choose a word or phrase for each gap.<\u002Fp>\n      <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;line-height:2.3;color:#0d1b2a;\">\n        A Brønsted–Lowry acid is a proton\n        <sc-raw-select value=\"{{ fb.b1.value }}\" sc-camel-on-change=\"{{ fb.b1.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b1.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"donor\">donor<\u002Foption><option value=\"acceptor\">acceptor<\u002Foption><\u002Fsc-raw-select>.\n        When an acid loses one H<sup>+<\u002Fsup>, the species left is its\n        <sc-raw-select value=\"{{ fb.b2.value }}\" sc-camel-on-change=\"{{ fb.b2.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b2.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"cb\">conjugate base<\u002Foption><option value=\"ca\">conjugate acid<\u002Foption><\u002Fsc-raw-select>.\n        The two members of a conjugate pair differ by\n        <sc-raw-select value=\"{{ fb.b3.value }}\" sc-camel-on-change=\"{{ fb.b3.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b3.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"one\">exactly one H⁺<\u002Foption><option value=\"two\">two H⁺<\u002Foption><option value=\"e\">one electron<\u002Foption><\u002Fsc-raw-select>,\n        so the charge on a conjugate acid is\n        <sc-raw-select value=\"{{ fb.b4.value }}\" sc-camel-on-change=\"{{ fb.b4.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b4.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"up\">one higher<\u002Foption><option value=\"down\">one lower<\u002Foption><option value=\"same\">the same<\u002Foption><\u002Fsc-raw-select>\n        than the charge on its base. A species such as HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> that can donate or accept a proton is\n        <sc-raw-select value=\"{{ fb.b5.value }}\" sc-camel-on-change=\"{{ fb.b5.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b5.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"amph\">amphiprotic<\u002Foption><option value=\"neut\">neutral<\u002Foption><option value=\"poly\">polyprotic<\u002Foption><\u002Fsc-raw-select>.\n        A buffer contains a\n        <sc-raw-select value=\"{{ fb.b6.value }}\" sc-camel-on-change=\"{{ fb.b6.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b6.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"weak\">weak<\u002Foption><option value=\"strong\">strong<\u002Foption><\u002Fsc-raw-select>\n        acid and its conjugate base in similar amounts, and resists a change in pH when a\n        <sc-raw-select value=\"{{ fb.b7.value }}\" sc-camel-on-change=\"{{ fb.b7.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b7.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"small\">small<\u002Foption><option value=\"large\">large<\u002Foption><\u002Fsc-raw-select>\n        amount of acid or base is added.\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;\">\n        <button sc-camel-on-click=\"{{ checkFill }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">Check my answers<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetFill }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Start again<\u002Fbutton>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ fillColor }};\">{{ fillMsg }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Activity C: Label the equations<\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Label every species in four reactions<\u002Fh3>\n      <p style=\"margin:0 0 18px;font-size:14.5px;color:#5b6a7f;\">For each species, choose its role in the forward reaction. Watch out: the acid is not always written first.<\u002Fp>\n      <div style=\"display:grid;gap:12px;\">\n        <sc-for list=\"{{ lblRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n            <div style=\"display:flex;gap:10px;align-items:baseline;margin-bottom:12px;\"><span style=\"width:26px;height:26px;flex-shrink:0;border-radius:50%;background:#10284a;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">{{ r.n }}<\u002Fspan><span style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:17.5px;color:#0d1b2a;\"><sc-for list=\"{{ r.eq }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 12px;\">\n              <sc-for list=\"{{ r.sp }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <label style=\"display:grid;gap:4px;\">\n                  <span style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#10284a;\"><sc-for list=\"{{ s.seg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fspan>\n                  <sc-raw-select value=\"{{ s.value }}\" sc-camel-on-change=\"{{ s.onChange }}\" style=\"width:100%;padding:8px 10px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14px;color:#0d1b2a;border:1.5px solid {{ s.bd }};\"><option value=\"\">Choose a role<\u002Foption><option value=\"a\">Brønsted–Lowry acid<\u002Foption><option value=\"b\">Brønsted–Lowry base<\u002Foption><option value=\"ca\">Conjugate acid<\u002Foption><option value=\"cb\">Conjugate base<\u002Foption><\u002Fsc-raw-select>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;\">\n        <button sc-camel-on-click=\"{{ checkLbl }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">Check my labels<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetLbl }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Start again<\u002Fbutton>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ lblColor }};\">{{ lblMsg }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Activity D: Classify<\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Acid only, base only or amphiprotic?<\u002Fh3>\n      <p style=\"margin:0 0 18px;font-size:14.5px;color:#5b6a7f;\">Decide how each species behaves in water. Ask two questions: does it have an H to donate, and can it accept another H<sup>+<\u002Fsup>?<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;\">\n        <sc-for list=\"{{ clsRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n          <div style=\"display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:8px 12px;\">\n            <span style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;color:#0d1b2a;\"><sc-for list=\"{{ r.seg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fspan>\n            <sc-raw-select value=\"{{ r.value }}\" sc-camel-on-change=\"{{ r.onChange }}\" style=\"width:100%;padding:7px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14px;color:#0d1b2a;border:1.5px solid {{ r.bd }};\"><option value=\"\">Choose<\u002Foption><option value=\"acid\">Acid only<\u002Foption><option value=\"base\">Base only<\u002Foption><option value=\"amph\">Amphiprotic<\u002Foption><\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;\">\n        <button sc-camel-on-click=\"{{ checkCls }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">Check my answers<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetCls }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Start again<\u002Fbutton>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ clsColor }};\">{{ clsMsg }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Activity E: Buffer or not?<\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Which mixtures make a buffer?<\u002Fh3>\n      <p style=\"margin:0 0 18px;font-size:14.5px;color:#5b6a7f;\">Each mixture contains similar amounts of both substances. Use the words weak, conjugate and pair to decide.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;\">\n        <sc-for list=\"{{ bufRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n          <div style=\"display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:8px 12px;\">\n            <span style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;\"><sc-for list=\"{{ r.seg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fspan>\n            <sc-raw-select value=\"{{ r.value }}\" sc-camel-on-change=\"{{ r.onChange }}\" style=\"width:100%;padding:7px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14px;color:#0d1b2a;border:1.5px solid {{ r.bd }};\"><option value=\"\">Choose<\u002Foption><option value=\"y\">Buffer<\u002Foption><option value=\"n\">Not a buffer<\u002Foption><\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;\">\n        <button sc-camel-on-click=\"{{ checkBuf }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">Check my answers<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetBuf }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Start again<\u002Fbutton>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ bufColor }};\">{{ bufMsg }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ bufDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:16px;padding:16px 18px;border-radius:5px;background:#eef7f2;border-left:3px solid #1a7f5a;display:grid;gap:8px;font-size:15px;line-height:1.6;color:#0d1b2a;\">\n          <div><strong>Buffers:<\u002Fstrong> each is a weak acid with its conjugate base (or a weak base with its conjugate acid), e.g. HNO<sub>2<\u002Fsub> / NO<sub>2<\u002Fsub><sup>−<\u002Fsup> and NH<sub>4<\u002Fsub><sup>+<\u002Fsup> / NH<sub>3<\u002Fsub>.<\u002Fdiv>\n          <div><strong>Not buffers:<\u002Fstrong> HCl, HNO<sub>3<\u002Fsub> and NaOH are strong, so their partner ions (Cl<sup>−<\u002Fsup>, NO<sub>3<\u002Fsub><sup>−<\u002Fsup>, Na<sup>+<\u002Fsup>) cannot absorb added H<sup>+<\u002Fsup> or OH<sup>−<\u002Fsup>. Ethanoic acid alone has almost no conjugate base.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Activity F: Spot the errors<\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Three lines are wrong. Flag them.<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:14.5px;color:#5b6a7f;\">Question: Explain, using Le Châtelier’s principle, how an NH<sub>4<\u002Fsub><sup>+<\u002Fsup>/NH<sub>3<\u002Fsub> buffer responds to a small amount of sodium hydroxide. A student wrote:<\u002Fp>\n      <div style=\"display:grid;gap:8px;\">\n        <button sc-camel-on-click=\"{{ l1.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l1.bg }};border:1px solid {{ l1.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L1<\u002Fspan><span>The buffer equilibrium is NH<sub>4<\u002Fsub><sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ NH<sub>3<\u002Fsub><sub>(aq)<\u002Fsub> + H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub>.<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l1.mark }}<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ l2.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l2.bg }};border:1px solid {{ l2.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L2<\u002Fspan><span>Adding NaOH increases [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] in the buffer.<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l2.mark }}<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ l3.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l3.bg }};border:1px solid {{ l3.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L3<\u002Fspan><span>To partially oppose the change, the forward reaction is favoured.<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l3.mark }}<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ l4.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l4.bg }};border:1px solid {{ l4.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L4<\u002Fspan><span>NH<sub>4<\u002Fsub><sup>+<\u002Fsup> donates H<sup>+<\u002Fsup> to water, so [NH<sub>3<\u002Fsub>] decreases slightly.<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l4.mark }}<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ l5.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l5.bg }};border:1px solid {{ l5.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L5<\u002Fspan><span>[H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] is partially restored, so the pH rises only slightly.<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l5.mark }}<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ l6.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l6.bg }};border:1px solid {{ l6.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L6<\u002Fspan><span>This works because NH<sub>4<\u002Fsub><sup>+<\u002Fsup> and NH<sub>3<\u002Fsub> differ by two H<sup>+<\u002Fsup>.<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l6.mark }}<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;\">\n        <button sc-camel-on-click=\"{{ checkFlags }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">Check my flags<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetFlags }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Start again<\u002Fbutton>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ flagColor }};\">{{ flagMsg }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ flagsDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:16px;padding:16px 18px;border-radius:5px;background:#eef7f2;border-left:3px solid #1a7f5a;display:grid;gap:8px;font-size:15px;line-height:1.6;color:#0d1b2a;\">\n          <div><strong>L2:<\u002Fstrong> OH<sup>−<\u002Fsup> reacts with H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> to form water, so [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] <em>decreases<\u002Fem>.<\u002Fdiv>\n          <div><strong>L4:<\u002Fstrong> when NH<sub>4<\u002Fsub><sup>+<\u002Fsup> donates H<sup>+<\u002Fsup>, it forms NH<sub>3<\u002Fsub>, so [NH<sub>3<\u002Fsub>] <em>increases<\u002Fem> slightly and [NH<sub>4<\u002Fsub><sup>+<\u002Fsup>] decreases slightly.<\u002Fdiv>\n          <div><strong>L6:<\u002Fstrong> NH<sub>4<\u002Fsub><sup>+<\u002Fsup> and NH<sub>3<\u002Fsub> differ by one H<sup>+<\u002Fsup>. The buffer works because both are present in large, similar amounts.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;\">\n        <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Activity G: Self-check quiz<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#10284a;\">Question {{ quiz.progress }}<\u002Fdiv>\n      <\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Eight questions with instant feedback<\u002Fh3>\n      <p style=\"margin:0 0 18px;font-size:14.5px;color:#5b6a7f;\">Your first attempt on each question counts towards the score.<\u002Fp>\n      <sc-if value=\"{{ quiz.notDone }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><sc-for list=\"{{ quiz.textSeg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fp>\n        <div style=\"display:grid;gap:8px;max-width:640px;\">\n          <sc-for list=\"{{ quiz.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline;padding:11px 14px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;background:{{ o.bg }};border:1px solid {{ o.bd }};\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5b6a7f;\">({{ o.k }})<\u002Fspan><span><sc-for list=\"{{ o.seg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ quiz.answered }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:14px 0 0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\"><strong style=\"color:{{ quiz.fbColor }};\">{{ quiz.fbLead }}<\u002Fstrong> <sc-for list=\"{{ quiz.fbSeg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ quiz.right }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ quiz.next }}\" style=\"margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ quiz.nextLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ quiz.done }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;\">\n          <div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#10284a;\">{{ quiz.firstRight }} of {{ quiz.total }} correct on the first attempt.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ quiz.reset }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Start the quiz again<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Activity H: Re-check<\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Find the base when there is no water<\u002Fh3>\n      <p style=\"margin:0 0 12px;font-size:14.5px;color:#5b6a7f;\">Commit to an answer and a confidence rating, as you did at the start.<\u002Fp>\n      <div style=\"margin:0 0 16px;padding:14px 16px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:18px;color:#0d1b2a;\">HSO<sub>4<\u002Fsub><sup>−<\u002Fsup><sub>(aq)<\u002Fsub> + CN<sup>−<\u002Fsup><sub>(aq)<\u002Fsub> ⇌ SO<sub>4<\u002Fsub><sup>2−<\u002Fsup><sub>(aq)<\u002Fsub> + HCN<sub>(aq)<\u002Fsub><\u002Fdiv>\n      <p style=\"margin:0 0 12px;font-size:16px;line-height:1.6;color:#0d1b2a;\">Which species acts as the Brønsted–Lowry base in the forward reaction?<\u002Fp>\n      <div style=\"display:grid;gap:7px;\">\n        <sc-for list=\"{{ mc.o2 }}\" as=\"o\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline;padding:11px 14px;border-radius:4px;cursor:pointer;font-family:'IBM Plex Sans';font-size:15px;color:#0d1b2a;background:{{ o.bg }};border:1px solid {{ o.bd }};\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5b6a7f;\">({{ o.k }})<\u002Fspan>\n            <span><sc-for list=\"{{ o.seg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:18px;font-size:14.5px;font-weight:600;color:#10284a;\">How confident are you?<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;\">\n        <sc-for list=\"{{ mc.c2 }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding:9px 14px;border-radius:4px;cursor:pointer;font-family:'IBM Plex Sans';font-size:14.5px;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }};\">{{ c.n }} · {{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ mc.wait2 }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"margin:16px 0 0;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#5b6a7f;\">Choose an answer and a confidence rating to see the answer.<\u002Fp>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ mc.shown2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:16px;padding:16px 18px;border-radius:5px;background:#eef7f2;border-left:3px solid #1a7f5a;font-size:15px;line-height:1.6;color:#0d1b2a;display:grid;gap:8px;\">\n          <div><strong>Answer: (b) CN<sup>−<\u002Fsup>.<\u002Fstrong> {{ mc.fb2 }} HSO<sub>4<\u002Fsub><sup>−<\u002Fsup> donates H<sup>+<\u002Fsup> to CN<sup>−<\u002Fsup>, which becomes HCN. So CN<sup>−<\u002Fsup> is the base and HCN is its conjugate acid; SO<sub>4<\u002Fsub><sup>2−<\u002Fsup> is the conjugate base of HSO<sub>4<\u002Fsub><sup>−<\u002Fsup>.<\u002Fdiv>\n          <div>Like the NH<sub>3<\u002Fsub> and HCl tube at the start, no water is needed. Only the proton transfer matters.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;\">\n          <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:12px 14px;\"><div style=\"font-size:13px;color:#5b6a7f;\">Start of lesson<\u002Fdiv><div style=\"font-size:15.5px;font-weight:600;color:#10284a;\">{{ mc.then }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:12px 14px;\"><div style=\"font-size:13px;color:#5b6a7f;\">Now<\u002Fdiv><div style=\"font-size:15.5px;font-weight:600;color:#10284a;\">{{ mc.now }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <label style=\"display:block;margin-top:18px;font-size:15px;font-weight:600;color:#10284a;\">Did your answer or confidence change from the start of the lesson? Why?<\u002Flabel>\n        <textarea value=\"{{ mc.refl }}\" sc-camel-on-change=\"{{ mc.onRefl }}\" rows=\"4\" style=\"margin-top:8px;width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #ccd5e2;border-radius:4px;font-family:'IBM Plex Sans';font-size:15px;line-height:1.55;color:#0d1b2a;resize:vertical;\"><\u002Ftextarea>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- EXAM -->\n  <sc-if value=\"{{ nav.is.exam }}\" hint-placeholder-val=\"{{ false }}\">\n  <section id=\"exam\" data-screen-label=\"04 Exam questions\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid #dbe1ea;\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;color:#1f5fbf;\">04<\u002Fspan>\n      <h2 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:32px;margin:0;color:#10284a;font-weight:600;\">Try exam-style questions<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 22px;font-size:15.5px;color:#5b6a7f;max-width:70ch;\">Answer each question fully on paper before you open the marking guide. Total 21 marks · recommended 30 minutes.<\u002Fp>\n\n    <div style=\"display:grid;gap:18px;\">\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 1: Conjugate pairs<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">1 mark<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Identify<\u002Fstrong> the conjugate acid–base pair.<\u002Fp>\n        <ul style=\"margin:0 0 12px;padding-left:0;list-style:none;display:grid;gap:6px;font-size:16px;color:#3c4a5c;font-family:'IBM Plex Serif',Georgia,serif;\"><li>(A) H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub> / CO<sub>3<\u002Fsub><sup>2−<\u002Fsup><\u002Fli><li>(B) NH<sub>4<\u002Fsub><sup>+<\u002Fsup> / NH<sub>2<\u002Fsub><sup>−<\u002Fsup><\u002Fli><li>(C) H<sub>2<\u002Fsub>PO<sub>4<\u002Fsub><sup>−<\u002Fsup> / HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup><\u002Fli><li>(D) H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> / OH<sup>−<\u002Fsup><\u002Fli><\u002Ful>\n        <button sc-camel-on-click=\"{{ t.q1 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q1 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(C) H<sub>2<\u002Fsub>PO<sub>4<\u002Fsub><sup>−<\u002Fsup> / HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">the only pair that differs by exactly one H<sup>+<\u002Fsup> <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">A, B and D each differ by two H<sup>+<\u002Fsup>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 2: Explain the model with an equation<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">3 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">Methylamine is a weak base. It reacts with water:<\u002Fp>\n        <div style=\"margin:0 0 12px;padding:12px 14px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;color:#0d1b2a;\">CH<sub>3<\u002Fsub>NH<sub>2<\u002Fsub><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ CH<sub>3<\u002Fsub>NH<sub>3<\u002Fsub><sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Explain<\u002Fstrong> the Brønsted–Lowry model using this reaction as an example.<\u002Fp>\n        <button sc-camel-on-click=\"{{ t.q2 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">
