{{ label.q2 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">A Brønsted–Lowry acid is a proton (H<sup>+<\u002Fsup>) donor and a Brønsted–Lowry base is a proton acceptor.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">defines acid and base <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">In the forward reaction H<sub>2<\u002Fsub>O donates H<sup>+<\u002Fsup> to CH<sub>3<\u002Fsub>NH<sub>2<\u002Fsub>, so H<sub>2<\u002Fsub>O is the acid and CH<sub>3<\u002Fsub>NH<sub>2<\u002Fsub> is the base.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">applies the definitions to the forward reaction <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">CH<sub>3<\u002Fsub>NH<sub>3<\u002Fsub><sup>+<\u002Fsup> is the conjugate acid of CH<sub>3<\u002Fsub>NH<sub>2<\u002Fsub> and OH<sup>−<\u002Fsup> is the conjugate base of H<sub>2<\u002Fsub>O; each pair differs by one H<sup>+<\u002Fsup>. In the reverse reaction CH<sub>3<\u002Fsub>NH<sub>3<\u002Fsub><sup>+<\u002Fsup> donates H<sup>+<\u002Fsup> to OH<sup>−<\u002Fsup>.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">identifies both conjugate pairs and links them to proton transfer <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">Identifying the species without explaining the proton transfer earns 1 mark at most.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 3: An amphiprotic ion<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">4 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">The hydrogencarbonate ion, HCO<sub>3<\u002Fsub><sup>−<\u002Fsup>, is amphiprotic.<\u002Fp>\n        <ul style=\"margin:0 0 12px;padding-left:22px;display:grid;gap:6px;font-size:16px;color:#3c4a5c;\">\n          <li>(a) Determine the equation for HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> acting as a Brønsted–Lowry acid with water. (1 mark)<\u002Fli>\n          <li>(b) Determine the equation for HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> acting as a Brønsted–Lowry base with water. (1 mark)<\u002Fli>\n          <li>(c) Identify the conjugate acid and the conjugate base of HCO<sub>3<\u002Fsub><sup>−<\u002Fsup>. (1 mark)<\u002Fli>\n          <li>(d) Explain why the carbonate ion, CO<sub>3<\u002Fsub><sup>2−<\u002Fsup>, is not amphiprotic. (1 mark)<\u002Fli>\n        <\u002Ful>\n        <button sc-camel-on-click=\"{{ t.q3 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q3 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(a) HCO<sub>3<\u002Fsub><sup>−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ CO<sub>3<\u002Fsub><sup>2−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">correct species, charges and ⇌ <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(b) HCO<sub>3<\u002Fsub><sup>−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub><sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">correct species, charges and ⇌ <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(c) Conjugate acid: H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub>. Conjugate base: CO<sub>3<\u002Fsub><sup>2−<\u002Fsup>.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">both correct <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(d) CO<sub>3<\u002Fsub><sup>2−<\u002Fsup> has no hydrogen to donate, so it can only accept a proton (act as a base).<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\ ollapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(a) HS<sup>−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">one H removed and charge lowered by 1 <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(b) HCOOH<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">one H added and charge raised by 1 <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">S<sup>2−<\u002Fsup> for (a) loses two protons and earns no mark.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 5: Identify a buffer<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">2 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">Student A mixes equal amounts of nitrous acid, HNO<sub>2<\u002Fsub>, and sodium nitrite, NaNO<sub>2<\u002Fsub>. Student B mixes equal amounts of nitric acid, HNO<sub>3<\u002Fsub>, and sodium nitrate, NaNO<sub>3<\u002Fsub>. <strong>Determine<\u002Fstrong> which mixture is a buffer and justify your answer.<\u002Fp>\n        <button sc-camel-on-click=\"{{ t.q5 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q5 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q5 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">Student A’s mixture is the buffer.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">identifies mixture A <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">HNO<sub>2<\u002Fsub> is a weak acid and NO<sub>2<\u002Fsub><sup>−<\u002Fsup> is its conjugate base, present in similar amounts, so both added H<sup>+<\u002Fsup> and added OH<sup>−<\u002Fsup> can be absorbed. HNO<sub>3<\u002Fsub> is a strong acid, so NO<sub>3<\u002Fsub><sup>−<\u002Fsup> has almost no tendency to accept H<sup>+<\u002Fsup> and there is no weak conjugate pair.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">justifies using weak acid and conjugate base <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">A justification that only says “A contains a salt” earns no mark: both mixtures contain a salt.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 6: A buffer meets added base<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">3 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">A buffer contains equal amounts of ethanoic acid and sodium ethanoate.<\u002Fp>\n        <div style=\"margin:0 0 12px;padding:12px 14px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;color:#0d1b2a;\">CH<sub>3<\u002Fsub>COOH<sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ CH<sub>3<\u002Fsub>COO<sup>−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Explain<\u002Fstrong>, using Le Châtelier’s principle, how this buffer responds when a small amount of sodium hydroxide is added.<\u002Fp>\n        <button sc-camel-on-click=\"{{ t.q6 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q6 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q6 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">OH<sup>−<\u002Fsup> reacts with H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> to form water, so [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] decreases.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">identifies the change <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">By Le Châtelier’s principle the forward reaction is favoured to partially oppose the change: CH<sub>3<\u002Fsub>COOH donates H<sup>+<\u002Fsup> to water, forming more CH<sub>3<\u002Fsub>COO<sup>−<\u002Fsup> and H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">shift and the species involved <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">[CH<sub>3<\u002Fsub>COOH] decreases slightly and [CH<sub>3<\u002Fsub>COO<sup>−<\u002Fsup>] increases slightly; [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] is partially restored, so the pH rises only slightly.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">result for pH, with “slightly” <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">“The pH stays the same” loses the third mark. Le Châtelier’s principle predicts a partial opposition only.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 7: Analyse buffer data<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">6 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">A student tested how three solutions respond to small additions of acid and base. The phosphate equilibrium in solution 3 is:<\u002Fp>\n        <div style=\"margin:0 0 12px;padding:12px 14px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;color:#0d1b2a;\">H<sub>2<\u002Fsub>PO<sub>4<\u002Fsub><sup>−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n        <div style=\"overflow-x:auto;margin:0 0 12px;\"><sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;min-width:520px;\">\n          <sc-raw-thead><sc-raw-tr style=\"text-align:left;\"><sc-raw-th style=\"padding:8px 8px 8px 0;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">Solution (50 mL)<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">Initial pH<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">+ 1.0 mL HCl<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px 0 8px 8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">+ 1.0 mL NaOH<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;border-bottom:1px solid #e7ecf3;\">1. distilled water<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;\">5.80<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;\">2.71<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;border-bottom:1px solid #e7ecf3;\">11.29<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;border-bottom:1px solid #e7ecf3;\">2. 0.10 mol L<sup>−1<\u002Fsup> KCl<sub>(aq)<\u002Fsub><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;\">5.85<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;\">2.71<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;border-bottom:1px solid #e7ecf3;\">11.28<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;\">3. 0.10 mol L<sup>−1<\u002Fsup> NaH<sub>2<\u002Fsub>PO<sub>4<\u002Fsub> + 0.10 mol L<sup>−1<\u002Fsup> Na<sub>2<\u002Fsub>HPO<sub>4<\u002Fsub><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;\">7.21<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;\">7.19<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;\">7.23<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:14px;color:#5b6a7f;\">Table 1: pH of each solution before and after adding 1.0 mL of 0.10 mol L<sup>−1<\u002Fsup> HCl or 1.0 mL of 0.10 mol L<sup>−1<\u002Fsup> NaOH to separate samples<\u002Fp>\n        <ul style=\"margin:0 0 12px;padding-left:22px;display:grid;gap:6px;font-size:16px;color:#3c4a5c;\">\n          <li>(a) Identify which solution acts as a buffer. Use data from Table 1. (1 mark)<\u002Fli>\n          <li>(b) Explain why the KCl solution does not act as a buffer. (2 marks)<\u002Fli>\n          <li>(c) Explain, using Le Châtelier’s principle, how solution 3 responds to the addition of the hydrochloric acid. (3 marks)<\u002Fli>\n        <\u002Ful>\n        <button sc-camel-on-click=\"{{ t.q7 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q7 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q7 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(a) Solution 3: its pH changed by only 0.02 units with acid or base, while solutions 1 and 2 changed by about 3 and 5.5 units.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">identifies solution 3 and quotes the data <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(b) K<sup>+<\u002Fsup> and Cl<sup>−<\u002Fsup> are not a weak conjugate acid–base pair. Cl<sup>−<\u002Fsup> is the conjugate base of a strong acid, so it does not accept H<sup>+<\u002Fsup>, and K<sup>+<\u002Fsup> does not react with OH<sup>−<\u002Fsup>.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">no weak conjugate pair present <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">Nothing in the solution absorbs the added H<sup>+<\u002Fsup> or OH<sup>−<\u002Fsup>, so its pH changes almost as much as pure water’s.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">links to the data / behaviour <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(c) Adding HCl increases [H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>].<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">change <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">By Le Châtelier’s principle the reverse reaction is favoured to partially oppose the change: H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> reacts with HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup> to form H<sub>2<\u002Fsub>PO<sub>4<\u002Fsub><sup>−<\u002Fsup> and H<sub>2<\u002Fsub>O.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">shift and species <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">[H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>] ends only slightly higher than before, so the pH falls only slightly (7.21 to 7.19).<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">result, linked to data <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">The water starts below pH 7 because it absorbs CO<sub>2<\u002Fsub> from the air, forming carbonic acid. This does not change the answers.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- WRAPUP -->\n  <sc-if value=\"{{ nav.is.wrapup }}\" hint-placeholder-val=\"{{ false }}\">\n  <section id=\"wrapup\" data-screen-label=\"05 Wrap-up\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid #dbe1ea;\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;color:#1f5fbf;\">05<\u002Fspan>\n      <h2 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:32px;margin:0;color:#10284a;font-weight:600;\">Check you are ready<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;\">\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:10px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">I can…<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#10284a;\">{{ ticked }} / 7<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:6px;\">\n          <sc-for list=\"{{ checklist }}\" as=\"c\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:baseline;padding:11px 12px;border-radius:4px;cursor:pointer;font-family:'IBM Plex Sans';font-size:15px;line-height:1.5;color:#0d1b2a;background:{{ c.bg }};border:1px solid {{ c.bd }};\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:{{ c.markColor }};\">{{ c.mark }}<\u002Fspan>\n              <span><sc-for list=\"{{ c.seg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#10284a;color:#fff;border-radius:6px;padding:26px 28px;\">\n        <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#8fb4ec;margin-bottom:16px;\">Take these into the exam<\u002Fdiv>\n        <div style=\"display:grid;gap:18px;font-family:'IBM Plex Serif',Georgia,serif;font-size:20px;\">\n          <div style=\"border-bottom:1px solid #22406e;padding-bottom:16px;\">Acid = proton donor · base = proton acceptor<\u002Fdiv>\n          <div style=\"border-bottom:1px solid #22406e;padding-bottom:16px;\">acid + base ⇌ conjugate base + conjugate acid<\u002Fdiv>\n          <div style=\"border-bottom:1px solid #22406e;padding-bottom:16px;\">Conjugate pair: differ by one H<sup>+<\u002Fsup> and one unit of charge<\u002Fdiv>\n          <div style=\"border-bottom:1px solid #22406e;padding-bottom:16px;\">Amphiprotic: has an H to give and can take an H<sup>+<\u002Fsup><\u002Fdiv>\n          <div>Buffer: weak acid + its conjugate base, in similar amounts<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid #22406e;font-size:14px;line-height:1.65;color:#c3d5ee;\">\n          <strong style=\"color:#fff;\">Three habits that save marks:<\u002Fstrong> pair species by formula, not by position in the equation; write both equations with water for an amphiprotic species; and for buffers, name the species that reacts and say the pH changes only slightly.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid #dbe1ea;\">\n    <button sc-camel-on-click=\"{{ nav.prev }}\" disabled=\"{{ nav.atStart }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:11px 18px;cursor:pointer;opacity:{{ nav.prevOp }};\">{{ nav.prevLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ nav.next }}\" disabled=\"{{ nav.atEnd }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#1f5fbf;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;opacity:{{ nav.nextOp }};\" style-hover=\"background:#10284a;\">{{ nav.nextLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;revealAllAnswers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Teaching mode&quot;},&quot;conversation&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Match the student’s answer&quot;,&quot;(a) No water, so not acid–base&quot;,&quot;(b) Proton transfer (correct)&quot;,&quot;(c) Precipitation&quot;,&quot;(d) Because it makes a salt&quot;],&quot;default&quot;:&quot;Match the student’s answer&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Teaching mode&quot;}}\">\nclass Component extends DCLogic {\n  state = { step: 0, visited: [0], open: {}, rx: 0, pt: 0, bMode: \"acid\", bi: 0,\n            match: {}, matchChecked: false, fill: {}, fillChecked: false, lbl: {}, lblChecked: false,\n            cls: {}, clsChecked: false, buf: {}, bufChecked: false, flags: {}, flagsChecked: false,\n            qi: 0, qPick: null, qFirst: {}, ticks: {}, mc: {} };\n  WORK = \"chem316_student_work_v1\";\n  STEP_KEY = \"chem316_step\";\n  STEPS = [[\"recall\",\"Recall\"],[\"worked\",\"Worked examples\"],[\"consolidate\",\"Consolidate\"],[\"exam\",\"Exam questions\"],[\"wrapup\",\"Wrap-up\"]];\n  navRef = React.createRef();\n\n  componentDidMount() {\n    try {\n      const v = localStorage.getItem(this.STEP_KEY);\n      if (v !== null) this.setState({ step: +v || 0, visited: JSON.parse(localStorage.getItem(this.STEP_KEY + \"_v\") || \"[0]\") });\n      const w = localStorage.getItem(this.WORK);\n      if (w) { const d = JSON.parse(w); this.setState({ mc: d.mc || {}, match: d.match || {}, fill: d.fill || {}, lbl: d.lbl || {}, cls: d.cls || {}, buf: d.buf || {}, flags: d.flags || {}, ticks: d.ticks || {}, qi: d.qi || 0, qFirst: d.qFirst || {} }); }\n    } catch (e) {}\n    this.onHash = () => { const h = (location.hash || \"\").slice(1); const i = this.STEPS.findIndex(x => x[0] === h); if (i >= 0) this.goStep(i); };\n    window.addEventListener(\"hashchange\", this.onHash);\n    this.onHash();\n  }\n  componentWillUnmount() { window.removeEventListener(\"hashchange\", this.onHash); clearInterval(this.ptTimer); }\n  persist() {\n    const s = this.state;\n    try { localStorage.setItem(this.WORK, JSON.stringify({ mc: s.mc, match: s.match, fill: s.fill, lbl: s.lbl, cls: s.cls, buf: s.buf, flags: s.flags, ticks: s.ticks, qi: s.qi, qFirst: s.qFirst })); } catch (e) {}\n  }\n  goStep(i, scroll) {\n    i = Math.max(0, Math.min(this.STEPS.length - 1, i));\n    this.setState(s => { const v = Array.from(new Set([...(s.visited || [0]), i])); try { localStorage.setItem(this.STEP_KEY, String(i)); localStorage.setItem(this.STEP_KEY + \"_v\", JSON.stringify(v)); } catch (e) {} return { step: i, visited: v }; });\n    if (scroll && this.navRef.current) { const y = this.navRef.current.getBoundingClientRect().top + window.scrollY; if (window.scrollY > y) window.scrollTo({ top: y, behavior: \"smooth\" }); }\n  }\n  toggle(id) { this.setState(s => ({ open: { ...s.open, [id]: !s.open[id] } })); }\n\n  // \"H{_2}O{^+}\" → [{t, sb, sp}] for subscripts and superscripts\n  segs(str) {\n    const out = [], re = /\\{([_^])([^}]*)\\}/g; let i = 0, x;\n    while ((x = re.exec(str))) { out.push({ t: str.slice(i, x.index), sb: x[1] === \"_\" ? x[2] : \"\", sp: x[1] === \"^\" ? x[2] : \"\" }); i = re.lastIndex; }\n    out.push({ t: str.slice(i), sb: \"\", sp: \"\" }); return out;\n  }\n\n  // ---------- Interactive 1: proton transfer ----------\n  RX = [\n    { btn: \"Ethanoic acid + water\", acid: [\"CH{_3}COOH\", \"(aq)\"], base: [\"H{_2}O\", \"(l)\"], cb: [\"CH{_3}COO{^−}\", \"(aq)\"], ca: [\"H{_3}O{^+}\", \"(aq)\"], order: [\"acid\", \"base\", \"cb\", \"ca\"], arrow: \"⇌\", acidLeft: true,\n      note: \"Ethanoic acid is weak, so the reverse reaction is significant: H{_3}O{^+} donates H{^+} back to CH{_3}COO{^−}.\" },\n    { btn: \"Ammonia + water\", base: [\"NH{_3}\", \"(aq)\"], acid: [\"H{_2}O\", \"(l)\"], ca: [\"NH{_4}{^+}\", \"(aq)\"], cb: [\"OH{^−}\", \"(aq)\"], order: [\"base\", \"acid\", \"ca\", \"cb\"], arrow: \"⇌\", acidLeft: false,\n      note: \"Here water is the acid, even though it is written second. In the reverse reaction NH{_4}{^+} donates H{^+} to OH{^−}.\" },\n    { btn: \"Hydrogencarbonate donates\", acid: [\"HCO{_3}{^−}\", \"(aq)\"], base: [\"H{_2}O\", \"(l)\"], cb: [\"CO{_3}{^2−}\", \"(aq)\"], ca: [\"H{_3}O{^+}\", \"(aq)\"], order: [\"acid\", \"base\", \"cb\", \"ca\"], arrow: \"⇌\", acidLeft: true,\n      note: \"HCO{_3}{^−} acts as an acid here. Now choose “Hydrogencarbonate accepts”.\" },\n    { btn: \"Hydrogencarbonate accepts\", base: [\"HCO{_3}{^−}\", \"(aq)\"], acid: [\"H{_2}O\", \"(l)\"], ca: [\"H{_2}CO{_3}\", \"(aq)\"], cb: [\"OH{^−}\", \"(aq)\"], order: [\"base\", \"acid\", \"ca\", \"cb\"], arrow: \"⇌\", acidLeft: false,\n      note: \"Now HCO{_3}{^−} acts as a base. A species that can do both is amphiprotic.\" }\n  ];\n  play(dir) {\n    clearInterval(this.ptTimer);\n    if (dir > 0 && this.state.pt >= 10) this.setState({ pt: 0 });\n    if (dir < 0 && this.state.pt <= 0) this.setState({ pt: 10 });\n    this.ptTimer = setInterval(() => {\n      const n = this.state.pt + dir;\n      if (n < 0 || n > 10) { clearInterval(this.ptTimer); return; }\n      this.setState({ pt: n });\n      if (n === 0 || n === 10) clearInterval(this.ptTimer);\n    }, 170);\n  }\n  // Molecule drawings, aligned with RX. Coordinates are relative to each molecule's centre.\n  // h = the transferring H (on the acid) or its landing spot (on the base); hb = the atom it is bonded to.\n  W_BASE = { atoms: [[\"O\", 0, 0], [\"H\", 22, -16], [\"H\", 22, 16]], bonds: [[0, 1], [0, 2]], h: [-30, 0], hb: 0, q0: [], q1: [[0, \"+\", -4, 36]] };\n  W_ACID = { atoms: [[\"O\", 0, 0], [\"H\", 18, -22]], bonds: [[0, 1]], h: [-30, 4], hb: 0, q0: [], q1: [[0, \"−\", 20, 10]] };\n  MOL = [\n    { acid: { atoms: [[\"C\", -50, 0], [\"H\", -76, -14], [\"H\", -76, 14], [\"H\", -50, -30], [\"C\", -8, 0], [\"O\", 6, -28], [\"O\", 22, 16]], bonds: [[0, 1], [0, 2], [0, 3], [0, 4], [4, 5, 2], [4, 6]], h: [50, 8], hb: 6, q0: [], q1: [[6, \"−\", 20, 8]] }, base: \"W_BASE\" },\n    { base: { atoms: [[\"N\", 0, 0], [\"H\", -24, -16], [\"H\", -24, 16], [\"H\", 0, 30]], bonds: [[0, 1], [0, 2], [0, 3]], h: [30, 0], hb: 0, q0: [], q1: [[0, \"+\", 14, -12]] }, acid: \"W_ACID\" },\n    { acid: { atoms: [[\"C\", -6, 0], [\"O\", -6, -32], [\"O\", -34, 16], [\"O\", 22, 16]], bonds: [[0, 1, 2], [0, 2], [0, 3]], h: [50, 8], hb: 3, q0: [[2, \"−\", -22, 10]], q1: [[2, \"−\", -22, 10], [3, \"−\", 20, 10]] }, base: \"W_BASE\" },\n    { base: { atoms: [[\"C\", -6, 0], [\"O\", -6, -32], [\"O\", -34, 16], [\"H\", -58, 6], [\"O\", 22, 16]], bonds: [[0, 1, 2], [0, 2], [2, 3], [0, 4]], h: [50, 8], hb: 4, q0: [[4, \"−\", 20, 10]], q1: [] }, acid: \"W_ACID\" }\n  ];\n  ATOM = { C: [\"#4b5563\", \"#fff\", 15, 13], O: [\"#d64545\", \"#fff\", 14, 13], N: [\"#7c5cc4\", \"#fff\", 14, 13], H: [\"#fff\", \"#10284a\", 10, 11] };\n  ptVals() {\n    const S = this.state, R = this.RX[S.rx], t = S.pt, past = t >= 5, s = t / 10;\n    const BLUE = [\"#eef3fb\", \"#1f5fbf\"], AMBER = [\"#fdf8ec\", \"#b4790f\"];\n    const M = this.MOL[S.rx], get = v => typeof v === \"string\" ? this[v] : v, mA = get(M.acid), mB = get(M.base);\n    const LC = [140, 128], RC = [420, 128], aC = R.acidLeft ? LC : RC, bC = R.acidLeft ? RC : LC;\n    const abs = (c, p) => [c[0] + p[0], c[1] + p[1]];\n    const hFrom = abs(aC, mA.h), hTo = abs(bC, mB.h);\n    const cx = (hFrom[0] + hTo[0]) / 2, cy = Math.min(hFrom[1], hTo[1]) - 95;\n    const hx = (1 - s) * (1 - s) * hFrom[0] + 2 * (1 - s) * s * cx + s * s * hTo[0];\n    const hy = (1 - s) * (1 - s) * hFrom[1] + 2 * (1 - s) * s * cy + s * s * hTo[1];\n    const atoms = [], bonds = [];\n    const draw = (m, c) => {\n      const pts = m.atoms.map(a => abs(c, [a[1], a[2]]));\n      m.bonds.forEach(([i, j, o]) => {\n        const [x1, y1] = pts[i], [x2, y2] = pts[j];\n        if (o === 2) { const L = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / L * 4, ny = (x2 - x1) / L * 4;\n          [1, -1].forEach(k => bonds.push({ x1: x1 + k * nx, y1: y1 + k * ny, x2: x2 + k * nx, y2: y2 + k * ny, w: 3 })); }\n        else bonds.push({ x1, y1, x2, y2, w: 4.5 });\n      });\n      m.atoms.forEach((a, i) => { const st = this.ATOM[a[0]]; atoms.push({ el: a[0], x: pts[i][0], y: pts[i][1], ty: (pts[i][1] + 4.5).toFixed(1), fill: st[0], fg: st[1], r: st[2], fs: st[3] }); });\n      return pts;\n    };\n    const pA = draw(mA, aC), pB = draw(mB, bC);\n    if (t === 0) bonds.push({ x1: hFrom[0], y1: hFrom[1], x2: pA[mA.hb][0], y2: pA[mA.hb][1], w: 4.5 });\n    if (t === 10) bonds.push({ x1: hTo[0], y1: hTo[1], x2: pB[mB.hb][0], y2: pB[mB.hb][1], w: 4.5 });\n    const qs = (m, pts) => (past ? m.q1 : m.q0).map(([i, q, dx, dy]) => ({ q, x: (pts[i][0] + dx).toFixed(1), ty: (pts[i][1] + dy).toFixed(1) }));\n    const roleA = past ? \"conjugate base\" : \"proton donor\", roleB = past ? \"conjugate acid\" : \"proton acceptor\";\n    const fA = past ? R.cb[0] : R.acid[0], fB = past ? R.ca[0] : R.base[0];\n    const L = R.acidLeft ? { seg: fA, role: roleA, c: BLUE } : { seg: fB, role: roleB, c: AMBER };\n    const Rt = R.acidLeft ? { seg: fB, role: roleB, c: AMBER } : { seg: fA, role: roleA, c: BLUE };\n    const col = { acid: \"#1f5fbf\", cb: \"#1f5fbf\", base: \"#b4790f\", ca: \"#b4790f\" };\n    const part = k => ({ seg: this.segs(R[k][0] + \"{_\" + R[k][1] + \"}\"), col: col[k], fw: \"600\" });\n    const op = x => ({ seg: [{ t: x, sb: \"\", sp: \"\" }], col: \"#0d1b2a\", fw: \"400\" });\n    const eq = [part(R.order[0]), op(\" + \"), part(R.order[1]), op(\"  \" + R.arrow + \"  \"), part(R.order[2]),
