20px;display:grid;gap:7px;font-size:15px;line-height:1.55;color:#3c4a5c;\">\n        <li>Describe acids and bases in equilibrium systems using the Brønsted-Lowry model.<\u002Fli>\n        <li>Explain the Brønsted-Lowry model using chemical equations that illustrate the transfer of hydrogen ions (protons) between conjugate acid-base pairs.<\u002Fli>\n        <li>Identify that amphiprotic species can act as Brønsted-Lowry acid (or base).<\u002Fli>\n        <li>Determine the formula of the conjugate acid (or base) of any Brønsted-Lowry base (or acid).<\u002Fli>\n        <li>Identify that buffers are solutions that are conjugate in nature and resist a change in pH when a small amount of an acid or base is added. (Buffer calculations are not required.)<\u002Fli>\n        <li>Apply Le Châtelier’s principle to explain how buffer solutions respond to the addition of hydrogen ions and hydroxide ions.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav ref=\"{{ nav.ref }}\" aria-label=\"Sections\" style=\"position:sticky;top:0;z-index:20;background:#f4f6f9;padding:14px 0;margin-bottom:28px;border-bottom:1px solid #dbe1ea;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;\">\n    <sc-for list=\"{{ nav.pills }}\" as=\"p\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{ p.go }}\" aria-current=\"{{ p.aria }}\" style=\"display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:999px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;color:#10284a;background:{{ p.bg }};border:1px solid {{ p.bd }};\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12.5px;font-weight:700;background:{{ p.nbg }};color:{{ p.nfg }};\">{{ p.num }}<\u002Fspan>\n        <span>{{ p.label }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n\n  <!-- RECALL -->\n  <sc-if value=\"{{ nav.is.recall }}\" hint-placeholder-val=\"{{ true }}\">\n  <section id=\"recall\" data-screen-label=\"01 Recall\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid #dbe1ea;\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;color:#1f5fbf;\">01<\u002Fspan>\n      <h2 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:32px;margin:0;color:#10284a;font-weight:600;\">Recall the key ideas<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Is this an acid–base reaction?<\u002Fh3>\n      <p style=\"margin:0 0 16px;font-size:14.5px;color:#5b6a7f;\">Jordan has a question for you before you start. Reply, then say how sure you are.<\u002Fp>\n      <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:6px;padding:18px;display:grid;gap:12px;max-width:760px;\">\n        <div style=\"display:flex;gap:10px;align-items:flex-end;flex-direction:row-reverse;\">\n          <span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#1f5fbf;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:700;\">J<\u002Fspan>\n          <div style=\"max-width:78%;padding:10px 14px;border-radius:14px;background:#eef2f8;border:1px solid #d5deeb;font-size:15.5px;line-height:1.55;color:#0d1b2a;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;color:#1f5fbf;margin-bottom:2px;\">Jordan<\u002Fdiv>\n            I put cotton wool soaked in ammonia at one end of a dry glass tube and hydrochloric acid at the other. A white ring of solid forms in the tube: NH<sub>3<\u002Fsub><sub>(g)<\u002Fsub> + HCl<sub>(g)<\u002Fsub> → NH<sub>4<\u002Fsub>Cl<sub>(s)<\u002Fsub>. There’s no liquid water anywhere. Is this an acid–base reaction?\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-end;\">\n          <span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:700;\">You<\u002Fspan>\n          <div style=\"flex:1;max-width:78%;display:grid;gap:7px;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;color:#10284a;\">Your reply<\u002Fdiv>\n            <sc-for list=\"{{ mc.o1 }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline;padding:10px 14px;border-radius:14px;cursor:pointer;font-family:'IBM Plex Sans';font-size:15px;color:#0d1b2a;background:{{ o.bg }};border:1px solid {{ o.bd }};\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5b6a7f;\">({{ o.k }})<\u002Fspan>\n                <span><sc-for list=\"{{ o.seg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ mc.p1Picked }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:10px;align-items:flex-end;flex-direction:row-reverse;\">\n            <span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#1f5fbf;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:700;\">J<\u002Fspan>\n            <div style=\"max-width:78%;padding:10px 14px;border-radius:14px;background:#eef2f8;border:1px solid #d5deeb;font-size:15.5px;line-height:1.55;color:#0d1b2a;\">\n              <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;color:#1f5fbf;margin-bottom:2px;\">Jordan<\u002Fdiv>\n              How sure are you?\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:flex-end;\">\n            <span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:700;\">You<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;max-width:78%;\">\n              <sc-for list=\"{{ mc.c1 }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding:9px 14px;border-radius:14px;cursor:pointer;font-family:'IBM Plex Sans';font-size:14.5px;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }};\">{{ c.n }} · {{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ mc.shown1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:10px;align-items:flex-end;flex-direction:row-reverse;\">\n            <span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#1f5fbf;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:700;\">J<\u002Fspan>\n            <div style=\"max-width:78%;padding:10px 14px;border-radius:14px;background:#eef2f8;border:1px solid #d5deeb;font-size:15.5px;line-height:1.55;color:#0d1b2a;\">\n              <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;color:#1f5fbf;margin-bottom:2px;\">Jordan<\u002Fdiv>\n              Noted. Keep that answer in mind while you work through Part 1. Alex and I will talk it through just after it.\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <h3 style=\"margin:0 0 10px;font-family:'IBM Plex Sans',sans-serif;font-size:17px;font-weight:600;color:#10284a;\">Start here<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;\">\n        <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#3c4a5c;text-wrap:pretty;\"><strong style=\"color:#0d1b2a;\">Acid–base reactions are proton transfers.<\u002Fstrong> A Brønsted–Lowry acid donates a hydrogen ion (H<sup>+<\u002Fsup>, a proton). A Brønsted–Lowry base accepts it. A donor always needs an acceptor, and water does not have to be involved.<\u002Fp>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#3c4a5c;text-wrap:pretty;\"><strong style=\"color:#0d1b2a;\">Every acid has a conjugate base.<\u002Fstrong> Remove one H<sup>+<\u002Fsup> from an acid and you get its conjugate base. Add one H<sup>+<\u002Fsup> to a base and you get its conjugate acid. Each conjugate pair differs by exactly one H<sup>+<\u002Fsup>.<\u002Fp>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#3c4a5c;text-wrap:pretty;\"><strong style=\"color:#0d1b2a;\">Buffers use a conjugate pair.<\u002Fstrong> A weak acid and its conjugate base, together in similar amounts, can absorb small additions of H<sup>+<\u002Fsup> or OH<sup>−<\u002Fsup>. Le Châtelier’s principle explains why the pH barely changes.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 16px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;background:#10284a;border-radius:3px;padding:4px 8px;\">Part 1<\u002Fspan><h3 style=\"margin:0;font-family:'IBM Plex Serif',Georgia,serif;font-size:22px;font-weight:600;color:#10284a;\">Acids donate protons; bases accept them<\u002Fh3><span style=\"font-size:14px;color:#5b6a7f;\">the Brønsted–Lowry definitions<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">The Brønsted–Lowry model<\u002Fdiv>\n      <h3 style=\"margin:0 0 10px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">An acid is a proton donor; a base is a proton acceptor<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">A hydrogen atom is one proton and one electron. Take away the electron and only the proton is left, so “hydrogen ion”, “H<sup>+<\u002Fsup>” and “proton” all mean the same thing. In the Brønsted–Lowry model, an acid–base reaction is any reaction in which H<sup>+<\u002Fsup> moves from one species to another.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:6px;\">In water: water is the base<\u002Fdiv>\n          <div style=\"text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;color:#0d1b2a;padding:6px 0;\">HBr<sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> &nbsp;→&nbsp; H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + Br<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n          <div style=\"display:flex;justify-content:center;gap:28px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:#5b6a7f;\"><span><strong style=\"color:#1f5fbf;\">HBr<\u002Fstrong> donates H<sup>+<\u002Fsup><\u002Fspan><span><strong style=\"color:#b4790f;\">H<sub>2<\u002Fsub>O<\u002Fstrong> accepts H<sup>+<\u002Fsup><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:6px;\">No water at all<\u002Fdiv>\n          <div style=\"text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;color:#0d1b2a;padding:6px 0;\">NH<sub>3<\u002Fsub><sub>(g)<\u002Fsub> + HCl<sub>(g)<\u002Fsub> &nbsp;→&nbsp; NH<sub>4<\u002Fsub>Cl<sub>(s)<\u002Fsub><\u002Fdiv>\n          <div style=\"display:flex;justify-content:center;gap:28px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:#5b6a7f;\"><span><strong style=\"color:#1f5fbf;\">HCl<\u002Fstrong> donates H<sup>+<\u002Fsup><\u002Fspan><span><strong style=\"color:#b4790f;\">NH<sub>3<\u002Fsub><\u002Fstrong> accepts H<sup>+<\u002Fsup><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">The older Arrhenius model only describes acids that release H<sup>+<\u002Fsup> in water and bases that release OH<sup>−<\u002Fsup>. It cannot explain the gas reaction above, or why ammonia (which contains no OH<sup>−<\u002Fsup>) is a base. The Brønsted–Lowry model covers both, because it only asks where the proton goes.<\u002Fp>\n      <p style=\"margin:14px 0 0;font-size:13.5px;line-height:1.55;color:#3c4a5c;background:#f2f6fc;border-left:3px solid #1f5fbf;padding:10px 12px;border-radius:0 4px 4px 0;\"><strong style=\"color:#0d1b2a;\">Exam convention:<\u002Fstrong> use → when a strong acid or base reacts completely and ⇌ when a weak acid or base reacts partially. Always include states and ionic charges. H<sup>+<\u002Fsup><sub>(aq)<\u002Fsub> and H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub> are both accepted, but show H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> if the question asks for the reaction with water.<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ mc.wait1 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:20px 24px;margin-bottom:20px;font-size:15px;color:#3c4a5c;\">Answer the prediction question at the top of Recall to see the conversation between Alex and Jordan.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ mc.shown1 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Overheard in the lab<\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Who’s right?<\u002Fh3>\n      <p style=\"margin:0 0 16px;font-size:14.5px;color:#5b6a7f;\">Alex and Jordan are looking at the same white ring. Click Next to follow their conversation.<\u002Fp>\n      <figure style=\"margin:0 0 18px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n        <svg sc-camel-view-box=\"0 0 720 200\" style=\"width:100%;max-width:720px;height:auto;display:block;margin:0 auto;\" role=\"img\" aria-label=\"A sealed glass tube with ammonia-soaked cotton wool at the left end and hydrochloric acid-soaked cotton wool at the right end. The two gases diffuse towards each other and a white ring of ammonium chloride forms closer to the hydrochloric acid end.\">\n          <defs>\n            <marker id=\"bl-arA\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#b4790f\"><\u002Fpath><\u002Fmarker>\n            <marker id=\"bl-arB\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#1f5fbf\"><\u002Fpath><\u002Fmarker>\n          <\u002Fdefs>\n          <rect x=\"60\" y=\"70\" width=\"600\" height=\"50\" rx=\"25\" fill=\"#eef4fb\" stroke=\"#10284a\" stroke-width=\"2.5\"><\u002Frect>\n          <rect x=\"40\" y=\"74\" width=\"28\" height=\"42\" rx=\"4\" fill=\"#5b6a7f\"><\u002Frect>\n          <rect x=\"652\" y=\"74\" width=\"28\" height=\"42\" rx=\"4\" fill=\"#5b6a7f\"><\u002Frect>\n          <ellipse cx=\"98\" cy=\"95\" rx=\"26\" ry=\"19\" fill=\"#fdf6e6\" stroke=\"#b4790f\" stroke-width=\"2\" stroke-dasharray=\"4 3\"><\u002Fellipse>\n          <ellipse cx=\"622\" cy=\"95\" rx=\"26\" ry=\"19\" fill=\"#e6ecf6\" stroke=\"#1f5fbf\" stroke-width=\"2\" stroke-dasharray=\"4 3\"><\u002Fellipse>\n          <line x1=\"134\" y1=\"95\" x2=\"330\" y2=\"95\" stroke=\"#b4790f\" stroke-width=\"3\" marker-end=\"url(#bl-arA)\"><\u002Fline>\n          <line x1=\"586\" y1=\"95\" x2=\"470\" y2=\"95\" stroke=\"#1f5fbf\" stroke-width=\"3\" marker-end=\"url(#bl-arB)\"><\u002Fline>\n          <text x=\"232\" y=\"86\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"15\" fill=\"#8a5a08\">NH<tspan baseline-shift=\"sub\" font-size=\"11\">3<\u002Ftspan><tspan baseline-shift=\"sub\" font-size=\"11\">(g)<\u002Ftspan><\u002Ftext>\n          <text x=\"528\" y=\"86\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"15\" fill=\"#1f5fbf\">HCl<tspan baseline-shift=\"sub\" font-size=\"11\">(g)<\u002Ftspan><\u002Ftext>\n          <rect x=\"398\" y=\"72\" width=\"20\" height=\"46\" fill=\"#ffffff\" stroke=\"#9aa8bd\" stroke-width=\"1.5\"><\u002Frect>\n          <circle cx=\"404\" cy=\"84\" r=\"2.2\" fill=\"#9aa8bd\"><\u002Fcircle><circle cx=\"412\" cy=\"96\" r=\"2.2\" fill=\"#9aa8bd\"><\u002Fcircle><circle cx=\"405\" cy=\"107\" r=\"2.2\" fill=\"#9aa8bd\"><\u002Fcircle>\n          <text x=\"98\" y=\"38\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" fill=\"#0d1b2a\">cotton wool soaked in<\u002Ftext>\n          <text x=\"98\" y=\"56\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#8a5a08\">concentrated ammonia<\u002Ftext>\n          <text x=\"622\" y=\"38\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" fill=\"#0d1b2a\">cotton wool soaked in<\u002Ftext>\n          <text x=\"622\" y=\"56\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#1f5fbf\">concentrated HCl<\u002Ftext>\n          <text x=\"54\" y=\"140\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#5b6a7f\">stopper<\u002Ftext>\n          <text x=\"666\" y=\"140\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#5b6a7f\">stopper<\u002Ftext>\n          <line x1=\"408\" y1=\"122\" x2=\"408\" y2=\"144\" stroke=\"#10284a\" stroke-width=\"1.5\"><\u002Fline>\n          <text x=\"408\" y=\"162\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"#10284a\">white ring of NH<tspan baseline-shift=\"sub\" font-size=\"10\">4<\u002Ftspan>Cl<tspan baseline-shift=\"sub\" font-size=\"10\">(s)<\u002Ftspan><\u002Ftext>\n          <text x=\"408\" y=\"184\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12.5\" fill=\"#3c4a5c\">forms closer to the HCl end (lighter NH<tspan baseline-shift=\"sub\" font-size=\"9\">3<\u002Ftspan> diffuses faster)<\u002Ftext>\n          <text x=\"235\" y=\"140\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12.5\" fill=\"#3c4a5c\">dry glass tube: no liquid water<\u002Ftext>\n        <\u002Fsvg>\n        <figcaption style=\"margin-top:8px;font-size:13.5px;line-height:1.5;color:#3c4a5c;text-align:center;\">The two gases diffuse along the tube and react where they meet: NH<sub>3<\u002Fsub><sub>(g)<\u002Fsub> + HCl<sub>(g)<\u002Fsub> → NH<sub>4<\u002Fsub>Cl<sub>(s)<\u002Fsub>.<\u002Ffigcaption>\n      <\u002Ffigure>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;padding:12px 14px;margin-bottom:16px;background:#eef2f8;border-radius:5px;font-size:15px;color:#0d1b2a;\"><span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#5b6a7f;\">Your prediction<\u002Fspan><strong>{{ mc.predLine }}<\u002Fstrong><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:18px;margin-bottom:16px;\">\n        <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#b3261e;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:700;\">A<\u002Fspan><span style=\"font-size:14.5px;line-height:1.3;color:#0d1b2a;\"><strong>Alex<\u002Fstrong><br><span style=\"color:#5b6a7f;\">Year 12<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#1f5fbf;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:700;\">J<\u002Fspan><span style=\"font-size:14.5px;line-height:1.3;color:#0d1b2a;\"><strong>Jordan<\u002Fstrong><br><span style=\"color:#5b6a7f;\">Year 12<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:6px;padding:18px;display:grid;gap:12px;max-width:760px;\">\n        <sc-for list=\"{{ mc.chat }}\" as=\"l\" hint-placeholder-count=\"1\">\n          <div style=\"display:flex;gap:10px;align-items:flex-end;flex-direction:{{ l.dir }};\">\n            <span style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:{{ l.av }};color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:700;\">{{ l.ini }}<\u002Fspan>\n            <div style=\"max-width:78%;padding:10px 14px;border-radius:14px;background:{{ l.bg }};border:1px solid {{ l.bd }};font-size:15.5px;line-height:1.55;color:#0d1b2a;\">\n              <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;color:{{ l.av }};margin-bottom:2px;\">{{ l.who }}<\u002Fdiv>\n              <sc-for list=\"{{ l.seg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;\">\n        <sc-if value=\"{{ mc.chatMore }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ mc.chatNext }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">Next →<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ mc.chatAll }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Show whole conversation<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ mc.chatDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ mc.chatReplay }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Replay<\u002Fbutton>\n        <\u002Fsc-if>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#5b6a7f;\">{{ mc.chatProg }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ mc.chatDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:16px;padding:16px 18px;border-radius:5px;background:#eef7f2;border-left:3px solid #1a7f5a;font-size:15px;line-height:1.6;color:#0d1b2a;display:grid;gap:8px;\">\n        <div><strong>Answer: (b).<\u002Fstrong> {{ mc.fb1 }} HCl donates a proton to NH<sub>3<\u002Fsub>, forming NH<sub>4<\u002Fsub><sup>+<\u002Fsup> and Cl<sup>−<\u002Fsup>, which pack together as solid NH<sub>4<\u002Fsub>Cl. A proton transfer is an acid–base reaction, with or without water.<\u002Fdiv>\n        <div><strong>{{ mc.whyLead }}<\u002Fstrong> <sc-for list=\"{{ mc.whySeg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 16px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;background:#10284a;border-radius:3px;padding:4px 8px;\">Part 2<\u002Fspan><h3 style=\"margin:0;font-family:'IBM Plex Serif',Georgia,serif;font-size:22px;font-weight:600;color:#10284a;\">Conjugate acid–base pairs<\u002Fh3><span style=\"font-size:14px;color:#5b6a7f;\">two pairs in every reaction<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Forward and reverse<\u002Fdiv>\n      <h3 style=\"margin:0 0 10px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Each pair differs by exactly one H<sup>+<\u002Fsup><\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">When an acid gives away H<sup>+<\u002Fsup>, what is left can take an H<sup>+<\u002Fsup> back, so it is a base: the <strong style=\"color:#0d1b2a;\">conjugate base<\u002Fstrong>. When a base gains H<sup>+<\u002Fsup>, it can give it away again, so it is an acid: the <strong style=\"color:#0d1b2a;\">conjugate acid<\u002Fstrong>. In an equilibrium, the reverse reaction is also a proton transfer, from the conjugate acid to the conjugate base.<\u002Fp>\n      <div style=\"margin:0 0 16px;padding:14px 16px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:18px;color:#0d1b2a;\">acid + base &nbsp;⇌&nbsp; conjugate base + conjugate acid<\u002Fdiv>\n      <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 16px 14px;overflow-x:auto;\">\n        <div style=\"min-width:520px;max-width:620px;margin:0 auto;font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#0d1b2a;\">\n          <div style=\"display:grid;grid-template-columns:1.3fr 0.25fr 1fr 0.4fr 1.3fr 0.25fr 1fr;align-items:end;text-align:center;\">\n            <span style=\"color:#1f5fbf;font-weight:600;\">HCOOH<sub>(aq)<\u002Fsub><\u002Fspan><span>+<\u002Fspan><span style=\"color:#b4790f;font-weight:600;\">H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub><\u002Fspan><span>⇌<\u002Fspan><span style=\"color:#1f5fbf;font-weight:600;\">HCOO<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fspan><span>+<\u002Fspan><span style=\"color:#b4790f;font-weight:600;\">H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.3fr 0.25fr 1fr 0.4fr 1.3fr 0.25fr 1fr;text-align:center;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:#5b6a7f;margin-top:4px;\">\n            <span>acid<\u002Fspan><span><\u002Fspan><span>base<\u002Fspan><span><\u002Fspan><span>conjugate base<\u002Fspan><span><\u002Fspan><span>conjugate acid<\u002Fspan>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 620 40\" style=\"width:100%;height:auto;display:block;margin-top:6px;\" aria-hidden=\"true\">\n            <path d=\"M 73 2 V 14 H 406 V 2\" fill=\"none\" stroke=\"#1f5fbf\" stroke-width=\"2.5\"><\u002Fpath>\n            <path d=\"M 231 2 V 32 H 564 V 2\" fill=\"none\" stroke=\"#b4790f\" stroke-width=\"2.5\"><\u002Fpath>\n          <\u002Fsvg>\n          <div style=\"display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:#3c4a5c;margin-top:4px;\">\n            <span><strong style=\"color:#1f5fbf;\">Pair 1:<\u002Fstrong> HCOOH / HCOO<sup>−<\u002Fsup><\u002Fspan>\n            <span><strong style=\"color:#b4790f;\">Pair 2:<\u002Fstrong> H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> / H<sub>2<\u002Fsub>O<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px;\">\n        <div style=\"background:#e6ecf6;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Conjugate base = acid − one H<sup>+<\u002Fsup><\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#3c4a5c;\">Remove one H and lower the charge by 1. HCOOH → HCOO<sup>−<\u002Fsup>; NH<sub>4<\u002Fsub><sup>+<\u002Fsup> → NH<sub>3<\u002Fsub>.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fdf6e6;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#8a5a08;margin-bottom:6px;\">Conjugate acid = base + one H<sup>+<\u002Fsup><\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#3c4a5c;\">Add one H and raise the charge by 1. H<sub>2<\u002Fsub>O → H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>; CO<sub>3<\u002Fsub><sup>2−<\u002Fsup> → HCO<sub>3<\u002Fsub><sup>−<\u002Fsup>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:13.5px;line-height:1.55;color:#8a5a08;background:#fdf6e6;border-left:3px solid #e8a317;padding:10px 12px;border-radius:0 4px 4px 0;\"><strong>Traps:<\u002Fstrong> H<sub>2<\u002Fsub>SO<sub>4<\u002Fsub> / SO<sub>4<\u002Fsub><sup>2−<\u002Fsup> and H<sub>3<\u002Fsub>O<sup>+<\u002Fsup> / OH<sup>−<\u002Fsup> are <em>not<\u002Fem> conjugate pairs, because each differs by two H<sup>+<\u002Fsup>. And the conjugate acid of NH<sub>3<\u002Fsub> is NH<sub>4<\u002Fsub><sup>+<\u002Fsup>, not NH<sub>4<\u002Fsub>: adding H<sup>+<\u002Fsup> always changes the charge.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Interactive model: proton transfer<\u002Fdiv>\n      <h3 style=\"margin:0 0 6px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Move the proton and watch each species become its conjugate<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Pick a reaction, then drag the slider or press Play. Blue marks the acid and its conjugate base; amber marks the base and its conjugate acid. Predict the products before the proton arrives.<\u002Fp>\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;margin-bottom:8px;\">1. Choose a reaction<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;\">\n        <sc-for list=\"{{ pt.rxBtns }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:{{ s.bg }};color:{{ s.fg }};border:1px solid {{ s.bd }};border-radius:4px;padding:8px 12px;cursor:pointer;\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin:0 0 16px;padding:14px 16px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#0d1b2a;\"><sc-for list=\"{{ pt.eq }}\" as=\"e\" hint-placeholder-count=\"7\"><span style=\"color:{{ e.col }};font-weight:{{ e.fw }};\"><sc-for list=\"{{ e.seg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n      <label style=\"display:grid;gap:8px;margin-bottom:12px;padding:14px 16px;background:#e6ecf6;border:1px solid #1f5fbf;border-radius:5px;\">\n        <span style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;\"><span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;\">2. Drag to transfer the proton<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#10284a;\">{{ pt.stage }}<\u002Fspan><\u002Fspan>\n        <input type=\"range\" min=\"0\" max=\"10\" step=\"1\" value=\"{{ pt.t }}\" sc-camel-on-change=\"{{ pt.onT }}\" style=\"width:100%;height:24px;accent-color:#1f5fbf;cursor:pointer;\">\n        <span style=\"display:flex;justify-content:space-between;font-size:12.5px;color:#3c4a5c;\"><span>← reactants<\u002Fspan><span>products →<\u002Fspan><\u002Fspan>\n      <\u002Flabel>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;\">\n        <button sc-camel-on-click=\"{{ pt.playFwd }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">Play forward reaction<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ pt.playRev }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:10px 16px;cursor:pointer;\">Play reverse reaction<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:stretch;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n          <svg sc-camel-view-box=\"0 0 560 270\" style=\"width:100%;max-width:520px;height:auto;display:block;margin:0 auto;\" role=\"img\" aria-label=\"Molecule diagrams showing one hydrogen ion moving from the acid to the base\">\n            <ellipse cx=\"140\" cy=\"130\" rx=\"100\" ry=\"78\" fill=\"{{ pt.lFill }}\" stroke=\"{{ pt.lStroke }}\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"><\u002Fellipse>\n            <ellipse cx=\"420\" cy=\"130\" rx=\"100\" ry=\"78\" fill=\"{{ pt.rFill }}\" stroke=\"{{ pt.rStroke }}\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"><\u002Fellipse>\n            <path d=\"{{ pt.path }}\" fill=\"none\" stroke=\"#9aa8bd\" stroke-width=\"2\" stroke-dasharray=\"6 6\"><\u002Fpath>\n            <sc-for list=\"{{ pt.bonds }}\" as=\"b\" hint-placeholder-count=\"0\"><line x1=\"{{ b.x1 }}\" y1=\"{{ b.y1 }}\" x2=\"{{ b.x2 }}\" y2=\"{{ b.y2 }}\" stroke=\"#3c4a5c\" stroke-width=\"{{ b.w }}\" stroke-linecap=\"round\"><\u002Fline><\u002Fsc-for>\n            <sc-for list=\"{{ pt.atoms }}\" as=\"a\" hint-placeholder-count=\"0\"><circle cx=\"{{ a.x }}\" cy=\"{{ a.y }}\" r=\"{{ a.r }}\" fill=\"{{ a.fill }}\" stroke=\"#10284a\" stroke-width=\"1.5\"><\u002Fcircle><text x=\"{{ a.x }}\" y=\"{{ a.ty }}\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"{{ a.fs }}\" font-weight=\"700\" fill=\"{{ a.fg }}\">{{ a.el }}<\u002Ftext><\u002Fsc-for>\n            <sc-for list=\"{{ pt.charges }}\" as=\"c\" hint-placeholder-count=\"0\"><text x=\"{{ c.x }}\" y=\"{{ c.ty }}\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"17\" font-weight=\"700\" fill=\"#10284a\" stroke=\"#ffffff\" stroke-width=\"3\" paint-order=\"stroke\">{{ c.q }}<\u002Ftext><\u002Fsc-for>\n            <g transform=\"translate({{ pt.hx }},{{ pt.hy }})\">\n              <circle r=\"11\" fill=\"#ffffff\" stroke=\"#10284a\" stroke-width=\"2.5\"><\u002Fcircle>\n              <text y=\"4.5\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#10284a\">H<\u002Ftext>\n              <text x=\"15\" y=\"-9\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#10284a\" opacity=\"{{ pt.plusOp }}\">+<\u002Ftext>\n            <\u002Fg>\n            <text x=\"140\" y=\"238\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"19\" font-weight=\"600\" fill=\"#0d1b2a\"><sc-for list=\"{{ pt.lSeg }}\" as=\"g\" hint-placeholder-count=\"1\"><tspan>{{ g.t }}<\u002Ftspan><tspan baseline-shift=\"sub\" font-size=\"12\">{{ g.sb }}<\u002Ftspan><tspan baseline-shift=\"super\" font-size=\"12\">{{ g.sp }}<\u002Ftspan><\u002Fsc-for><\u002Ftext>\n            <text x=\"420\" y=\"238\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"19\" font-weight=\"600\" fill=\"#0d1b2a\"><sc-for list=\"{{ pt.rSeg }}\" as=\"g\" hint-placeholder-count=\"1\"><tspan>{{ g.t }}<\u002Ftspan><tspan baseline-shift=\"sub\" font-size=\"12\">{{ g.sb }}<\u002Ftspan><tspan baseline-shift=\"super\" font-size=\"12\">{{ g.sp }}<\u002Ftspan><\u002Fsc-for><\u002Ftext>\n            <text x=\"140\" y=\"262\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"{{ pt.lStroke }}\">{{ pt.lRole }}<\u002Ftext>\n            <text x=\"420\" y=\"262\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"14\" font-weight=\"600\" fill=\"{{ pt.rStroke }}\">{{ pt.rRole }}<\u002Ftext>\n          <\u002Fsvg>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:10px 2px 0;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:#3c4a5c;\">\n            <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#4b5563;border:1px solid #10284a;\"><\u002Fspan>C<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#d64545;border:1px solid #10284a;\"><\u002Fspan>O<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#7c5cc4;border:1px solid #10284a;\"><\u002Fspan>N<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#fff;border:1px solid #10284a;\"><\u002Fspan>H<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:16px;height:12px;border-radius:6px;background:#eef3fb;border:1.5px dashed #1f5fbf;\"><\u002Fspan>acid → its conjugate base<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:5px;\"><span style=\"width:16px;height:12px;border-radius:6px;background:#fdf8ec;border:1.5px dashed #b4790f;\"><\u002Fspan>base → its conjugate acid<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:8px 0 0;font-size:13.5px;line-height:1.5;color:#3c4a5c;\">Only the H<sup>+<\u002Fsup> moves. It leaves its electron behind, so the donor’s charge drops by 1 and the acceptor’s rises by 1.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n            <div style=\"background:#fff;border:1px solid #e7ecf3;border-left:3px solid #1f5fbf;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">Acid (proton donor)<\u002Fdiv><div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#10284a;\"><sc-for list=\"{{ pt.aSeg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e7ecf3;border-left:3px solid #b4790f;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">Base (proton acceptor)<\u002Fdiv><div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#10284a;\"><sc-for list=\"{{ pt.bSeg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e7ecf3;border-left:3px solid #1f5fbf;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">Conjugate base<\u002Fdiv><div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#10284a;opacity:{{ pt.prodOp }};\"><sc-for list=\"{{ pt.cbSeg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e7ecf3;border-left:3px solid #b4790f;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">Conjugate acid<\u002Fdiv><div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#10284a;opacity:{{ pt.prodOp }};\"><sc-for list=\"{{ pt.caSeg }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:#0d1b2a;\"><sc-for list=\"{{ pt.caption }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fp>\n          <p style=\"margin:0;font-size:14px;line-height:1.55;color:#3c4a5c;\"><sc-for list=\"{{ pt.pairs }}\" as=\"g\" hint-placeholder-count=\"1\">{{ g.t }}<sub>{{ g.sb }}<\u002Fsub><sup>{{ g.sp }}<\u002Fsup><\u002Fsc-for><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:14px;line-height:1.55;color:#3c4a5c;background:#f2f6fc;border-left:3px solid #1f5fbf;padding:10px 12px;border-radius:0 4px 4px 0;\"><strong style=\"color:#0d1b2a;\">Try this:<\u002Fstrong> compare the two hydrogencarbonate reactions. HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> is the acid in one and the base in the other. Then play the reverse reaction for ethanoic acid and check which species donates the proton back.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 16px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;background:#10284a;border-radius:3px;padding:4px 8px;\">Part 3<\u002Fspan><h3 style=\"margin:0;font-family:'IBM Plex Serif',Georgia,serif;font-size:22px;font-weight:600;color:#10284a;\">Determine the conjugate formula<\u002Fh3><span style=\"font-size:14px;color:#5b6a7f;\">one H, one charge<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">A three-step method<\u002Fdiv>\n      <h3 style=\"margin:0 0 10px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Change the H count by one, then the charge by one<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:12px 14px;\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;margin-bottom:4px;\">1. Decide the direction<\u002Fdiv><p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#3c4a5c;\">Conjugate base: take one H<sup>+<\u002Fsup> away. Conjugate acid: add one H<sup>+<\u002Fsup>.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:12px 14px;\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;margin-bottom:4px;\">2. Change the H subscript<\u002Fdiv><p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#3c4a5c;\">Change it by exactly one. Leave every other atom unchanged.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:12px 14px;\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;margin-bottom:4px;\">3. Change the charge<\u002Fdiv><p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#3c4a5c;\">Lower it by 1 for a conjugate base; raise it by 1 for a conjugate acid. 0 → −1, +1 → 0, −1 → −2.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto;\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;min-width:520px;font-family:'IBM Plex Serif',Georgia,serif;\">\n          <sc-raw-thead><sc-raw-tr style=\"text-align:left;\"><sc-raw-th style=\"padding:8px 8px 8px 0;border-bottom:2px solid #10284a;font-family:'IBM Plex Sans',sans-serif;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">Species<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-family:'IBM Plex Sans',sans-serif;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#1f5fbf;\">Conjugate base (− H<sup>+<\u002Fsup>)<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px 0 8px 8px;border-bottom:2px solid #10284a;font-family:'IBM Plex Sans',sans-serif;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#8a5a08;\">Conjugate acid (+ H<sup>+<\u002Fsup>)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;border-bottom:1px solid #e7ecf3;\">HNO<sub>2<\u002Fsub><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;\">NO<sub>2<\u002Fsub><sup>−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;border-bottom:1px solid #e7ecf3;color:#5b6a7f;font-family:'IBM Plex Sans';font-size:13.5px;\">not usually asked<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;border-bottom:1px solid #e7ecf3;\">CH<sub>3<\u002Fsub>NH<sub>2<\u002Fsub><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;color:#5b6a7f;font-family:'IBM Plex Sans';font-size:13.5px;\">not usually asked<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;border-bottom:1px solid #e7ecf3;\">CH<sub>3<\u002Fsub>NH<sub>3<\u002Fsub><sup>+<\u002Fsup><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;border-bottom:1px solid #e7ecf3;\">H<sub>2<\u002Fsub>PO<sub>4<\u002Fsub><sup>−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;\">HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;border-bottom:1px solid #e7ecf3;\">H<sub>3<\u002Fsub>PO<sub>4<\u002Fsub><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;border-bottom:1px solid #e7ecf3;\">HS<sup>−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;border-bottom:1px solid #e7ecf3;\">S<sup>2−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;border-bottom:1px solid #e7ecf3;\">H<sub>2<\u002Fsub>S<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:10px 8px 10px 0;\">H<sub>2<\u002Fsub>O<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 8px;\">OH<sup>−<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0 10px 8px;\">H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:13.5px;line-height:1.55;color:#8a5a08;background:#fdf6e6;border-left:3px solid #e8a317;padding:10px 12px;border-radius:0 4px 4px 0;\"><strong>Check the direction:<\u002Fstrong> HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> → H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub> adds an H, so H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub> is the conjugate <em>acid<\u002Fem> of HCO<sub>3<\u002Fsub><sup>−<\u002Fsup>, not its conjugate base. The conjugate base is CO<sub>3<\u002Fsub><sup>2−<\u002Fsup>.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 16px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;background:#10284a;border-radius:3px;padding:4px 8px;\">Part 4<\u002Fspan><h3 style=\"margin:0;font-family:'IBM Plex Serif',Georgia,serif;font-size:22px;font-weight:600;color:#10284a;\">Amphiprotic species<\u002Fh3><span style=\"font-size:14px;color:#5b6a7f;\">acid or base, depending on the partner<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Both roles<\u002Fdiv>\n      <h3 style=\"margin:0 0 10px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">An amphiprotic species can donate or accept a proton<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Whether it acts as an acid or a base depends on what it reacts with. Against a stronger acid it accepts H<sup>+<\u002Fsup>; against a stronger base it donates H<sup>+<\u002Fsup>.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;display:grid;gap:10px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;\">Water<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;\">HNO<sub>3<\u002Fsub><sub>(aq)<\u002Fsub> + <strong style=\"color:#b4790f;\">H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub><\u002Fstrong> → H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + NO<sub>3<\u002Fsub><sup>−<\u002Fsup><sub>(aq)<\u002Fsub><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:#8a5a08;\">water accepts H<sup>+<\u002Fsup>: base<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;\">CH<sub>3<\u002Fsub>NH<sub>2<\u002Fsub><sub>(aq)<\u002Fsub> + <strong style=\"color:#1f5fbf;\">H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub><\u002Fstrong> ⇌ CH<sub>3<\u002Fsub>NH<sub>3<\u002Fsub><sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:#1f5fbf;\">water donates H<sup>+<\u002Fsup>: acid<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;display:grid;gap:10px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;\">Hydrogensulfide ion, HS<sup>−<\u002Fsup><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;\"><strong style=\"color:#1f5fbf;\">HS<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fstrong> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ S<sup>2−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:#1f5fbf;\">HS<sup>−<\u002Fsup> donates H<sup>+<\u002Fsup>: acid<\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;\"><strong style=\"color:#b4790f;\">HS<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fstrong> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ H<sub>2<\u002Fsub>S<sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;color:#8a5a08;\">HS<sup>−<\u002Fsup> accepts H<sup>+<\u002Fsup>: base<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px;\">\n        <div style=\"background:#eef7f2;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#1a7f5a;margin-bottom:6px;\">How to spot one<\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#20402f;\">It still has an H it can donate, <em>and<\u002Fem> it can accept another H<sup>+<\u002Fsup> (it has a lone pair, often with a negative charge). The middle ions of polyprotic acids fit: HCO<sub>3<\u002Fsub><sup>−<\u002Fsup>, H<sub>2<\u002Fsub>PO<sub>4<\u002Fsub><sup>−<\u002Fsup>, HPO<sub>4<\u002Fsub><sup>2−<\u002Fsup>, HS<sup>−<\u002Fsup>.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:6px;\">Not amphiprotic<\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#3c4a5c;\">PO<sub>4<\u002Fsub><sup>3−<\u002Fsup>, CO<sub>3<\u002Fsub><sup>2−<\u002Fsup> and S<sup>2−<\u002Fsup> have no H left to donate, so they act only as bases. NH<sub>4<\u002Fsub><sup>+<\u002Fsup> and H<sub>3<\u002Fsub>PO<sub>4<\u002Fsub> act only as acids in water.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:13.5px;line-height:1.55;color:#3c4a5c;background:#f2f6fc;border-left:3px solid #1f5fbf;padding:10px 12px;border-radius:0 4px 4px 0;\"><strong style=\"color:#0d1b2a;\">Amphiprotic or amphoteric?<\u002Fstrong> Amphiprotic means it can donate <em>or<\u002Fem> accept a proton (a Brønsted–Lowry idea). Amphoteric is broader: the substance reacts with both acids and bases, like ZnO or Al<sub>2<\u002Fsub>O<sub>3<\u002Fsub>. Every amphiprotic species is amphoteric, but not every amphoteric substance is amphiprotic.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 16px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;background:#10284a;border-radius:3px;padding:4px 8px;\">Part 5<\u002Fspan><h3 style=\"margin:0;font-family:'IBM Plex Serif',Georgia,serif;font-size:22px;font-weight:600;color:#10284a;\">Buffer solutions<\u002Fh3><span style=\"font-size:14px;color:#5b6a7f;\">what they are, how they work, examples<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">What a buffer is<\u002Fdiv>\n      <h3 style=\"margin:0 0 10px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">A weak conjugate pair, in similar amounts, resists a change in pH<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">A buffer contains a <strong style=\"color:#0d1b2a;\">weak acid and its conjugate base<\u002Fstrong> (or a weak base and its conjugate acid), both in large and similar amounts. It resists a change in pH when a <strong style=\"color:#0d1b2a;\">small<\u002Fstrong> amount of acid or base is added.<\u002Fp>\n      <div style=\"background:#fdeeed;border-left:3px solid #b3261e;border-radius:0 5px 5px 0;padding:14px 16px;\">\n        <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#8c1d18;margin-bottom:6px;\">Why blood needs a buffer<\u002Fdiv>\n        <p style=\"margin:0 0 8px;font-size:14.5px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Blood must stay between <strong style=\"color:#0d1b2a;\">pH 7.35 and 7.45<\u002Fstrong>. Enzymes and proteins such as haemoglobin only hold their shape and work properly in this narrow range, so even a change of a few tenths of a pH unit disrupts them. Blood that is too acidic (acidosis) or too basic (alkalosis) causes confusion, fatigue and an irregular heartbeat, and a blood pH much outside about 6.8–7.8 is life-threatening.<\u002Fp>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Yet acid enters your blood all the time. Respiration produces CO<sub>2<\u002Fsub>, which forms carbonic acid, and hard exercise releases lactic acid from muscles. Without a buffer, each addition would shift the pH quickly and dangerously. The carbonate buffer absorbs these small additions so the pH barely moves.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:14px;\">\n          <figure style=\"margin:0;background:#fff;border:1px solid #f1d4d2;border-radius:6px;padding:16px 18px;\"><svg sc-camel-view-box=\"0 0 640 200\" style=\"width:100%;height:auto;display:block;\" role=\"img\" aria-label=\"Blood pH scale from 6.6 to 8.0. Normal blood is 7.35 to 7.45. Below is acidosis, above is alkalosis, and beyond about 6.8 and 7.8 is life-threatening.\"><defs><linearGradient id=\"bl-phg\" x1=\"0\" x2=\"1\" y1=\"0\" y2=\"0\"><stop offset=\"0%\" stop-color=\"#450a0a\"><\u002Fstop><stop offset=\"14.29%\" stop-color=\"#b91c1c\"><\u002Fstop><stop offset=\"42.86%\" stop-color=\"#ef4444\"><\u002Fstop><stop offset=\"53.57%\" stop-color=\"#f59e0b\"><\u002Fstop><stop offset=\"53.57%\" stop-color=\"#16a34a\"><\u002Fstop><stop offset=\"60.71%\" stop-color=\"#16a34a\"><\u002Fstop><stop offset=\"60.71%\" stop-color=\"#38bdf8\"><\u002Fstop><stop offset=\"85.71%\" stop-color=\"#1d4ed8\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#1e1b4b\"><\u002Fstop><\u002FlinearGradient><pattern id=\"bl-hatch\" width=\"8\" height=\"8\" sc-camel-pattern-units=\"userSpaceOnUse\" sc-camel-pattern-transform=\"rotate(45)\"><rect width=\"3\" height=\"8\" fill=\"#ffffff\" opacity=\"0.28\"><\u002Frect><\u002Fpattern><filter id=\"bl-sh\" x=\"-10%\" y=\"-30%\" width=\"120%\" height=\"160%\"><feDropShadow dx=\"0\" dy=\"2\" sc-camel-std-deviation=\"2\" flood-color=\"#10284a\" flood-opacity=\"0.18\"><\u002FfeDropShadow><\u002Ffilter><\u002Fdefs><rect x=\"30\" y=\"78\" width=\"580\" height=\"30\" rx=\"15\" fill=\"url(#bl-phg)\" filter=\"url(#bl-sh)\"><\u002Frect><rect x=\"30\" y=\"78\" width=\"82.9\" height=\"30\" rx=\"15\" fill=\"url(#bl-hatch)\"><\u002Frect><rect x=\"527.1\" y=\"78\" width=\"82.9\" height=\"30\" rx=\"15\" fill=\"url(#bl-hatch)\"><\u002Frect><line x1=\"30.0\" y1=\"110\" x2=\"30.0\" y2=\"117\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><text x=\"30.0\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">6.6<\u002Ftext><line x1=\"71.4\" y1=\"110\" x2=\"71.4\" y2=\"114\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><line x1=\"112.9\" y1=\"110\" x2=\"112.9\" y2=\"117\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><text x=\"112.9\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">6.8<\u002Ftext><line x1=\"154.3\" y1=\"110\" x2=\"154.3\" y2=\"114\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><line x1=\"195.7\" y1=\"110\" x2=\"195.7\" y2=\"117\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><text x=\"195.7\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">7.0<\u002Ftext><line x1=\"237.1\" y1=\"110\" x2=\"237.1\" y2=\"114\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><line x1=\"278.6\" y1=\"110\" x2=\"278.6\" y2=\"117\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><text x=\"278.6\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">7.2<\u002Ftext><line x1=\"320.0\" y1=\"110\" x2=\"320.0\" y2=\"114\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><line x1=\"361.4\" y1=\"110\" x2=\"361.4\" y2=\"117\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><line x1=\"402.9\" y1=\"110\" x2=\"402.9\" y2=\"114\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><line x1=\"444.3\" y1=\"110\" x2=\"444.3\" y2=\"117\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><text x=\"444.3\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">7.6<\u002Ftext><line x1=\"485.7\" y1=\"110\" x2=\"485.7\" y2=\"114\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><line x1=\"527.1\" y1=\"110\" x2=\"527.1\" y2=\"117\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><text x=\"527.1\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">7.8<\u002Ftext><line x1=\"568.6\" y1=\"110\" x2=\"568.6\" y2=\"114\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><line x1=\"610.0\" y1=\"110\" x2=\"610.0\" y2=\"117\" stroke=\"#5b6a7f\" stroke-width=\"1.2\"><\u002Fline><text x=\"610.0\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">8.0<\u002Ftext><rect x=\"337.7\" y=\"70\" width=\"47.4\" height=\"46\" rx=\"5\" fill=\"none\" stroke=\"#10284a\" stroke-width=\"2.5\"><\u002Frect><line x1=\"361.4\" y1=\"44\" x2=\"361.4\" y2=\"68\" stroke=\"#10284a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"269.4\" y=\"14\" width=\"184\" height=\"30\" rx=\"15\" fill=\"#16a34a\" filter=\"url(#bl-sh)\"><\u002Frect><text x=\"361.4\" y=\"34\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13.5\" font-weight=\"700\" fill=\"#fff\">normal blood: 7.35 – 7.45<\u002Ftext><text x=\"340.7\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10.5\" font-weight=\"700\" fill=\"#10284a\">7.35<\u002Ftext><text x=\"382.1\" y=\"130\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10.5\" font-weight=\"700\" fill=\"#10284a\">7.45<\u002Ftext><text x=\"226.8\" y=\"66\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"0.08em\" fill=\"#b91c1c\">ACIDOSIS<\u002Ftext><text x=\"454.6\" y=\"66\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"0.08em\" fill=\"#1d4ed8\">ALKALOSIS<\u002Ftext><text x=\"71.4\" y=\"66\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"0.08em\" fill=\"#450a0a\">FATAL<\u002Ftext><text x=\"568.6\" y=\"66\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"0.08em\" fill=\"#1e1b4b\">FATAL<\u002Ftext><text x=\"226.8\" y=\"156\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#7f1d1d\">confusion, fatigue,<\u002Ftext><text x=\"226.8\" y=\"172\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#7f1d1d\">irregular heartbeat<\u002Ftext><text x=\"454.6\" y=\"156\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#1e3a8a\">muscle cramps, twitching,<\u002Ftext><text x=\"454.6\" y=\"172\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#1e3a8a\">irregular heartbeat<\u002Ftext><text x=\"71.4\" y=\"156\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#450a0a\">life-<\u002Ftext><text x=\"71.4\" y=\"172\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#450a0a\">threatening<\u002Ftext><text x=\"568.6\" y=\"156\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#1e1b4b\">life-<\u002Ftext><text x=\"568.6\" y=\"172\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#1e1b4b\">threatening<\u002Ftext><\u002Fsvg><\u002Ffigure>\n          <figure style=\"margin:0;background:#fff;border:1px solid #f1d4d2;border-radius:6px;padding:16px 18px;\"><svg sc-camel-view-box=\"0 0 640 300\" style=\"width:100%;height:auto;display:block;\" role=\"img\" aria-label=\"Illustrative graph of blood pH during exercise. With the blood buffer, pH stays at about 7.37 inside the safe range. Without a buffer, it would fall to about 6.9.\"><defs><linearGradient id=\"bl-dropg\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#ef4444\" stop-opacity=\"0.05\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#ef4444\" stop-opacity=\"0.28\"><\u002Fstop><\u002FlinearGradient><filter id=\"bl-sh2\" x=\"-10%\" y=\"-30%\" width=\"120%\" height=\"160%\"><feDropShadow dx=\"0\" dy=\"1.5\" sc-camel-std-deviation=\"1.5\" flood-color=\"#10284a\" flood-opacity=\"0.2\"><\u002FfeDropShadow><\u002Ffilter><\u002Fdefs><rect x=\"179.2\" y=\"40\" width=\"321.6\" height=\"196.0\" fill=\"#fdf6e6\"><\ 76.7\" x2=\"608.0\" y2=\"76.7\" stroke=\"#16a34a\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\u002Fline><line x1=\"72.0\" y1=\"101.3\" x2=\"608.0\" y2=\"101.3\" stroke=\"#16a34a\" stroke-width=\"1\" stroke-dasharray=\"4 3\"><\u002Fline><text x=\"78.0\" y=\"71.7\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#15803d\">safe range 7.35–7.45<\u002Ftext><path d=\"M 72.0,89.0 L 179.2,89.0 C 216.7,89.0 248.9,191.9 313.2,201.7 S 447.2,216.4 500.8,211.5 C 543.7,206.6 575.8,187.0 608.0,179.6 L 608.0,89.0 L 179.2,89.0 Z\" fill=\"url(#bl-dropg)\"><\u002Fpath><path d=\"M 72.0,89.0 L 179.2,89.0 C 216.7,89.0 248.9,191.9 313.2,201.7 S 447.2,216.4 500.8,211.5 C 543.7,206.6 575.8,187.0 608.0,179.6\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"3\" stroke-dasharray=\"8 5\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M 72.0,89.0 L 179.2,89.0 C 211.4,89.0 227.4,95.9 265.0,96.3 L 500.8,97.3 C 543.7,96.8 570.5,91.0 608.0,90.2\" fill=\"none\" stroke=\"#15803d\" stroke-width=\"4\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"447.2\" cy=\"215.2\" r=\"5\" fill=\"#dc2626\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle><line x1=\"447.2\" y1=\"209.2\" x2=\"447.2\" y2=\"162.2\" stroke=\"#dc2626\" stroke-width=\"1.5\"><\u002Fline><g filter=\"url(#bl-sh2)\"><rect x=\"288.6\" y=\"138.2\" width=\"210\" height=\"24\" rx=\"12\" fill=\"#fff\" stroke=\"#dc2626\" stroke-width=\"1.5\"><\u002Frect><\u002Fg><text x=\"393.6\" y=\"154.2\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#b91c1c\">no buffer: pH falls ≈ 0.5 units<\u002Ftext><circle cx=\"366.8\" cy=\"96.8\" r=\"5\" fill=\"#15803d\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fcircle><line x1=\"366.8\" y1=\"102.8\" x2=\"366.8\" y2=\"113.7\" stroke=\"#15803d\" stroke-width=\"1.5\"><\u002Fline><g filter=\"url(#bl-sh2)\"><rect x=\"256.8\" y=\"113.7\" width=\"220\" height=\"24\" rx=\"12\" fill=\"#fff\" stroke=\"#15803d\" stroke-width=\"1.5\"><\u002Frect><\u002Fg><text x=\"366.8\" y=\"129.7\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#15803d\">buffered: pH falls only ≈ 0.03<\u002Ftext><line x1=\"72.0\" y1=\"40\" x2=\"72.0\" y2=\"236.0\" stroke=\"#5b6a7f\" stroke-width=\"1.5\"><\u002Fline><line x1=\"72.0\" y1=\"236.0\" x2=\"608.0\" y2=\"236.0\" stroke=\"#5b6a7f\" stroke-width=\"1.5\"><\u002Fline><line x1=\"72.0\" y1=\"236.0\" x2=\"72.0\" y2=\"241.0\" stroke=\"#5b6a7f\"><\u002Fline><text x=\"72.0\" y=\"255.0\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">0<\u002Ftext><line x1=\"179.2\" y1=\"236.0\" x2=\"179.2\" y2=\"241.0\" stroke=\"#5b6a7f\"><\u002Fline><text x=\"179.2\" y=\"255.0\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">2<\u002Ftext><line x1=\"286.4\" y1=\"236.0\" x2=\"286.4\" y2=\"241.0\" stroke=\"#5b6a7f\"><\u002Fline><text x=\"286.4\" y=\"255.0\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">4<\u002Ftext><line x1=\"393.6\" y1=\"236.0\" x2=\"393.6\" y2=\"241.0\" stroke=\"#5b6a7f\"><\u002Fline><text x=\"393.6\" y=\"255.0\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">6<\u002Ftext><line x1=\"500.8\" y1=\"236.0\" x2=\"500.8\" y2=\"241.0\" stroke=\"#5b6a7f\"><\u002Fline><text x=\"500.8\" y=\"255.0\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">8<\u002Ftext><line x1=\"608.0\" y1=\"236.0\" x2=\"608.0\" y2=\"241.0\" stroke=\"#5b6a7f\"><\u002Fline><text x=\"608.0\" y=\"255.0\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11.5\" fill=\"#5b6a7f\">10<\u002Ftext><text x=\"340.0\" y=\"292\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#3c4a5c\">time (minutes)<\u002Ftext><text x=\"18\" y=\"138.0\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#3c4a5c\" transform=\"rotate(-90 18 138.0)\">blood pH<\u002Ftext><line x1=\"76.0\" y1=\"18\" x2=\"102.0\" y2=\"18\" stroke=\"#15803d\" stroke-width=\"4\" stroke-linecap=\"round\"><\u002Fline><text x=\"110.0\" y=\"22\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#0d1b2a\">with the H<tspan baseline-shift=\"sub\" font-size=\"9\">2<\u002Ftspan>CO<tspan baseline-shift=\"sub\" font-size=\"9\">3<\u002Ftspan> / HCO<tspan baseline-shift=\"sub\" font-size=\"9\">3<\u002Ftspan><tspan baseline-shift=\"super\" font-size=\"9\">−<\u002Ftspan> buffer<\u002Ftext><line x1=\"318.6\" y1=\"18\" x2=\"345.4\" y2=\"18\" stroke=\"#dc2626\" stroke-width=\"3\" stroke-dasharray=\"8 5\"><\u002Fline><text x=\"353.4\" y=\"22\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#0d1b2a\">without a buffer<\u002Ftext><\u002Fsvg><figcaption style=\"margin-top:8px;font-size:13.5px;line-height:1.5;color:#3c4a5c;\">During exercise, muscles release lactic acid into the blood. Without a buffer, the extra H<sup>+<\u002Fsup> would drop blood pH well below 7.35. In real blood, HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> reacts with the added H<sup>+<\u002Fsup> to form H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub>, so the pH dips only slightly and stays in the safe range. The curves are illustrative, not measured data.<\u002Ffigcaption><\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #e7ecf3;margin:24px 0 18px;\"><\u002Fdiv>\n      <h4 style=\"margin:0 0 10px;font-size:18px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">How a buffer responds<\u002Fh4>\n      <p style=\"margin:0 0 14px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">In blood, HCO<sub>3<\u002Fsub><sup>−<\u002Fsup> removes added H<sup>+<\u002Fsup> and H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub> removes added OH<sup>−<\u002Fsup>. Le Châtelier’s principle explains why the pH changes only slightly.<\u002Fp>\n      <div style=\"margin:0 0 6px;padding:14px 16px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#0d1b2a;\">H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ HCO<sub>3<\u002Fsub><sup>−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n      <div style=\"margin:10px 0 16px;background:#f2f6fc;border-left:3px solid #1f5fbf;border-radius:0 5px 5px 0;padding:12px 14px;\">\n        <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;font-weight:600;color:#10284a;margin-bottom:6px;\">Where does the carbonic acid come from?<\u002Fdiv>\n        <p style=\"margin:0 0 8px;font-size:14.5px;line-height:1.55;color:#3c4a5c;max-width:80ch;\">Your cells produce CO<sub>2<\u002Fsub> during respiration. It dissolves in the blood and reacts with water to make carbonic acid. So the blood buffer is really two linked equilibria:<\u002Fp>\n        <div style=\"display:grid;gap:4px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;padding:4px 0 8px 4px;\">\n          <div><span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;color:#5b6a7f;\">Step 1<\u002Fspan> &nbsp;CO<sub>2<\u002Fsub><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub><sub>(aq)<\u002Fsub><\u002Fdiv>\n          <div><span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;color:#5b6a7f;\">Step 2<\u002Fspan> &nbsp;H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub><sub>(aq)<\u002Fsub> + H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ HCO<sub>3<\u002Fsub><sup>−<\u002Fsup><sub>(aq)<\u002Fsub> + H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#3c4a5c;max-width:80ch;\">When acid is added, step 2 shifts left and makes more H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub>. That pushes step 1 left too, turning the extra H<sub>2<\u002Fsub>CO<sub>3<\u002Fsub> into CO<sub>2<\u002Fsub>, which you breathe out. This is why the lungs help the buffer keep working.<\u002Fp>\n      <\u002Fdiv>\n      <figure style=\"margin:0 0 16px;background:#fff;border:1px solid #f1d4d2;border-radius:6px;padding:16px 18px;\"><svg sc-camel-view-box=\"0 0 760 345\" style=\"width:100%;height:auto;display:block;\" role=\"img\" aria-label=\"The blood buffer. Lactic acid from working muscle adds H3O+ to the blood. H3O+ reacts with HCO3- to form H2CO3, which forms CO2 and water. The lungs breathe out the CO2. The equilibria shift left.\"><defs><linearGradient id=\"bf-blood\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#fff1f1\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#fde2e2\"><\u002Fstop><\u002FlinearGradient><filter id=\"bf-sh\" x=\"-20%\" y=\"-30%\" width=\"140%\" height=\"170%\"><feDropShadow dx=\"0\" dy=\"2\" sc-camel-std-deviation=\"2\" flood-color=\"#10284a\" flood-opacity=\"0.18\"><\u002FfeDropShadow><\u002Ffilter><marker id=\"bf-a\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"context-stroke\"><\u002Fpath><\u002Fmarker><marker id=\"bf-g\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#15803d\"><\u002Fpath><\u002Fmarker><marker id=\"bf-r\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#b91c1c\"><\u002Fpath><\u002Fmarker><marker id=\"bf-n\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#9aa8bd\"><\u002Fpath><\u002Fmarker><marker id=\"bf-k\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"6\" sc-camel-marker-height=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#10284a\"><\u002Fpath><\u002Fmarker><\u002Fdefs><rect x=\"10\" y=\"96\" width=\"740\" height=\"138\" rx=\"22\" fill=\"url(#bf-blood)\" stroke=\"#f3b4b4\" stroke-width=\"1.5\"><\u002Frect><text x=\"30\" y=\"226\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"11\" font-weight=\"700\" letter-spacing=\"0.1em\" fill=\"#b91c1c\">BLOOD PLASMA<\u002Ftext><text x=\"430\" y=\"117\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12.5\" font-weight=\"700\" fill=\"#b91c1c\">← both equilibria shift left when acid is added<\u002Ftext><path d=\"M118 6 V26 M118 26 Q108 30 100 38 M118 26 Q128 30 136 38\" fill=\"none\" stroke=\"#be185d\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M98 28 C78 26 70 50 74 66 C77 76 92 78 104 72 C110 60 110 40 98 28 Z\" fill=\"#fbcfe8\" stroke=\"#be185d\" stroke-width=\"2\"><\u002Fpath><path d=\"M138 28 C158 26 166 50 162 66 C159 76 144 78 132 72 C126 60 126 40 138 28 Z\" fill=\"#fbcfe8\" stroke=\"#be185d\" stroke-width=\"2\"><\u002Fpath><text x=\"176\" y=\"34\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13.5\" font-weight=\"700\" fill=\"#10284a\">Lungs<\u002Ftext><text x=\"176\" y=\"52\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#3c4a5c\">CO<tspan baseline-shift=\"sub\" font-size=\"11\">2<\u002Ftspan> breathed out<\u002Ftext><line x1=\"105\" y1=\"132\" x2=\"105\" y2=\"84\" stroke=\"#15803d\" stroke-width=\"3\" marker-end=\"url(#bf-g)\"><\u002Fline><g filter=\"url(#bf-sh)\"><rect x=\"626\" y=\"14\" width=\"110\" height=\"52\" rx=\"16\" fill=\"#fecaca\" stroke=\"#b91c1c\" stroke-width=\"2\"><\u002Frect><\u002Fg><line x1=\"644\" y1=\"22\" x2=\"644\" y2=\"58\" stroke=\"#ef4444\" stroke-width=\"2\" opacity=\"0.6\"><\u002Fline><line x1=\"659\" y1=\"22\" x2=\"659\" y2=\"58\" stroke=\"#ef4444\" stroke-width=\"2\" opacity=\"0.6\"><\u002Fline><line x1=\"674\" y1=\"22\" x2=\"674\" y2=\"58\" stroke=\"#ef4444\" stroke-width=\"2\" opacity=\"0.6\"><\u002Fline><line x1=\"689\" y1=\"22\" x2=\"689\" y2=\"58\" stroke=\"#ef4444\" stroke-width=\"2\" opacity=\"0.6\"><\u002Fline><line x1=\"704\" y1=\"22\" x2=\"704\" y2=\"58\" stroke=\"#ef4444\" stroke-width=\"2\" opacity=\"0.6\"><\u002Fline><line x1=\"719\" y1=\"22\" x2=\"719\" y2=\"58\" stroke=\"#ef4444\" stroke-width=\"2\" opacity=\"0.6\"><\u002Fline><text x=\"612\" y=\"34\" text-anchor=\"end\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13.5\" font-weight=\"700\" fill=\"#10284a\">Working muscle<\u002Ftext><text x=\"612\" y=\"52\" text-anchor=\"end\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#3c4a5c\">lactic acid releases H<tspan baseline-shift=\"super\" font-size=\"9\">+<\u002Ftspan><\u002Ftext><line x1=\"681\" y1=\"70\" x2=\"681\" y2=\"130\" stroke=\"#b91c1c\" stroke-width=\"3\" marker-end=\"url(#bf-r)\"><\u002Fline><g filter=\"url(#bf-sh)\"><rect x=\"45\" y=\"135\" width=\"120\" height=\"50\" rx=\"25\" fill=\"#ffffff\" stroke=\"#9aa8bd\" stroke-width=\"2\"><\u002Frect><\u002Fg><text x=\"105.0\" y=\"166\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"19\" font-weight=\"600\" fill=\"#0d1b2a\">CO<tspan baseline-shift=\"sub\" font-size=\"11\">2<\u002Ftspan><tspan baseline-shift=\"sub\" font-size=\"11\">(aq)<\u002Ftspan><\u002Ftext><text x=\"105.0\" y=\"205\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#5b6a7f\">dissolved gas<\u002Ftext><g filter=\"url(#bf-sh)\"><rect x=\"232\" y=\"135\" width=\"140\" height=\"50\" rx=\"25\" fill=\"#e6ecf6\" stro
