document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"cbf81b5e-4384-448c-a179-604dd4dfd876\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>3.1.5 pH — QCE Chemistry Revision<\u002Ftitle>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400;1,600&amp;display=swap\" rel=\"stylesheet\">\n<style>\n  body { margin:0; background:#f4f6f9; color:#0d1b2a; font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }\n  a { color:#1f5fbf; text-decoration:none; }\n  a:hover { color:#10284a; text-decoration:underline; }\n  * { box-sizing:border-box; }\n  sub, sup { font-size:0.72em; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1080px;margin:0 auto;padding:0 24px 96px;\">\n\n  <header style=\"padding:56px 0 28px;border-bottom:2px solid #10284a;\">\n    <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:500;color:#1f5fbf;\">QCE Chemistry · Unit 3 · Equilibrium, acids and redox reactions<\u002Fdiv>\n    <h1 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:54px;line-height:1.05;margin:14px 0 12px;font-weight:600;color:#10284a;letter-spacing:-0.02em;\">3.1.5 pH<\u002Fh1>\n    <div style=\"margin-top:22px;background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:18px 20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:10px;\">Syllabus objectives: pH<\u002Fdiv>\n      <ul style=\"margin:0;padding-left:20px;display:grid;gap:7px;font-size:15px;line-height:1.55;color:#3c4a5c;\">\n        <li>Identify that water is a weak electrolyte and the self-ionisation of water is represented by <em>K<\u002Fem><sub>w<\u002Fsub>. (Formula: <em>K<\u002Fem><sub>w<\u002Fsub> = [H<sup>+<\u002Fsup>][OH<sup>–<\u002Fsup>])<\u002Fli>\n        <li>Apply <em>K<\u002Fem><sub>w<\u002Fsub> to calculate the concentration of hydrogen ions from the concentration of hydroxide ions in a solution.<\u002Fli>\n        <li>Calculate pH, hydrogen ion concentration [H<sup>+<\u002Fsup>(aq)], pOH and hydroxide ion concentrations [OH<sup>–<\u002Fsup>(aq)] for strong acids and bases. (Formula: pH = –log<sub>10<\u002Fsub> [H<sup>+<\u002Fsup>] and pOH = –log<sub>10<\u002Fsub>[OH<sup>–<\u002Fsup>])<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav ref=\"{{ nav.ref }}\" aria-label=\"Sections\" style=\"position:sticky;top:0;z-index:20;background:#f4f6f9;padding:14px 0;margin-bottom:28px;border-bottom:1px solid #dbe1ea;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;\">\n    <sc-for list=\"{{ nav.pills }}\" as=\"p\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{ p.go }}\" aria-current=\"{{ p.aria }}\" style=\"display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:999px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;color:#10284a;background:{{ p.bg }};border:1px solid {{ p.bd }};\">\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12.5px;font-weight:700;background:{{ p.nbg }};color:{{ p.nfg }};\">{{ p.num }}<\u002Fspan>\n        <span>{{ p.label }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n\n  <sc-if value=\"{{ nav.is.recall }}\" hint-placeholder-val=\"{{ true }}\">\n  <section id=\"recall\" data-screen-label=\"01 Recall\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid #dbe1ea;\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;color:#1f5fbf;\">01<\u002Fspan>\n      <h2 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:32px;margin:0;color:#10284a;font-weight:600;\">Recall the key ideas<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">True or false, and how sure are you?<\u002Fh3>\n      <p style=\"margin:0 0 6px;font-size:14.5px;color:#5b6a7f;\">Answer all ten before you start. You will see them again in the wrap-up.<\u002Fp>\n      <p style=\"margin:0 0 16px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5b6a7f;\">Confidence: 1 guessing · 2 leaning one way · 3 fairly sure · 4 certain<\u002Fp>\n      <div style=\"display:grid;gap:8px;\">\n        <sc-for list=\"{{ cm.rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n          <div style=\"display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;\">\n            <span style=\"width:26px;height:26px;border-radius:50%;background:#10284a;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;\">{{ r.n }}<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;\">\n              <span style=\"flex:1 1 300px;font-size:15px;line-height:1.5;color:#0d1b2a;\">{{ r.text }}<\u002Fspan>\n              <div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap;\">\n                <button sc-camel-on-click=\"{{ r.onT }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:7px 11px;border-radius:4px;cursor:pointer;background:{{ r.tBg }};color:{{ r.tFg }};border:1px solid {{ r.tBd }};\">True<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ r.onF }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:7px 11px;border-radius:4px;cursor:pointer;background:{{ r.fBg }};color:{{ r.fFg }};border:1px solid {{ r.fBd }};\">False<\u002Fbutton>\n                <span style=\"width:1px;height:22px;background:#dbe1ea;margin:0 4px;\"><\u002Fspan>\n                <sc-for list=\"{{ r.conf }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ c.onClick }}\" aria-label=\"{{ c.aria }}\" style=\"width:30px;height:30px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;border-radius:4px;cursor:pointer;background:{{ c.bg }};color:{{ c.fg }};border:1px solid {{ c.bd }};\">{{ c.n }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;\">\n        <button sc-camel-on-click=\"{{ cm.lock }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ cm.lockLabel }}<\u002Fbutton>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ cm.msgColor }};\">{{ cm.msg }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <h3 style=\"margin:0 0 10px;font-family:'IBM Plex Sans',sans-serif;font-size:17px;font-weight:600;color:#10284a;\">Start here<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;\">\n        <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#3c4a5c;text-wrap:pretty;\"><strong style=\"color:#0d1b2a;\">Water ionises slightly.<\u002Fstrong> A tiny fraction of water molecules transfer a proton to each other, so pure water contains a small, equal concentration of H<sup>+<\u002Fsup> and OH<sup>−<\u002Fsup> ions.<\u002Fp>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#3c4a5c;text-wrap:pretty;\"><strong style=\"color:#0d1b2a;\"><em>K<\u002Fem><sub>w<\u002Fsub> links the two ions.<\u002Fstrong> In every aqueous solution at 25 °C, [H<sup>+<\u002Fsup>][OH<sup>−<\u002Fsup>] = 1.00 × 10<sup>−14<\u002Fsup>. If you know one concentration, you can calculate the other.<\u002Fp>\n        <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#3c4a5c;text-wrap:pretty;\"><strong style=\"color:#0d1b2a;\">pH and pOH are log scales.<\u002Fstrong> pH = −log<sub>10<\u002Fsub>[H<sup>+<\u002Fsup>] and pOH = −log<sub>10<\u002Fsub>[OH<sup>−<\u002Fsup>]. Each unit is a factor of 10 in concentration, and at 25 °C pH + pOH = 14.00.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 16px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;background:#10284a;border-radius:3px;padding:4px 8px;\">Part 1<\u002Fspan><h3 style=\"margin:0;font-family:'IBM Plex Serif',Georgia,serif;font-size:22px;font-weight:600;color:#10284a;\">Water is a weak electrolyte<\u002Fh3><span style=\"font-size:14px;color:#5b6a7f;\">self-ionisation<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Self-ionisation of water<\u002Fdiv>\n      <h3 style=\"margin:0 0 10px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">One water molecule donates a proton to another<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Water acts as both an acid and a base. The reaction reaches equilibrium with almost all molecules unreacted, so the equation uses ⇌. H<sup>+<\u002Fsup>(aq) is shorthand for H<sub>3<\u002Fsub>O<sup>+<\u002Fsup>(aq).<\u002Fp>\n      <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;margin-bottom:14px;\">\n        <svg sc-camel-view-box=\"0 0 640 160\" style=\"width:100%;max-width:640px;height:auto;display:block;margin:0 auto;\" role=\"img\" aria-label=\"Two water molecules react to form a hydronium ion and a hydroxide ion\">\n          <defs><marker id=\"ar315\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f5fbf\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n          <path d=\"M92,52 Q130,6 168,52\" fill=\"none\" stroke=\"#1f5fbf\" stroke-width=\"2\" marker-end=\"url(#ar315)\"><\u002Fpath>\n          <text x=\"130\" y=\"20\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\" fill=\"#1f5fbf\">H⁺ transferred<\u002Ftext>\n          <circle cx=\"60\" cy=\"84\" r=\"22\" fill=\"#10284a\"><\u002Fcircle><text x=\"60\" y=\"89\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\">O<\u002Ftext>\n          <circle cx=\"38\" cy=\"110\" r=\"11\" fill=\"#fff\" stroke=\"#10284a\" stroke-width=\"1.5\"><\u002Fcircle><text x=\"38\" y=\"114\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#10284a\">H<\u002Ftext>\n          <circle cx=\"84\" cy=\"62\" r=\"11\" fill=\"#fff\" stroke=\"#1f5fbf\" stroke-width=\"2\"><\u002Fcircle><text x=\"84\" y=\"66\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#1f5fbf\">H<\u002Ftext>\n          <text x=\"125\" y=\"92\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"22\" fill=\"#0d1b2a\">+<\u002Ftext>\n          <circle cx=\"190\" cy=\"84\" r=\"22\" fill=\"#10284a\"><\u002Fcircle><text x=\"190\" y=\"89\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\">O<\u002Ftext>\n          <circle cx=\"168\" cy=\"110\" r=\"11\" fill=\"#fff\" stroke=\"#10284a\" stroke-width=\"1.5\"><\u002Fcircle><text x=\"168\" y=\"114\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#10284a\">H<\u002Ftext>\n          <circle cx=\"212\" cy=\"110\" r=\"11\" fill=\"#fff\" stroke=\"#10284a\" stroke-width=\"1.5\"><\u002Fcircle><text x=\"212\" y=\"114\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#10284a\">H<\u002Ftext>\n          <text x=\"275\" y=\"93\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"26\" fill=\"#0d1b2a\">⇌<\u002Ftext>\n          <circle cx=\"360\" cy=\"84\" r=\"22\" fill=\"#10284a\"><\u002Fcircle><text x=\"360\" y=\"89\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\">O<\u002Ftext>\n          <circle cx=\"338\" cy=\"110\" r=\"11\" fill=\"#fff\" stroke=\"#10284a\" stroke-width=\"1.5\"><\u002Fcircle><text x=\"338\" y=\"114\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#10284a\">H<\u002Ftext>\n          <circle cx=\"382\" cy=\"110\" r=\"11\" fill=\"#fff\" stroke=\"#10284a\" stroke-width=\"1.5\"><\u002Fcircle><text x=\"382\" y=\"114\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#10284a\">H<\u002Ftext>\n          <circle cx=\"360\" cy=\"50\" r=\"11\" fill=\"#fff\" stroke=\"#1f5fbf\" stroke-width=\"2\"><\u002Fcircle><text x=\"360\" y=\"54\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#1f5fbf\">H<\u002Ftext>\n          <text x=\"396\" y=\"58\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"20\" font-weight=\"700\" fill=\"#1f5fbf\">+<\u002Ftext>\n          <text x=\"450\" y=\"92\" text-anchor=\"middle\" font-family=\"IBM Plex Serif, Georgia, serif\" font-size=\"22\" fill=\"#0d1b2a\">+<\u002Ftext>\n          <circle cx=\"530\" cy=\"84\" r=\"22\" fill=\"#10284a\"><\u002Fcircle><text x=\"530\" y=\"89\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\">O<\u002Ftext>\n          <circle cx=\"556\" cy=\"106\" r=\"11\" fill=\"#fff\" stroke=\"#10284a\" stroke-width=\"1.5\"><\u002Fcircle><text x=\"556\" y=\"110\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#10284a\">H<\u002Ftext>\n          <text x=\"552\" y=\"66\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#b4790f\">−<\u002Ftext>\n          <text x=\"60\" y=\"148\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" fill=\"#3c4a5c\">H₂O<\u002Ftext>\n          <text x=\"190\" y=\"148\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" fill=\"#3c4a5c\">H₂O<\u002Ftext>\n          <text x=\"360\" y=\"148\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" fill=\"#3c4a5c\">H₃O⁺<\u002Ftext>\n          <text x=\"530\" y=\"148\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\" fill=\"#3c4a5c\">OH⁻<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:6px;\">Write it either way<\u002Fdiv>\n          <div style=\"text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;color:#0d1b2a;padding:4px 0;\">2H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n          <div style=\"text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;color:#0d1b2a;padding:4px 0;\">H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ H<sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fdiv>\n          <p style=\"margin:8px 0 0;font-size:13.5px;line-height:1.5;color:#3c4a5c;\">The ions are the <strong>products<\u002Fstrong>. Writing them as reactants is a common lost mark.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:6px;\">How small is \"slightly\"?<\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#3c4a5c;\">At 25 °C, [H<sup>+<\u002Fsup>] = 1.0 × 10<sup>−7<\u002Fsup> mol L<sup>−1<\u002Fsup>, while water itself is about 55.5 mol L<sup>−1<\u002Fsup>. That is roughly 2 ionised molecules in every billion, enough to conduct slightly. Water is a <strong style=\"color:#0d1b2a;\">weak electrolyte<\u002Fstrong>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto;margin-top:14px;\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;min-width:440px;\">\n          <sc-raw-thead><sc-raw-tr style=\"text-align:left;\"><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">Sample at 25 °C<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">Conductivity (µS cm<sup>−1<\u002Fsup>)<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">Electrolyte<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody style=\"font-family:'IBM Plex Serif',Georgia,serif;\">\n            <sc-raw-tr><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">Distilled water<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">2<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">weak (water only)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">Tap water<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">350<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">dissolved salts add ions<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">0.10 M NaCl<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">10 700<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">strong<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:9px 8px;\">0.10 M HCl<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;\">39 000<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;\">strong (H<sup>+<\u002Fsup> moves fastest)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\">Typical values. <strong style=\"color:#0d1b2a;\">Electrolyte:<\u002Fstrong> a substance that conducts when molten or dissolved because it forms mobile ions. A strong electrolyte forms mostly ions; a weak electrolyte forms only a small fraction of ions.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 16px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;background:#10284a;border-radius:3px;padding:4px 8px;\">Part 2<\u002Fspan><h3 style=\"margin:0;font-family:'IBM Plex Serif',Georgia,serif;font-size:22px;font-weight:600;color:#10284a;\">The ionic product of water, <em>K<\u002Fem><sub>w<\u002Fsub><\u002Fh3><span style=\"font-size:14px;color:#5b6a7f;\">one constant for every solution<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start;\">\n        <div>\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Equilibrium expression<\u002Fdiv>\n          <h3 style=\"margin:0 0 10px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Water is a pure liquid, so it is left out<\u002Fh3>\n          <p style=\"margin:0 0 14px;font-size:15px;line-height:1.6;color:#3c4a5c;\">Write the expression as you would for <em>K<\u002Fem><sub>c<\u002Fsub>. The same rule applies as for solids and liquids in heterogeneous equilibria (3.1.3).<\u002Fp>\n          <div style=\"background:#e6ecf6;border:1px solid #1f5fbf;border-radius:5px;padding:16px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:26px;color:#10284a;\"><em>K<\u002Fem><sub>w<\u002Fsub> = [H<sup>+<\u002Fsup>][OH<sup>−<\u002Fsup>]<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:6px;\">Formula and data book<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;color:#0d1b2a;line-height:1.8;\"><em>K<\u002Fem><sub>w<\u002Fsub> = 1.00 × 10<sup>−14<\u002Fsup> mol<sup>2<\u002Fsup> L<sup>−2<\u002Fsup> at 298 K (25 °C)<\u002Fdiv>\n          <div style=\"border-top:1px dashed #ccd5e2;margin-top:10px;padding-top:10px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;line-height:1.8;\">Pure water: [H<sup>+<\u002Fsup>] = [OH<sup>−<\u002Fsup>]<br>[H<sup>+<\u002Fsup>]<sup>2<\u002Fsup> = 1.00 × 10<sup>−14<\u002Fsup><br>[H<sup>+<\u002Fsup>] = [OH<sup>−<\u002Fsup>] = 1.0 × 10<sup>−7<\u002Fsup> mol L<sup>−1<\u002Fsup><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin:22px 0 8px;\">The see-saw at 25 °C: when one ion goes up, the other goes down<\u002Fdiv>\n      <div style=\"overflow-x:auto;\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:15px;min-width:520px;\">\n          <sc-raw-thead><sc-raw-tr style=\"text-align:left;\"><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">[H<sup>+<\u002Fsup>] (mol L<sup>−1<\u002Fsup>)<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">[OH<sup>−<\u002Fsup>] (mol L<sup>−1<\u002Fsup>)<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">[H<sup>+<\u002Fsup>][OH<sup>−<\u002Fsup>]<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px;border-bottom:2px solid #10284a;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#10284a;\">Solution<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody style=\"font-family:'IBM Plex Serif',Georgia,serif;\">\n            <sc-raw-tr><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−1<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−13<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−14<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">acidic<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−4<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−10<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−14<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">acidic<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr style=\"background:#f2f6fc;\"><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−7<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−7<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−14<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">neutral<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−11<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−3<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">1 × 10<sup>−14<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;border-bottom:1px solid #e7ecf3;\">basic<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:9px 8px;\">1 × 10<sup>−13<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;\">1 × 10<sup>−1<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;\">1 × 10<sup>−14<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 8px;\">basic<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:14px;line-height:1.55;color:#3c4a5c;background:#f2f6fc;border-left:3px solid #1f5fbf;padding:10px 12px;border-radius:0 4px 4px 0;\"><strong style=\"color:#0d1b2a;\">Le Châtelier:<\u002Fstrong> adding acid raises [H<sup>+<\u002Fsup>], so the self-ionisation equilibrium shifts left and uses up OH<sup>−<\u002Fsup>. An acidic solution still contains OH<sup>−<\u002Fsup>, just very little.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;margin-bottom:6px;\">Acid given: find [OH<sup>−<\u002Fsup>]<\u002Fdiv><div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:18px;color:#0d1b2a;\">[OH<sup>−<\u002Fsup>] = <span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.3;\"><span style=\"padding:0 5px 2px;border-bottom:1.5px solid currentColor;\"><em>K<\u002Fem><sub>w<\u002Fsub><\u002Fspan><span style=\"padding:2px 5px 0;\">[H<sup>+<\u002Fsup>]<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;margin-bottom:6px;\">Base given: find [H<sup>+<\u002Fsup>]<\u002Fdiv><div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:18px;color:#0d1b2a;\">[H<sup>+<\u002Fsup>] = <span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.3;\"><span style=\"padding:0 5px 2px;border-bottom:1.5px solid currentColor;\"><em>K<\u002Fem><sub>w<\u002Fsub><\u002Fspan><span style=\"padding:2px 5px 0;\">[OH<sup>−<\u002Fsup>]<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 16px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;background:#10284a;border-radius:3px;padding:4px 8px;\">Part 3<\u002Fspan><h3 style=\"margin:0;font-family:'IBM Plex Serif',Georgia,serif;font-size:22px;font-weight:600;color:#10284a;\">pH, pOH and the log scale<\u002Fh3><span style=\"font-size:14px;color:#5b6a7f;\">four quantities, one map<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px;\">\n        <div style=\"background:#e6ecf6;border:1px solid #1f5fbf;border-radius:5px;padding:14px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:20px;color:#10284a;\">pH = −log<sub>10<\u002Fsub>[H<sup>+<\u002Fsup>]<div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:#3c4a5c;margin-top:4px;\">formula book<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#e6ecf6;border:1px solid #1f5fbf;border-radius:5px;padding:14px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:20px;color:#10284a;\">pOH = −log<sub>10<\u002Fsub>[OH<sup>−<\u002Fsup>]<div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:#3c4a5c;margin-top:4px;\">formula book<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:20px;color:#10284a;\">pH + pOH = 14.00<div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:#3c4a5c;margin-top:4px;\">25 °C only · not in the formula book<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:20px;color:#10284a;\">[H<sup>+<\u002Fsup>] = 10<sup>−pH<\u002Fsup><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;color:#3c4a5c;margin-top:4px;\">[OH<sup>−<\u002Fsup>] = 10<sup>−pOH<\u002Fsup> · not in the formula book<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:10px;\">Given any one, you can reach the other three<\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 520 300\" style=\"width:100%;max-width:680px;height:auto;display:block;margin:0 auto;\" role=\"img\" aria-label=\"Conversion map linking pH, hydrogen ion concentration, hydroxide ion concentration and pOH\">\n            <defs>\n              <marker id=\"m315b\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1f5fbf\"><\u002Fpath><\u002Fmarker>\n              <marker id=\"m315a\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#b4790f\"><\u002Fpath><\u002Fmarker>\n              <marker id=\"m315n\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#5b6a7f\"><\u002Fpath><\u002Fmarker>\n            <\u002Fdefs>\n            <g font-family=\"IBM Plex Serif, Georgia, serif\" text-anchor=\"middle\">\n              <rect x=\"30\" y=\"34\" width=\"120\" height=\"52\" rx=\"26\" fill=\"#fff\" stroke=\"#1f5fbf\" stroke-width=\"2\"><\u002Frect>\n              <text x=\"90\" y=\"67\" font-size=\"20\" fill=\"#10284a\">pH<\u002Ftext>\n              <rect x=\"370\" y=\"34\" width=\"120\" height=\"52\" rx=\"26\" fill=\"#fff\" stroke=\"#1f5fbf\" stroke-width=\"2\"><\u002Frect>\n              <text x=\"430\" y=\"67\" font-size=\"20\" fill=\"#10284a\">[H⁺]<\u002Ftext>\n              <rect x=\"30\" y=\"214\" width=\"120\" height=\"52\" rx=\"26\" fill=\"#fff\" stroke=\"#b4790f\" stroke-width=\"2\"><\u002Frect>\n              <text x=\"90\" y=\"247\" font-size=\"20\" fill=\"#10284a\">pOH<\u002Ftext>\n              <rect x=\"370\" y=\"214\" width=\"120\" height=\"52\" rx=\"26\" fill=\"#fff\" stroke=\"#b4790f\" stroke-width=\"2\"><\u002Frect>\n              <text x=\"430\" y=\"247\" font-size=\"20\" fill=\"#10284a\">[OH⁻]<\u002Ftext>\n\n              <line x1=\"156\" y1=\"50\" x2=\"362\" y2=\"50\" stroke=\"#1f5fbf\" stroke-width=\"2\" marker-end=\"url(#m315b)\"><\u002Fline>\n              <text x=\"259\" y=\"40\" font-size=\"16\" fill=\"#0d1b2a\">[H⁺] = 10<tspan font-size=\"12\" dy=\"-7\">−pH<\u002Ftspan><\u002Ftext>\n              <line x1=\"364\" y1=\"70\" x2=\"158\" y2=\"70\" stroke=\"#1f5fbf\" stroke-width=\"2\" marker-end=\"url(#m315b)\"><\u002Fline>\n              <text x=\"259\" y=\"94\" font-size=\"16\" fill=\"#0d1b2a\">pH = −log<tspan font-size=\"12\" dy=\"4\">10<\u002Ftspan><tspan dy=\"-4\">[H⁺]<\u002Ftspan><\u002Ftext>\n\n              <line x1=\"156\" y1=\"230\" x2=\"362\" y2=\"230\" stroke=\"#b4790f\" stroke-width=\"2\" marker-end=\"url(#m315a)\"><\u002Fline>\n              <text x=\"259\" y=\"220\" font-size=\"16\" fill=\"#0d1b2a\">[OH⁻] = 10<tspan font-size=\"12\" dy=\"-7\">−pOH<\u002Ftspan><\u002Ftext>\n              <line x1=\"364\" y1=\"250\" x2=\"158\" y2=\"250\" stroke=\"#b4790f\" stroke-width=\"2\" marker-end=\"url(#m315a)\"><\u002Fline>\n              <text x=\"259\" y=\"274\" font-size=\"16\" fill=\"#0d1b2a\">pOH = −log<tspan font-size=\"12\" dy=\"4\">10<\u002Ftspan><tspan dy=\"-4\">[OH⁻]<\u002Ftspan><\u002Ftext>\n\n              <line x1=\"90\" y1=\"94\" x2=\"90\" y2=\"206\" stroke=\"#5b6a7f\" stroke-width=\"2\" marker-start=\"url(#m315n)\" marker-end=\"url(#m315n)\"><\u002Fline>\n              <text x=\"104\" y=\"146\" font-size=\"16\" fill=\"#0d1b2a\" text-anchor=\"start\">pH + pOH<\u002Ftext>\n              <text x=\"104\" y=\"166\" font-size=\"16\" fill=\"#0d1b2a\" text-anchor=\"start\">= 14.00<\u002Ftext>\n\n              <line x1=\"430\" y1=\"94\" x2=\"430\" y2=\"206\" stroke=\"#5b6a7f\" stroke-width=\"2\" marker-start=\"url(#m315n)\" marker-end=\"url(#m315n)\"><\u002Fline>\n              <text x=\"416\" y=\"146\" font-size=\"16\" fill=\"#0d1b2a\" text-anchor=\"end\">[H⁺][OH⁻]<\u002Ftext>\n              <text x=\"416\" y=\"166\" font-size=\"16\" fill=\"#0d1b2a\" text-anchor=\"end\">= <tspan font-style=\"italic\">K<\u002Ftspan><tspan font-size=\"12\" dy=\"4\">w<\u002Ftspan><\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n          <p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.5;color:#3c4a5c;\">Pick the shortest route. For a base, finding pOH first is usually easier than using <em>K<\u002Fem><sub>w<\u002Fsub>.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;\">\n          <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:6px;\">Where pH + pOH = 14.00 comes from<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;line-height:1.8;\">[H<sup>+<\u002Fsup>][OH<sup>−<\u002Fsup>] = 1.00 × 10<sup>−14<\u002Fsup><br>−log<sub>10<\u002Fsub>[H<sup>+<\u002Fsup>] + (−log<sub>10<\u002Fsub>[OH<sup>−<\u002Fsup>]) = −log<sub>10<\u002Fsub>(1.00 × 10<sup>−14<\u002Fsup>)<br><strong>pH + pOH = 14.00<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:6px;\">Each pH unit is a factor of 10<\u002Fdiv>\n            <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#3c4a5c;\">A solution of pH 2 has 10 times the [H<sup>+<\u002Fsup>] of pH 3 and 100 times the [H<sup>+<\u002Fsup>] of pH 4. Diluting a strong acid 10 times raises its pH by 1. As [H<sup>+<\u002Fsup>] increases, pH decreases.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px;\">\n        <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1a7f5a;margin-bottom:5px;\">Significant figures in pH<\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#20402f;\">The number of <strong>decimal places<\u002Fstrong> in a pH equals the number of <strong>significant figures<\u002Fstrong> in [H<sup>+<\u002Fsup>]. The whole-number part only records the power of ten.<\u002Fp>\n          <p style=\"margin:6px 0 0;font-family:'IBM Plex Serif',Georgia,serif;font-size:15px;color:#20402f;\">[H<sup>+<\u002Fsup>] = 2.5 × 10<sup>−11<\u002Fsup> M (2 s.f.) → pH 10.60 (2 d.p.)<br>pH 8.3 (1 d.p.) → [H<sup>+<\u002Fsup>] = 5 × 10<sup>−9<\u002Fsup> M (1 s.f.)<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ calc.isSharp }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;margin-bottom:6px;\">Key presses on the {{ calc.model }}<\u002Fdiv>\n          <div style=\"display:grid;gap:8px;font-size:14px;color:#3c4a5c;\">\n            <div><span style=\"color:#5b6a7f;\">pH from [H<sup>+<\u002Fsup>] = 2.5 × 10<sup>−11<\u002Fsup>:<\u002Fspan><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#10284a;background:#fff;border:1px solid #e7ecf3;border-radius:4px;padding:6px 8px;margin-top:3px;\">{{ calc.ph }}<\u002Fdiv><\u002Fdiv>\n            <div><span style=\"color:#5b6a7f;\">[H<sup>+<\u002Fsup>] from pH 2.60:<\u002Fspan><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#10284a;background:#fff;border:1px solid #e7ecf3;border-radius:4px;padding:6px 8px;margin-top:3px;\">{{ calc.inv }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:8px 0 0;font-size:13px;line-height:1.5;color:#5b6a7f;\">Put a scientific-notation value inside brackets after log. Sense check: pH 10.60 must lie between 10 and 11.<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ calc.isCasio }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:18px;background:#fff;border:1px solid #dbe1ea;border-top:4px solid #1f5fbf;border-radius:6px;padding:20px 22px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:4px;\">Calculator demo<\u002Fdiv>\n          <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Press the keys in order on the Casio fx-82AU<\u002Fh3>\n          <p style=\"margin:0 0 14px;font-size:14.5px;color:#5b6a7f;\">The blue ring shows the next key. Follow along on your own calculator.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;\">\n            <sc-for list=\"{{ kd.tabs }}\" as=\"tb\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ tb.onClick }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:{{ tb.bg }};color:{{ tb.fg }};border:1px solid {{ tb.bd }};border-radius:4px;padding:8px 12px;cursor:pointer;\">{{ tb.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;align-items:start;\">\n            <div style=\"position:relative;width:100%;max-width:280px;margin:0 auto;\">\n              <img src=\"5dd15a8d-422a-4aa2-9be2-c6ba5c5b6d43\" alt=\"Casio fx-82AU calculator\" style=\"width:100%;height:auto;display:block;border-radius:12px;\">\n              <div style=\"position:absolute;left:13.5%;top:20.5%;width:71%;height:11%;display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px;font-family:'IBM Plex Mono',monospace;color:#1d2b1f;\">\n                <div style=\"font-size:18px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;color:#1a1a1a;letter-spacing:0.02em;\"><sc-for list=\"{{ kd.screen }}\" as=\"sg\" hint-placeholder-count=\"0\"><span style=\"vertical-align:{{ sg.va }};font-size:{{ sg.fs }};\">{{ sg.t }}<\u002Fspan><\u002Fsc-for><span style=\"opacity:{{ kd.cursorOp }};vertical-align:{{ kd.curVa }};font-size:{{ kd.curFs }};\">▌<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:18px;font-weight:500;text-align:right;white-space:nowrap;color:#1a1a1a;\">{{ kd.result }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ kd.ringOn }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"position:absolute;left:{{ kd.rx }};top:{{ kd.ry }};width:16%;height:5.6%;transform:translate(-50%,-50%);border:3px solid #1f5fbf;border-radius:999px;box-shadow:0 0 0 3px rgba(255,255,255,0.85);transition:left 0.25s ease, top 0.25s ease;pointer-events:none;\"><\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:14px;\">\n              <div style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;color:#0d1b2a;\">{{ kd.title }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n                <sc-for list=\"{{ kd.chips }}\" as=\"ch\" hint-placeholder-count=\"9\">\n                  <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;padding:6px 9px;border-radius:4px;background:{{ ch.bg }};color:{{ ch.fg }};border:1px solid {{ ch.bd }};\">{{ ch.k }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"background:#f2f6fc;border-left:3px solid #1f5fbf;padding:10px 12px;border-radius:0 4px 4px 0;font-size:14.5px;line-height:1.55;color:#3c4a5c;\"><strong style=\"color:#0d1b2a;\">{{ kd.stepLabel }}<\u002Fstrong> {{ kd.note }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n                <button sc-camel-on-click=\"{{ kd.next }}\" disabled=\"{{ kd.atEnd }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;white-space:nowrap;flex-shrink:0;opacity:{{ kd.nextOp }};\" style-hover=\"background:#1f5fbf;\">Press next key<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ kd.back }}\" disabled=\"{{ kd.atStart }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;white-space:nowrap;flex-shrink:0;opacity:{{ kd.backOp }};\">Back one key<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ kd.play }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;white-space:nowrap;flex-shrink:0;\">{{ kd.playLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ kd.atEnd }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:12px 14px;border-radius:0 4px 4px 0;font-size:15px;line-height:1.55;color:#20402f;\"><strong>{{ kd.answer }}<\u002Fstrong> {{ kd.answerNote }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 16px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;background:#10284a;border-radius:3px;padding:4px 8px;\">Part 4<\u002Fspan><h3 style=\"margin:0;font-family:'IBM Plex Serif',Georgia,serif;font-size:22px;font-weight:600;color:#10284a;\">pH of strong acids and bases<\u002Fh3><span style=\"font-size:14px;color:#5b6a7f;\">interactive model<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Complete ionisation<\u002Fdiv>\n      <h3 style=\"margin:0 0 10px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Count the H<sup>+<\u002Fsup> or OH<sup>−<\u002Fsup> per formula unit first<\u002Fh3>\n      <p style=\"margin:0 0 16px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Strong acids and bases ionise completely, so the ion concentration comes straight from the solution concentration. In this course H<sub>2<\u002Fsub>SO<sub>4<\u002Fsub> is treated as fully diprotic, so [H<sup>+<\u002Fsup>] = 2 × [H<sub>2<\u002Fsub>SO<sub>4<\u002Fsub>]. Ba(OH)<sub>2<\u002Fsub> releases two OH<sup>−<\u002Fsup> per formula unit.<\u002Fp>\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;margin-bottom:8px;\">1. Choose a solution<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;\">\n        <sc-for list=\"{{ demo.sols }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:{{ s.bg }};color:{{ s.fg }};border:1px solid {{ s.bd }};border-radius:4px;padding:8px 12px;cursor:pointer;\">{{ s.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin:0 0 16px;padding:14px 16px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#0d1b2a;\">{{ demo.eq }}<\u002Fdiv>\n      <label style=\"display:grid;gap:8px;margin-bottom:16px;padding:14px 16px;background:#e6ecf6;border:1px solid #1f5fbf;border-radius:5px;\">\n        <span style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;\"><span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;\">2. Drag to change the concentration<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:16px;color:#10284a;\">{{ demo.cLabel }} mol L⁻¹<\u002Fspan><\u002Fspan>\n        <input type=\"range\" min=\"0\" max=\"{{ demo.max }}\" step=\"1\" value=\"{{ demo.ci }}\" sc-camel-on-change=\"{{ demo.onC }}\" style=\"width:100%;height:24px;accent-color:#1f5fbf;cursor:pointer;\">\n        <span style=\"display:flex;justify-content:space-between;font-size:12.5px;color:#3c4a5c;\"><span>← dilute (0.00010 M)<\u002Fspan><span>concentrated ({{ demo.maxLabel }} M) →<\u002Fspan><\u002Fspan>\n      <\u002Flabel>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:stretch;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n            <div style=\"background:#fff;border:1px solid #e7ecf3;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">[H⁺]<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:18px;color:#10284a;\">{{ demo.H }} M<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e7ecf3;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">[OH⁻]<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:18px;color:#10284a;\">{{ demo.OH }} M<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e7ecf3;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">pH<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:18px;color:#10284a;\">{{ demo.pH }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #e7ecf3;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">pOH<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:18px;color:#10284a;\">{{ demo.pOH }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;justify-content:space-between;font-size:13.5px;color:#3c4a5c;margin-bottom:5px;\"><span>Universal indicator colour<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;color:#10284a;\">{{ demo.kind }}<\u002Fspan><\u002Fdiv>\n            <div style=\"position:relative;padding-top:14px;\">\n              <div style=\"position:absolute;top:0;left:{{ demo.mk }};transform:translateX(-50%);font-size:12px;line-height:1;color:#10284a;\">▼<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(15,1fr);height:16px;border:1px solid #dbe1ea;border-radius:3px;overflow:hidden;\">\n                <sc-for list=\"{{ demo.strip }}\" as=\"c\" hint-placeholder-count=\"15\"><span style=\"background:{{ c }};\"><\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"position:relative;height:16px;margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">\n                <sc-for list=\"{{ demo.ticks }}\" as=\"tk\" hint-placeholder-count=\"15\"><span style=\"position:absolute;top:0;left:{{ tk.left }};transform:translateX(-50%);\">{{ tk.n }}<\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;justify-content:space-between;font-size:13.5px;color:#3c4a5c;margin-bottom:5px;\"><span>pH + pOH<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;color:#10284a;\">{{ demo.pH }} + {{ demo.pOH }} = 14.00<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;height:18px;border:1px solid #dbe1ea;border-radius:3px;overflow:hidden;background:#fff;\">\n              <div style=\"width:{{ demo.pHw }};background:#1f5fbf;\"><\u002Fdiv>\n              <div style=\"flex:1;background:#b4790f;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:16px;font-size:12.5px;color:#3c4a5c;margin-top:5px;\"><span style=\"display:flex;align-items:center;gap:6px;\"><span style=\"width:12px;height:12px;background:#1f5fbf;border-radius:2px;\"><\u002Fspan>pH<\u002Fspan><span style=\"display:flex;align-items:center;gap:6px;\"><span style=\"width:12px;height:12px;background:#b4790f;border-radius:2px;\"><\u002Fspan>pOH<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:14px 16px;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;color:#10284a;margin-bottom:10px;\">Working at 25 °C<\u002Fdiv>\n          <div style=\"display:grid;gap:9px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;\">\n            <sc-for list=\"{{ demo.lines }}\" as=\"l\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:22px 58px 1fr;column-gap:8px;align-items:baseline;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5b6a7f;\">{{ l.n }}<\u002Fspan><span style=\"text-align:right;font-weight:600;color:#10284a;white-space:nowrap;\">{{ l.v }}<\u002Fspan><span>{{ l.t }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.5;color:#3c4a5c;\">{{ demo.note }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:14px;line-height:1.55;color:#3c4a5c;background:#f2f6fc;border-left:3px solid #1f5fbf;padding:10px 12px;border-radius:0 4px 4px 0;\"><strong style=\"color:#0d1b2a;\">Try this:<\u002Fstrong> move the slider one step at a time from 0.010 to 0.0010 M HCl. Every ten-fold dilution raises the pH by exactly 1.00. Then compare HCl with H<sub>2<\u002Fsub>SO<sub>4<\u002Fsub> at the same concentration.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:12px;margin:36px 0 16px;flex-wrap:wrap;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#fff;background:#10284a;border-radius:3px;padding:4px 8px;\">Part 5<\u002Fspan><h3 style=\"margin:0;font-family:'IBM Plex Serif',Georgia,serif;font-size:22px;font-weight:600;color:#10284a;\">Neutral is not always pH 7<\u002Fh3><span style=\"font-size:14px;color:#5b6a7f;\"><em>K<\u002Fem><sub>w<\u002Fsub> and temperature<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:24px 26px;margin-bottom:20px;\">\n      <p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\"><em>K<\u002Fem><sub>w<\u002Fsub> is an equilibrium constant, so it changes only with temperature. The self-ionisation of water is endothermic:<\u002Fp>\n      <div style=\"margin:0 0 16px;padding:14px 16px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#0d1b2a;\">H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ H<sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub> &nbsp;&nbsp; Δ<em>H<\u002Fem> = +56 kJ mol<sup>−1<\u002Fsup><\u002Fdiv>\n      <p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Heating shifts this equilibrium to the right, so <em>K<\u002Fem><sub>w<\u002Fsub> rises and the pH of pure water falls. The water still stays neutral, because <strong>neutral is defined by equal concentrations<\u002Fstrong>, and heating raises both equally:<\u002Fp>\n      <div style=\"margin:0 0 16px;padding:14px 16px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#0d1b2a;\">neutral: &nbsp;[H<sup>+<\u002Fsup>] = [OH<sup>−<\u002Fsup>]<\u002Fdiv>\n      <p style=\"margin:0 0 12px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">But <strong>pH measures only [H<sup>+<\u002Fsup>]<\u002Fstrong>:<\u002Fp>\n      <div style=\"margin:0 0 16px;padding:14px 16px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;text-align:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:19px;color:#0d1b2a;\">pH = −log<sub>10<\u002Fsub>[H<sup>+<\u002Fsup>]<\u002Fdiv>\n      <p style=\"margin:0 0 16px;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">At higher temperatures there is more H<sup>+<\u002Fsup> at neutrality, so the neutral pH is lower than 7. When the water is colder than 25 °C, the neutral pH is higher than 7.<\u002Fp>\n      <label style=\"display:grid;gap:8px;margin-bottom:16px;padding:14px 16px;background:#e6ecf6;border:1px solid #1f5fbf;border-radius:5px;\">\n        <span style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;\"><span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;\">Drag to change the temperature of pure water<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:16px;color:#10284a;\">{{ temp.T }} °C<\u002Fspan><\u002Fspan>\n        <input type=\"range\" min=\"0\" max=\"5\" step=\"1\" value=\"{{ temp.ti }}\" sc-camel-on-change=\"{{ temp.onT }}\" style=\"width:100%;height:24px;accent-color:#1f5fbf;cursor:pointer;\">\n        <span style=\"display:flex;justify-content:space-between;font-size:12.5px;color:#3c4a5c;\"><span>← 0 °C<\u002Fspan><span>60 °C →<\u002Fspan><\u002Fspan>\n      <\u002Flabel>\n      <div style=\"margin-bottom:16px;padding:14px 16px;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px;\"><span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#10284a;\">Position of equilibrium<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#10284a;\">{{ temp.shift }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;\">\n          <span>H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub><\u002Fspan>\n          <div style=\"position:relative;height:24px;\">\n            <div style=\"position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:linear-gradient(90deg,#dbe1ea,#b4790f);\"><\u002Fdiv>\n            <div style=\"position:absolute;left:9%;top:3px;width:2px;height:18px;background:#5b6a7f;opacity:0.5;\"><\u002Fdiv>\n            <div style=\"position:absolute;left:{{ temp.eqPos }};top:2px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#1f5fbf;border:2px solid #fff;box-shadow:0 0 0 1px #1f5fbf;transition:left 0.3s;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span>H<sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:13px;line-height:1.5;color:#5b6a7f;\">The grey tick marks the 25 °C position. The equilibrium lies far to the left: at 25 °C only about 2 in every billion water molecules are ionised. Heating nudges it to the right, but even at 60 °C almost all of the water is still H<sub>2<\u002Fsub>O molecules. The shift is exaggerated so you can see it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;\">\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\"><em>K<\u002Fem><sub>w<\u002Fsub><\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#10284a;\">{{ temp.Kw }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">[H⁺] = [OH⁻]<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#10284a;\">{{ temp.H }} M<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">pH = pOH<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#10284a;\">{{ temp.pH }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#5b6a7f;\">pH + pOH<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#10284a;\">{{ temp.sum }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#eef7f2;border:1px solid #1a7f5a;border-radius:4px;padding:10px 12px;\"><div style=\"font-size:12.5px;color:#1a7f5a;\">Pure water is<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#1a7f5a;\">neutral<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;\">\n        <div style=\"display:flex;justify-content:space-between;font-size:13.5px;color:#3c4a5c;margin-bottom:5px;\"><span><em>K<\u002Fem><sub>w<\u002Fsub> relative to 1.0 × 10<sup>−13<\u002Fsup><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;color:#10284a;\">{{ temp.ratio }} × the 25 °C value<\u002Fspan><\u002Fdiv>\n        <div style=\"height:14px;background:#fff;border:1px solid #dbe1ea;border-radius:3px;overflow:hidden;\"><div style=\"height:100%;width:{{ temp.w }};background:#5b3f9e;\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\">Literature values for pure water. Use the formula-book value (25 °C) unless a question gives you another <em>K<\u002Fem><sub>w<\u002Fsub>. In general, pH + pOH = p<em>K<\u002Fem><sub>w<\u002Fsub>, where p<em>K<\u002Fem><sub>w<\u002Fsub> = −log<sub>10<\u002Fsub><em>K<\u002Fem><sub>w<\u002Fsub>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ nav.is.worked }}\" hint-placeholder-val=\"{{ false }}\">\n  <section id=\"worked\" data-screen-label=\"02 Worked examples\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px;padding-bottom:12px;border-bottom:1px sol
