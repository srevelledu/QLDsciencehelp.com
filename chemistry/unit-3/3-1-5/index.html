id #dbe1ea;\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;color:#1f5fbf;\">02<\u002Fspan>\n      <h2 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:32px;margin:0;color:#10284a;font-weight:600;\">Work through five examples<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 22px;font-size:15.5px;color:#5b6a7f;max-width:70ch;\">Try each one yourself first, then open the solution to compare. All examples are at 25 °C.<\u002Fp>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Worked example 1: [OH<sup>−<\u002Fsup>] in a strong acid<\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Calculate the concentration of hydroxide ions in a 2.5 × 10<sup>−3<\u002Fsup> mol L<sup>−1<\u002Fsup> solution of nitric acid.<\u002Fstrong> (2 marks)<\u002Fp>\n      <button sc-camel-on-click=\"{{ t.w1 }}\" style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ label.w1 }}<\u002Fbutton>\n      <sc-if value=\"{{ open.w1 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;border-top:1px solid #e7ecf3;padding-top:20px;display:grid;gap:18px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Think<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">\"Calculate\" means show working. HNO<sub>3<\u002Fsub> is a strong monoprotic acid, so [H<sup>+<\u002Fsup>] equals the acid concentration. Rearrange <em>K<\u002Fem><sub>w<\u002Fsub> for the unknown before substituting.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Do<\u002Fdiv>\n            <div style=\"display:grid;gap:10px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;\">\n              <div>[H<sup>+<\u002Fsup>] = [HNO<sub>3<\u002Fsub>] = 2.5 × 10<sup>−3<\u002Fsup> mol L<sup>−1<\u002Fsup><\u002Fdiv>\n              <div>[OH<sup>−<\u002Fsup>] = <span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.3;\"><span style=\"padding:0 4px 1px;border-bottom:1.3px solid currentColor;\"><em>K<\u002Fem><sub>w<\u002Fsub><\u002Fspan><span style=\"padding:1px 4px 0;\">[H<sup>+<\u002Fsup>]<\u002Fspan><\u002Fspan> = <span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.3;\"><span style=\"padding:0 4px 1px;border-bottom:1.3px solid currentColor;\">1.00 × 10<sup>−14<\u002Fsup><\u002Fspan><span style=\"padding:1px 4px 0;\">2.5 × 10<sup>−3<\u002Fsup><\u002Fspan><\u002Fspan><\u002Fdiv>\n              <div style=\"border-top:1px dashed #ccd5e2;padding-top:10px;\"><strong>[OH<sup>−<\u002Fsup>] = 4.0 × 10<sup>−12<\u002Fsup> mol L<sup>−1<\u002Fsup><\u002Fstrong> (2 s.f., matching the data)<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1a7f5a;margin-bottom:5px;\">Sense check<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#20402f;\">The solution is acidic, so [OH<sup>−<\u002Fsup>] must be much smaller than 1.0 × 10<sup>−7<\u002Fsup>. It is.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\"><strong style=\"color:#0d1b2a;\">Marker's eye:<\u002Fstrong> show the substitution line. It earns the method mark even if the final arithmetic slips.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Worked example 2: pH of a strong acid, with significant figures<\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Determine the pH of a 0.0350 mol L<sup>−1<\u002Fsup> hydrochloric acid solution.<\u002Fstrong> (2 marks)<\u002Fp>\n      <button sc-camel-on-click=\"{{ t.w2 }}\" style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ label.w2 }}<\u002Fbutton>\n      <sc-if value=\"{{ open.w2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;border-top:1px solid #e7ecf3;padding-top:20px;display:grid;gap:18px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Think<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">HCl ionises completely and donates one proton, so [H<sup>+<\u002Fsup>] = 0.0350 M. The concentration has 3 significant figures, so the pH needs 3 decimal places.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Do<\u002Fdiv>\n            <div style=\"display:grid;gap:10px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;\">\n              <div>[H<sup>+<\u002Fsup>] = [HCl] = 0.0350 mol L<sup>−1<\u002Fsup><\u002Fdiv>\n              <div>pH = −log<sub>10<\u002Fsub>(0.0350) = 1.45593…<\u002Fdiv>\n              <div style=\"border-top:1px dashed #ccd5e2;padding-top:10px;\"><strong>pH = 1.456<\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1a7f5a;margin-bottom:5px;\">Sense check<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#20402f;\">0.0350 lies between 0.1 (pH 1) and 0.01 (pH 2), so the pH must lie between 1 and 2.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\"><strong style=\"color:#0d1b2a;\">Marker's eye:<\u002Fstrong> \"1.46\" or \"1.5\" loses the significant-figures mark. Count the figures in the concentration, then use that many decimal places.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Worked example 3: pH of a strong base, two routes<\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Calculate the pH of a 0.0060 mol L<sup>−1<\u002Fsup> potassium hydroxide solution.<\u002Fstrong> (2 marks)<\u002Fp>\n      <button sc-camel-on-click=\"{{ t.w3 }}\" style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ label.w3 }}<\u002Fbutton>\n      <sc-if value=\"{{ open.w3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;border-top:1px solid #e7ecf3;padding-top:20px;display:grid;gap:18px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Think<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">KOH dissociates completely, giving one OH<sup>−<\u002Fsup> per formula unit. You can go via pOH or via <em>K<\u002Fem><sub>w<\u002Fsub>. Both give the same answer.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Do<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;\">\n              <div style=\"display:grid;gap:8px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:16px 18px;\">\n                <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;\">Route 1: via pOH<\u002Fdiv>\n                <div>[OH<sup>−<\u002Fsup>] = 0.0060 mol L<sup>−1<\u002Fsup><\u002Fdiv>\n                <div>pOH = −log<sub>10<\u002Fsub>(0.0060) = 2.22<\u002Fdiv>\n                <div><strong>pH = 14.00 − 2.22 = 11.78<\u002Fstrong><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;gap:8px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16px;color:#0d1b2a;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:16px 18px;\">\n                <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;\">Route 2: via <em>K<\u002Fem><sub>w<\u002Fsub><\u002Fdiv>\n                <div>[H<sup>+<\u002Fsup>] = <span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.3;\"><span style=\"padding:0 4px 1px;border-bottom:1.3px solid currentColor;\">1.00 × 10<sup>−14<\u002Fsup><\u002Fspan><span style=\"padding:1px 4px 0;\">0.0060<\u002Fspan><\u002Fspan> = 1.7 × 10<sup>−12<\u002Fsup> M<\u002Fdiv>\n                <div>pH = −log<sub>10<\u002Fsub>(1.67 × 10<sup>−12<\u002Fsup>)<\u002Fdiv>\n                <div><strong>pH = 11.78<\u002Fstrong><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1a7f5a;margin-bottom:5px;\">Sense check<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#20402f;\">A base must have pH above 7. If you get 2.22, you have stopped at pOH.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\"><strong style=\"color:#0d1b2a;\">Marker's eye:<\u002Fstrong> in Route 2, keep the unrounded [H<sup>+<\u002Fsup>] in your calculator. Rounding to 1.7 × 10<sup>−12<\u002Fsup> first gives 11.77.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Worked example 4: Concentrations from pH<\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">A sports drink has a pH of 3.40. <strong>Calculate the concentration of (a) hydrogen ions and (b) hydroxide ions in the drink.<\u002Fstrong> (4 marks)<\u002Fp>\n      <button sc-camel-on-click=\"{{ t.w4 }}\" style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ label.w4 }}<\u002Fbutton>\n      <sc-if value=\"{{ open.w4 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;border-top:1px solid #e7ecf3;padding-top:20px;display:grid;gap:18px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Think<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Undo the log with [H<sup>+<\u002Fsup>] = 10<sup>−pH<\u002Fsup>. For [OH<sup>−<\u002Fsup>], go through pOH. The pH has 2 decimal places, so each concentration has 2 significant figures.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Do<\u002Fdiv>\n            <div style=\"display:grid;gap:10px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;\">\n              <div>(a) [H<sup>+<\u002Fsup>] = 10<sup>−3.40<\u002Fsup> = 3.98… × 10<sup>−4<\u002Fsup><\u002Fdiv>\n              <div><strong>[H<sup>+<\u002Fsup>] = 4.0 × 10<sup>−4<\u002Fsup> mol L<sup>−1<\u002Fsup><\u002Fstrong><\u002Fdiv>\n              <div style=\"border-top:1px dashed #ccd5e2;padding-top:10px;\">(b) pOH = 14.00 − 3.40 = 10.60<\u002Fdiv>\n              <div>[OH<sup>−<\u002Fsup>] = 10<sup>−10.60<\u002Fsup> = 2.51… × 10<sup>−11<\u002Fsup><\u002Fdiv>\n              <div><strong>[OH<sup>−<\u002Fsup>] = 2.5 × 10<sup>−11<\u002Fsup> mol L<sup>−1<\u002Fsup><\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1a7f5a;margin-bottom:5px;\">Sense check<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#20402f;\">(4.0 × 10<sup>−4<\u002Fsup>) × (2.5 × 10<sup>−11<\u002Fsup>) = 1.0 × 10<sup>−14<\u002Fsup> = <em>K<\u002Fem><sub>w<\u002Fsub>.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\"><strong style=\"color:#0d1b2a;\">Marker's eye:<\u002Fstrong> the drink is acidic but still contains OH<sup>−<\u002Fsup>. Answering \"there is no OH<sup>−<\u002Fsup>\" for (b) earns no marks.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Worked example 5: A base that releases two OH<sup>−<\u002Fsup><\u002Fdiv>\n      <p style=\"margin:0 0 8px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Determine the pH and pOH of a 0.015 mol L<sup>−1<\u002Fsup> barium hydroxide solution.<\u002Fstrong> (3 marks)<\u002Fp>\n      <button sc-camel-on-click=\"{{ t.w5 }}\" style=\"margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">{{ label.w5 }}<\u002Fbutton>\n      <sc-if value=\"{{ open.w5 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:20px;border-top:1px solid #e7ecf3;padding-top:20px;display:grid;gap:18px;\">\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Think<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#3c4a5c;max-width:80ch;\">Write the dissociation to count the ions: Ba(OH)<sub>2<\u002Fsub>(s) → Ba<sup>2+<\u002Fsup>(aq) + 2OH<sup>−<\u002Fsup>(aq). Each formula unit gives two OH<sup>−<\u002Fsup>.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:8px;\">Do<\u002Fdiv>\n            <div style=\"display:grid;gap:10px;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;\">\n              <div>[OH<sup>−<\u002Fsup>] = 2 × 0.015 = 0.030 mol L<sup>−1<\u002Fsup><\u002Fdiv>\n              <div>pOH = −log<sub>10<\u002Fsub>(0.030) = <strong>1.52<\u002Fstrong><\u002Fdiv>\n              <div style=\"border-top:1px dashed #ccd5e2;padding-top:10px;\">pH = 14.00 − 1.52 = <strong>12.48<\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;\">\n            <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1a7f5a;margin-bottom:5px;\">Sense check<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#20402f;\">Forgetting the factor of 2 gives pH 12.18. Doubling [OH<sup>−<\u002Fsup>] should raise the pH by log<sub>10<\u002Fsub>2 = 0.30, and 12.48 − 12.18 = 0.30.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#5b6a7f;\"><strong style=\"color:#0d1b2a;\">Marker's eye:<\u002Fstrong> one mark each for [OH<sup>−<\u002Fsup>], pOH and pH. A wrong [OH<sup>−<\u002Fsup>] carried through correctly still earns the later marks.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ nav.is.consolidate }}\" hint-placeholder-val=\"{{ false }}\">\n  <section id=\"consolidate\" data-screen-label=\"03 Consolidate\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid #dbe1ea;\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;color:#1f5fbf;\">03<\u002Fspan>\n      <h2 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:32px;margin:0;color:#10284a;font-weight:600;\">Consolidate with practice activities<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 22px;font-size:15.5px;color:#5b6a7f;max-width:70ch;\">Five activities, from recall to full calculations. Answers save automatically.<\u002Fp>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Activity A: Fill in the blanks<\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Complete the rules for water and <em>K<\u002Fem><sub>w<\u002Fsub><\u002Fh3>\n      <p style=\"margin:0 0 18px;font-size:14.5px;color:#5b6a7f;\">Choose a word or phrase for each gap.<\u002Fp>\n      <div style=\"background:#f7f9fc;border:1px solid #e7ecf3;border-radius:5px;padding:18px 20px;font-family:'IBM Plex Serif',Georgia,serif;font-size:17px;line-height:2.3;color:#0d1b2a;\">\n        Water is a\n        <sc-raw-select value=\"{{ fb.b1.value }}\" sc-camel-on-change=\"{{ fb.b1.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b1.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"strong\">strong<\u002Foption><option value=\"weak\">weak<\u002Foption><option value=\"non\">non-<\u002Foption><\u002Fsc-raw-select>\n        electrolyte because only a tiny fraction of its molecules ionise. In the self-ionisation equation, H<sup>+<\u002Fsup> and OH<sup>−<\u002Fsup> are the\n        <sc-raw-select value=\"{{ fb.b2.value }}\" sc-camel-on-change=\"{{ fb.b2.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b2.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"react\">reactants<\u002Foption><option value=\"prod\">products<\u002Foption><\u002Fsc-raw-select>.\n        Water is left out of the <em>K<\u002Fem><sub>w<\u002Fsub> expression because it is a\n        <sc-raw-select value=\"{{ fb.b3.value }}\" sc-camel-on-change=\"{{ fb.b3.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b3.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"liq\">pure liquid<\u002Foption><option value=\"gas\">gas<\u002Foption><option value=\"spec\">spectator<\u002Foption><\u002Fsc-raw-select>.\n        At 25 °C, <em>K<\u002Fem><sub>w<\u002Fsub> =\n        <sc-raw-select value=\"{{ fb.b4.value }}\" sc-camel-on-change=\"{{ fb.b4.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b4.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"7\">1.00 × 10⁻⁷<\u002Foption><option value=\"14\">1.00 × 10⁻¹⁴<\u002Foption><option value=\"n14\">14.00<\u002Foption><\u002Fsc-raw-select>.\n        In a neutral solution, [H<sup>+<\u002Fsup>]\n        <sc-raw-select value=\"{{ fb.b5.value }}\" sc-camel-on-change=\"{{ fb.b5.onChange }}\" style=\"padding:4px 8px;border-radius:4px;background:#fff;font-family:'IBM Plex Sans';font-size:14.5px;color:#0d1b2a;border:1.5px solid {{ fb.b5.bd }};\"><option value=\"\">choose<\u002Foption><option value=\"gt\">is greater than<\u002Fopt eholder-count=\"1\"><span style=\"vertical-align:{{ h.va }};font-size:{{ h.fs }};font-style:{{ h.st }};\">{{ h.t }}<\u002Fspan><\u002Fsc-for><\u002Fspan><span style=\"padding:1px 4px 0;\"><sc-for list=\"{{ g.den }}\" as=\"h\" hint-placeholder-count=\"1\"><span style=\"vertical-align:{{ h.va }};font-size:{{ h.fs }};font-style:{{ h.st }};\">{{ h.t }}<\u002Fspan><\u002Fsc-for><\u002Fspan><\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff;border:2px solid #b4790f;border-radius:999px;padding:14px 6px;font-size:20px;color:#10284a;\">[OH<sup>−<\u002Fsup>]<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;\">\n        <button sc-camel-on-click=\"{{ checkLab }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">Check my labels<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetLab }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Start again<\u002Fbutton>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ labColor }};\">{{ labMsg }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;margin-bottom:6px;\">Activity D: Spot the errors<\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Three lines are wrong. Flag them.<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:14.5px;color:#5b6a7f;\">Question: Calculate the pH of 0.0050 mol L<sup>−1<\u002Fsup> barium hydroxide at 25 °C. A student wrote:<\u002Fp>\n      <div style=\"display:grid;gap:8px;\">\n        <button sc-camel-on-click=\"{{ l1.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l1.bg }};border:1px solid {{ l1.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L1<\u002Fspan><span>Ba(OH)<sub>2<\u002Fsub> is a strong base, so it dissociates completely in water.<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l1.mark }}<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ l2.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l2.bg }};border:1px solid {{ l2.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L2<\u002Fspan><span>[OH<sup>−<\u002Fsup>] = [Ba(OH)<sub>2<\u002Fsub>] = 0.0050 mol L<sup>−1<\u002Fsup><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l2.mark }}<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ l3.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l3.bg }};border:1px solid {{ l3.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L3<\u002Fspan><span>pOH = −log<sub>10<\u002Fsub>[OH<sup>−<\u002Fsup>]<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l3.mark }}<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ l4.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l4.bg }};border:1px solid {{ l4.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L4<\u002Fspan><span>pH = 14.00 + pOH<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l4.mark }}<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ l5.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:26px 1fr 20px;gap:12px;align-items:baseline;padding:14px 16px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Serif',Georgia,serif;font-size:16.5px;color:#0d1b2a;background:{{ l5.bg }};border:1px solid {{ l5.bd }};\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5b6a7f;\">L5<\u002Fspan><span>The pH is given to 1 decimal place, because the concentration has 2 significant figures.<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;\">{{ l5.mark }}<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;\">\n        <button sc-camel-on-click=\"{{ checkFlags }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#10284a;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;\" style-hover=\"background:#1f5fbf;\">Check my flags<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetFlags }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #ccd5e2;border-radius:4px;padding:11px 18px;cursor:pointer;\">Start again<\u002Fbutton>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:{{ flagColor }};\">{{ flagMsg }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ flagsDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:14px;background:#eef7f2;border-left:3px solid #1a7f5a;padding:14px 16px;border-radius:0 4px 4px 0;font-size:15px;line-height:1.6;color:#20402f;\">L2: Ba(OH)<sub>2<\u002Fsub> releases two OH<sup>−<\u002Fsup>, so [OH<sup>−<\u002Fsup>] = 0.010 M. L4: pH = 14.00 − pOH. L5: 2 significant figures gives 2 decimal places. Correct answer: pOH = 2.00, pH = 12.00.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;\">\n        <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Activity E: Self-check quiz<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#10284a;\">Question {{ quiz.progress }}<\u002Fdiv>\n      <\u002Fdiv>\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">Seven calculation questions with instant feedback<\u002Fh3>\n      <p style=\"margin:0 0 18px;font-size:14.5px;color:#5b6a7f;\">Use a calculator and paper. Your first attempt on each question counts towards the score.<\u002Fp>\n      <sc-if value=\"{{ quiz.notDone }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">{{ quiz.text }}<\u002Fp>\n        <div style=\"display:grid;gap:8px;max-width:640px;\">\n          <sc-for list=\"{{ quiz.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline;padding:11px 14px;border- \n  <section id=\"exam\" data-screen-label=\"04 Exam questions\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid #dbe1ea;\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;color:#1f5fbf;\">04<\u002Fspan>\n      <h2 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:32px;margin:0;color:#10284a;font-weight:600;\">Try exam-style questions<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 22px;font-size:15.5px;color:#5b6a7f;max-width:70ch;\">Answer each question fully on paper before you open the marking guide. Assume 25 °C unless stated. Total 22 marks · recommended 30 minutes.<\u002Fp>\n\n    <div style=\"display:grid;gap:18px;\">\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 1: Water as an electrolyte<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">3 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">The conductivity of distilled water is about 2 µS cm<sup>−1<\u002Fsup>, compared with 10 700 µS cm<sup>−1<\u002Fsup> for 0.10 mol L<sup>−1<\u002Fsup> sodium chloride. <strong>Explain<\u002Fstrong> why distilled water conducts electricity, but only very slightly. Include a relevant equation.<\u002Fp>\n        <button sc-camel-on-click=\"{{ t.q1 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q1 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ H<sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub> (or 2H<sub>2<\u002Fsub>O<sub>(l)<\u002Fsub> ⇌ H<sub>3<\u002Fsub>O<sup>+<\u002Fsup><sub>(aq)<\u002Fsub> + OH<sup>−<\u002Fsup><sub>(aq)<\u002Fsub>)<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">self-ionisation equation with ⇌, ions as products <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">Self-ionisation produces mobile ions, which carry charge, so the water conducts.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">links mobile ions to conduction <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">Only a tiny fraction of molecules ionise ([H<sup>+<\u002Fsup>] = [OH<sup>−<\u002Fsup>] = 1.0 × 10<sup>−7<\u002Fsup> mol L<sup>−1<\u002Fsup>), far fewer ions than in 0.10 M NaCl, so water is a weak electrolyte.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">very low ion concentration / weak electrolyte, compared with NaCl <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">A single arrow, or H<sup>+<\u002Fsup> and OH<sup>−<\u002Fsup> written as reactants, does not earn the equation mark.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 2: Applying <em>K<\u002Fem><sub>w<\u002Fsub><\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">2 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">A household cleaner has a hydroxide ion concentration of 3.2 × 10<sup>−3<\u002Fsup> mol L<sup>−1<\u002Fsup>. <strong>Calculate<\u002Fstrong> the concentration of hydrogen ions in the cleaner.<\u002Fp>\n        <button sc-camel-on-click=\"{{ t.q2 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q2 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">[H<sup>+<\u002Fsup>] = <span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.3;\"><span style=\"padding:0 4px 1px;border-bottom:1.3px solid currentColor;\"><em>K<\u002Fem><sub>w<\u002Fsub><\u002Fspan><span style=\"padding:1px 4px 0;\">[OH<sup>−<\u002Fsup>]<\u002Fspan><\u002Fspan> = <span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.3;\"><span style=\"padding:0 4px 1px;border-bottom:1.3px solid currentColor;\">1.00 × 10<sup>−14<\u002Fsup><\u002Fspan><span style=\"padding:1px 4px 0;\">3.2 × 10<sup>−3<\u002Fsup><\u002Fspan><\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">rearranges and substitutes into <em>K<\u002Fem><sub>w<\u002Fsub> <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">[H<sup>+<\u002Fsup>] = 3.1 × 10<sup>−12<\u002Fsup> mol L<sup>−1<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">correct value, 2 s.f., with unit <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">Accept a route via pOH (pOH = 2.49, pH = 11.51, [H<sup>+<\u002Fsup>] = 10<sup>−11.51<\u002Fsup>) if the working is shown.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 3: pH and pOH of a strong base<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">3 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\"><strong>Calculate<\u002Fstrong> the pOH and pH of a 0.0125 mol L<sup>−1<\u002Fsup> sodium hydroxide solution. Give each answer to the appropriate number of decimal places.<\u002Fp>\n        <button sc-camel-on-click=\"{{ t.q3 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q3 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">NaOH dissociates completely: [OH<sup>−<\u002Fsup>] = 0.0125 mol L<sup>−1<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">[OH<sup>−<\u002Fsup>] from complete dissociation <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">pOH = −log<sub>10<\u002Fsub>(0.0125) = 1.903<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">pOH to 3 d.p. <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">pH = 14.00 − 1.903 = 12.097<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">pH to 3 d.p. <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">The concentration has 3 significant figures, so both answers need 3 decimal places. Penalise incorrect rounding once only.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 4: Working back from pH<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">3 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">An oven cleaner is a solution of potassium hydroxide with a pH of 12.40. <strong>Determine<\u002Fstrong> the concentration of potassium hydroxide in the cleaner.<\u002Fp>\n        <button sc-camel-on-click=\"{{ t.q4 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q4 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">pOH = 14.00 − 12.40 = 1.60<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">pOH <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">[OH<sup>−<\u002Fsup>] = 10<sup>−1.60<\u002Fsup> = 0.025 mol L<sup>−1<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">[OH<sup>−<\u002Fsup>] to 2 s.f. <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">KOH is a strong base giving one OH<sup>−<\u002Fsup> per formula unit, so [KOH] = 0.025 mol L<sup>−1<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">links [OH<sup>−<\u002Fsup>] to [KOH] with a reason <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">Accept [H<sup>+<\u002Fsup>] = 10<sup>−12.40<\u002Fsup> = 4.0 × 10<sup>−13<\u002Fsup> M, then [OH<sup>−<\u002Fsup>] = <em>K<\u002Fem><sub>w<\u002Fsub> / [H<sup>+<\u002Fsup>], for the first two marks.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 5: Mixing an acid and a base<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">4 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">20.0 mL of 0.150 mol L<sup>−1<\u002Fsup> hydrochloric acid is mixed with 30.0 mL of 0.0800 mol L<sup>−1<\u002Fsup> sodium hydroxide. <strong>Calculate<\u002Fstrong> the pH of the final solution.<\u002Fp>\n        <button sc-camel-on-click=\"{{ t.q5 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q5 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q5 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">n(H<sup>+<\u002Fsup>) = 0.150 × 0.0200 = 3.00 × 10<sup>−3<\u002Fsup> mol; n(OH<sup>−<\u002Fsup>) = 0.0800 × 0.0300 = 2.40 × 10<sup>−3<\u002Fsup> mol<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">moles of both reactants <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">H<sup>+<\u002Fsup> + OH<sup>−<\u002Fsup> → H<sub>2<\u002Fsub>O (1 : 1). OH<sup>−<\u002Fsup> is limiting; excess n(H<sup>+<\u002Fsup>) = 3.00 × 10<sup>−3<\u002Fsup> − 2.40 × 10<sup>−3<\u002Fsup> = 6.0 × 10<sup>−4<\u002Fsup> mol<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">identifies excess H<sup>+<\u002Fsup> <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">Total volume = 50.0 mL; [H<sup>+<\u002Fsup>] = <span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.3;\"><span style=\"padding:0 4px 1px;border-bottom:1.3px solid currentColor;\">6.0 × 10<sup>−4<\u002Fsup><\u002Fspan><span style=\"padding:1px 4px 0;\">0.0500<\u002Fspan><\u002Fspan> = 0.012 mol L<sup>−1<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">concentration in the total volume <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">pH = −log<sub>10<\u002Fsub>(0.012) = 1.92<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">correct pH <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">Dividing by 20.0 mL instead of the total 50.0 mL gives pH 1.52 and loses the third mark. Follow through errors for the final mark.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 6: <em>K<\u002Fem><sub>w<\u002Fsub> at a higher temperature<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">4 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">The pH of pure water at 40 °C is 6.77.<\u002Fp>\n        <ul style=\"margin:0 0 12px;padding-left:22px;display:grid;gap:6px;font-size:16px;color:#3c4a5c;\">\n          <li>(a) <strong>Determine<\u002Fstrong> <em>K<\u002Fem><sub>w<\u002Fsub> at 40 °C. (2 marks)<\u002Fli>\n          <li>(b) Using your answer to (a), <strong>justify<\u002Fstrong> whether the self-ionisation of water is endothermic or exothermic. (2 marks)<\u002Fli>\n        <\u002Ful>\n        <button sc-camel-on-click=\"{{ t.q6 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q6 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q6 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(a) [H<sup>+<\u002Fsup>] = 10<sup>−6.77<\u002Fsup> = 1.7 × 10<sup>−7<\u002Fsup> mol L<sup>−1<\u002Fsup>. Pure water, so [OH<sup>−<\u002Fsup>] = [H<sup>+<\u002Fsup>].<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">[H<sup>+<\u002Fsup>] and recognises [H<sup>+<\u002Fsup>] = [OH<sup>−<\u002Fsup>] <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\"><em>K<\u002Fem><sub>w<\u002Fsub> = [H<sup>+<\u002Fsup>]<sup>2<\u002Fsup> = (1.70 × 10<sup>−7<\u002Fsup>)<sup>2<\u002Fsup> = 2.9 × 10<sup>−14<\u002Fsup><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">correct <em>K<\u002Fem><sub>w<\u002Fsub> <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">(b) <em>K<\u002Fem><sub>w<\u002Fsub> at 40 °C (2.9 × 10<sup>−14<\u002Fsup>) is larger than at 25 °C (1.00 × 10<sup>−14<\u002Fsup>), so raising the temperature shifts the equilibrium to the right.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">compares the two values and states the shift <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">By Le Châtelier's principle, an increase in temperature favours the endothermic direction, so the forward (self-ionisation) reaction is endothermic.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">endothermic, justified with Le Châtelier <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">\"The water is acidic at 40 °C\" is incorrect and should not appear: [H<sup>+<\u002Fsup>] = [OH<sup>−<\u002Fsup>], so it is neutral.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #dbe1ea;border-radius:6px;padding:24px 26px;\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;color:#1f5fbf;\">Question 7: A very dilute acid<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;color:#10284a;background:#eef2f8;padding:5px 10px;border-radius:3px;white-space:nowrap;\">3 marks<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#0d1b2a;max-width:80ch;\">A student calculates that 1.0 × 10<sup>−8<\u002Fsup> mol L<sup>−1<\u002Fsup> hydrochloric acid has a pH of 8.00. <strong>Evaluate<\u002Fstrong> the student's claim.<\u002Fp>\n        <button sc-camel-on-click=\"{{ t.q7 }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:10px 16px;cursor:pointer;\" style-hover=\"background:#10284a;color:#fff;\">{{ label.q7 }}<\u002Fbutton>\n        <sc-if value=\"{{ open.q7 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border-top:1px solid #e7ecf3;padding-top:16px;font-size:15px;overflow-x:auto;\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;width:58%;\">Sample response<\u002Fsc-raw-th><sc-raw-th style=\"padding:10px 12px;background:#10284a;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;text-align:left;border:1px solid #10284a;\">Marking points<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">The claim is invalid. pH 8.00 is basic, but adding an acid to water cannot make the solution basic.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">judgement, with a reason <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">The student ignored the H<sup>+<\u002Fsup> from water's self-ionisation (1.0 × 10<sup>−7<\u002Fsup> mol L<sup>−1<\u002Fsup>), which is ten times larger than the H<sup>+<\u002Fsup> from the HCl.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">identifies water as the main H<sup>+<\u002Fsup> source <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#0d1b2a;line-height:1.6;\">Total [H<sup>+<\u002Fsup>] is slightly above 1.0 × 10<sup>−7<\u002Fsup> mol L<sup>−1<\u002Fsup>, so the pH is slightly below 7 (about 6.98).<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 12px;border:1px solid #dbe1ea;vertical-align:top;color:#3c4a5c;line-height:1.55;background:#f7f9fc;\">states the pH is just below 7 <strong style=\"color:#1f5fbf;white-space:nowrap;\">[1]<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#5b6a7f;\">\"Evaluate\" needs a judgement backed by evidence. An exact value of 6.98 is not required; \"just below 7\" earns the mark.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ nav.is.wrapup }}\" hint-placeholder-val=\"{{ false }}\">\n  <section id=\"wrapup\" data-screen-label=\"05 Wrap-up\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid #dbe1ea;\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;color:#1f5fbf;\">05<\u002Fspan>\n      <h2 style=\"font-family:'IBM Plex Serif',Georgia,serif;font-size:32px;margin:0;color:#10284a;font-weight:600;\">Check you are ready<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #dbe1ea;border-top:4px solid #10284a;border-radius:6px;padding:26px 28px;margin-bottom:20px;\">\n      <h3 style=\"margin:0 0 4px;font-size:20px;font-family:'IBM Plex Serif',Georgia,serif;color:#10284a;\">What do you think now?<\u002Fh3>\n      < ff;\">Three habits that save marks:<\u002Fstrong> count the H<sup>+<\u002Fsup> or OH<sup>−<\u002Fsup> per formula unit before anything else; check that acids land below pH 7 and bases above; and match decimal places in pH to significant figures in the concentration.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid #dbe1ea;\">\n    <button sc-camel-on-click=\"{{ nav.prev }}\" disabled=\"{{ nav.atStart }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fff;color:#10284a;border:1px solid #10284a;border-radius:4px;padding:11px 18px;cursor:pointer;opacity:{{ nav.prevOp }};\">{{ nav.prevLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ nav.next }}\" disabled=\"{{ nav.atEnd }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:#1f5fbf;color:#fff;border:none;border-radius:4px;padding:11px 18px;cursor:pointer;opacity:{{ nav.nextOp }};\" style-hover=\"background:#10284a;\">{{ nav.nextLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;revealAllAnswers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Teaching mode&quot;},&quot;calculator&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Casio fx-82AU&quot;,&quot;Sharp EL-W531&quot;],&quot;default&quot;:&quot;Casio fx-82AU&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Teaching mode&quot;}}\">\nclass Component extends DCLogic {\n  state = { step: 0, visited: [0], open: {}, sol: \"HCl\", ci: 6, ti: 2, cm: {}, locked: false, rc: {}, rcShown: false,\n            fill: {}, fillChecked: false, lab: {}, labChecked: false, match: {}, matchChecked: false,\n            flags: {}, flagsChecke
